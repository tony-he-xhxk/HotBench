<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #e6f7f6;
    --panel: #ffffff;
    --line: #cdeae7;
    --ink: #1f3b39;
    --muted: #5d807d;
    --primary: #2bb3a6;
    --food: #ff7a6b;
    --shadow: 0 6px 20px rgba(43, 179, 166, .18);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 20px 16px;
  }
  .hud {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }
  .title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--primary);
  }
  .scores { display: flex; gap: 16px; font-size: 14px; color: var(--muted); }
  .scores b { color: var(--ink); font-size: 18px; font-variant-numeric: tabular-nums; }
  .board {
    position: relative;
    width: 100%;
    max-width: 420px;
    aspect-ratio: 1 / 1;
    background: var(--panel);
    border: 2px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
    touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 24px;
    background: rgba(255, 255, 255, .88);
    backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 { margin: 0; font-size: 22px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    background: var(--primary);
    color: #fff;
    font-weight: 600;
    transition: filter .15s;
  }
  button:hover { filter: brightness(1.06); }
  button.ghost {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  .tip { max-width: 420px; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.8; }
  kbd {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--line);
    border-bottom-width: 2px;
    border-radius: 5px;
    background: #fff;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 12px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="title">贪吃蛇</span>
    <span class="scores">
      <span>得分 <b id="score">0</b></span>
      <span>最高 <b id="best">0</b></span>
    </span>
  </div>

  <div class="board">
    <canvas id="cv" width="420" height="420"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">准备好了吗？</h2>
      <p id="ovText">方向键 / WASD 控制方向<br>每吃一个果实速度会略微提升</p>
      <div class="btns">
        <button id="btnMain">开始游戏</button>
        <button class="ghost" id="btnReset">清空记录</button>
      </div>
    </div>
  </div>

  <div class="tip">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
    <kbd>空格</kbd> 暂停 / 继续<br>
    手机上直接在棋盘内滑动即可
  </div>
</div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20;
  var BASE_STEP = 130;      // 初始每步毫秒
  var MIN_STEP = 55;        // 最快每步毫秒
  var SPEED_UP = 2.2;       // 每吃一个果实缩短的毫秒

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovText = document.getElementById('ovText');
  var btnMain = document.getElementById('btnMain');
  var btnReset = document.getElementById('btnReset');

  var snake, dir, queued, food, score, step, alive, running, paused, timer, started;

  var BEST_KEY = 'snake-best-score';

  function readBest() {
    var v = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
    return isNaN(v) ? 0 : v;
  }
  function writeBest(v) {
    try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) { /* 隐私模式忽略 */ }
  }

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queued = [];
    score = 0;
    step = BASE_STEP;
    alive = true;
    paused = false;
    placeFood();
    syncHud();
    draw();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var used = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { used = true; break; }
        }
        if (!used) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function syncHud() {
    scoreEl.textContent = score;
    var b = readBest();
    if (score > b) { writeBest(score); b = score; }
    bestEl.textContent = b;
  }

  function turn(nx, ny) {
    var last = queued.length ? queued[queued.length - 1] : dir;
    if (last.x === -nx && last.y === -ny) return;   // 禁止 180° 掉头
    if (last.x === nx && last.y === ny) return;     // 同向忽略
    if (queued.length < 2) queued.push({ x: nx, y: ny });
  }

  function tick() {
    if (queued.length) dir = queued.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return gameOver();
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver();
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      step = Math.max(MIN_STEP, step - SPEED_UP);
      placeFood();
      syncHud();
    } else {
      snake.pop();
    }
    draw();
  }

  function loop() {
    timer = setTimeout(function () {
      if (!running) return;
      if (!paused) tick();
      if (running) loop();
    }, step);
  }

  function start() {
    reset();
    started = true;
    running = true;
    hideOverlay();
    clearTimeout(timer);
    loop();
  }

  function gameOver() {
    alive = false;
    running = false;
    clearTimeout(timer);
    var b = readBest();
    showOverlay('游戏结束', '本局得分 <b>' + score + '</b><br>最高纪录 ' + b +
      (score >= b && score > 0 ? '<br>新纪录！' : ''), '再来一局');
    draw();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      showOverlay('已暂停', '按 <kbd>空格</kbd> 继续', '继续');
    } else {
      hideOverlay();
    }
  }

  function showOverlay(title, html, btn) {
    ovTitle.textContent = title;
    ovText.innerHTML = html;
    btnMain.textContent = btn;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() { overlay.classList.add('hidden'); }

  function draw() {
    var size = cv.width / COLS;
    ctx.clearRect(0, 0, cv.width, cv.height);

    // 网格
    ctx.strokeStyle = '#eaf7f5';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < COLS; i++) {
      ctx.moveTo(i * size + 0.5, 0); ctx.lineTo(i * size + 0.5, cv.height);
      ctx.moveTo(0, i * size + 0.5); ctx.lineTo(cv.width, i * size + 0.5);
    }
    ctx.stroke();

    // 果实
    if (food) {
      ctx.fillStyle = '#ff7a6b';
      ctx.beginPath();
      ctx.arc(food.x * size + size / 2, food.y * size + size / 2, size * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }

    // 蛇身
    for (var j = snake.length - 1; j >= 0; j--) {
      var s = snake[j];
      var t = j === 0 ? '#1f3b39' : '#2bb3a6';
      roundRect(s.x * size + 1, s.y * size + 1, size - 2, size - 2, j === 0 ? 5 : 4, t);
    }
  }

  function roundRect(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ---- 控制 ----
  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', 'w', 'a', 's', 'd', ' '].indexOf(k) >= 0) {
      e.preventDefault();
    }
    if (k === 'arrowup' || k === 'w') turn(0, -1);
    else if (k === 'arrowdown' || k === 's') turn(0, 1);
    else if (k === 'arrowleft' || k === 'a') turn(-1, 0);
    else if (k === 'arrowright' || k === 'd') turn(1, 0);
    else if (k === ' ') {
      if (running) togglePause();
      else if (started) start();
      else start();
    } else if (k === 'enter') {
      if (!running) start();
    }
  });

  // 触屏滑动
  var tsx = 0, tsy = 0;
  cv.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    tsx = t.clientX; tsy = t.clientY;
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    e.preventDefault();
    var t = e.changedTouches[0];
    var dx = t.clientX - tsx, dy = t.clientY - tsy;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    tsx = t.clientX; tsy = t.clientY;
  }, { passive: false });

  btnMain.addEventListener('click', function () {
    if (running && paused) togglePause();
    else start();
  });

  btnReset.addEventListener('click', function () {
    writeBest(0);
    bestEl.textContent = '0';
  });

  // 初始化：只画静态画面，等玩家点开始
  started = false;
  running = false;
  reset();
  bestEl.textContent = readBest();
})();
</script>
</body>
</html>
