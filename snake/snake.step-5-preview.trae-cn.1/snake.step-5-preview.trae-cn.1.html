<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e2e8f0;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 28px; letter-spacing: 4px; margin-bottom: 12px; color: #4ade80; }
  .scoreboard { display: flex; gap: 24px; margin-bottom: 12px; font-size: 15px; }
  .scoreboard span { color: #94a3b8; }
  .scoreboard b { color: #f8fafc; font-weight: 600; }
  .stage { position: relative; }
  canvas {
    background: #1e293b;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #334155, 0 12px 40px rgba(0,0,0,.5);
    display: block;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(15, 23, 42, .82);
    border-radius: 10px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; color: #f8fafc; }
  .overlay p { font-size: 14px; color: #94a3b8; line-height: 1.8; }
  .overlay .final { font-size: 18px; color: #4ade80; }
  button {
    margin-top: 6px;
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: #0f172a;
    background: #4ade80;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform .12s, background .12s;
  }
  button:hover { background: #22c55e; transform: scale(1.05); }
  .hint { margin-top: 12px; font-size: 13px; color: #64748b; text-align: center; line-height: 1.8; }
  .pad { display: none; margin-top: 14px; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(2, 60px); gap: 8px; }
  .pad button {
    margin: 0; font-size: 22px; padding: 0; border-radius: 12px;
    background: #334155; color: #e2e8f0; touch-action: manipulation;
  }
  .pad button:active { background: #4ade80; color: #0f172a; }
  .pad .up { grid-column: 2; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) { .pad { display: grid; } }
</style>
</head>
<body>
  <h1>贪 吃 蛇</h1>
  <div class="scoreboard">
    <div><span>得分 </span><b id="score">0</b></div>
    <div><span>最高分 </span><b id="best">0</b></div>
    <div><span>速度 </span><b id="level">1</b></div>
  </div>
  <div class="stage">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay" id="startScreen">
      <h2>准备开始</h2>
      <p>方向键 / WASD 控制移动<br>空格暂停，回车或点击按钮开始</p>
      <button id="startBtn">开始游戏</button>
    </div>
    <div class="overlay hidden" id="overScreen">
      <h2>游戏结束</h2>
      <p class="final">本局得分：<span id="finalScore">0</span></p>
      <p>按回车或点击按钮重新开始</p>
      <button id="restartBtn">再玩一次</button>
    </div>
  </div>
  <div class="pad">
    <button class="up" data-dir="up">▲</button>
    <button class="left" data-dir="left">◀</button>
    <button class="down" data-dir="down">▼</button>
    <button class="right" data-dir="right">▶</button>
  </div>
  <p class="hint">吃到食物变长，撞墙或撞到自己即失败 · 速度会随得分提升</p>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const GRID = 24;                 // 24 x 24 格子
  const CELL = canvas.width / GRID;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const levelEl = document.getElementById('level');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const finalScoreEl = document.getElementById('finalScore');

  let snake, dir, dirQueue, food, score, best, speed, timer, state; // state: ready|playing|paused|over
  best = Number(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
    dir = { x: 1, y: 0 };
    dirQueue = [];
    score = 0;
    speed = 160;
    state = 'ready';
    placeFood();
    updateHud();
    draw();
  }

  function placeFood() {
    while (true) {
      const f = {
        x: Math.floor(Math.random() * GRID),
        y: Math.floor(Math.random() * GRID)
      };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }

  function updateHud() {
    scoreEl.textContent = score;
    levelEl.textContent = Math.floor(score / 5) + 1;
  }

  function start() {
    reset();
    state = 'playing';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    if (state !== 'playing') return;
    if (dirQueue.length) dir = dirQueue.shift();

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID;
    // 即将移开的尾巴不算碰撞
    const body = snake.slice(0, -1);
    const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', best);
        bestEl.textContent = best;
      }
      updateHud();
      placeFood();
      // 每 5 分加速，最快 60ms
      const newSpeed = Math.max(60, 160 - Math.floor(score / 5) * 12);
      if (newSpeed !== speed) {
        speed = newSpeed;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    state = 'over';
    clearInterval(timer);
    finalScoreEl.textContent = score;
    overScreen.classList.remove('hidden');
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 棋盘格背景
    for (let y = 0; y < GRID; y++) {
      for (let x = 0; x < GRID; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#1e293b' : '#223049';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    // 食物（带脉动光圈）
    const pulse = 1 + Math.sin(Date.now() / 200) * 0.12;
    const fx = food.x * CELL + CELL / 2, fy = food.y * CELL + CELL / 2;
    ctx.fillStyle = 'rgba(248, 113, 113, .25)';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.62 * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f87171';
    ctx.beginPath();
    ctx.arc(fx, fy, CELL * 0.34, 0, Math.PI * 2);
    ctx.fill();

    // 蛇身
    snake.forEach((s, i) => {
      const t = 1 - i / snake.length;
      ctx.fillStyle = i === 0 ? '#4ade80' : `rgba(74, 222, 128, ${0.45 + t * 0.55})`;
      roundRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2, 5);
      ctx.fill();
    });

    // 蛇眼睛
    const h = snake[0];
    const ex = h.x * CELL, ey = h.y * CELL;
    const cx = ex + CELL / 2, cy = ey + CELL / 2;
    const ox = dir.y !== 0 ? CELL * 0.22 : dir.x * CELL * 0.18;
    const oy = dir.x !== 0 ? CELL * 0.22 : dir.y * CELL * 0.18;
    const fx2 = dir.x * CELL * 0.16, fy2 = dir.y * CELL * 0.16;
    ctx.fillStyle = '#0f172a';
    ctx.beginPath();
    ctx.arc(cx + (dir.y !== 0 ? ox : fx2), cy + (dir.x !== 0 ? oy : fy2), 2.6, 0, Math.PI * 2);
    ctx.arc(cx - (dir.y !== 0 ? ox : fx2), cy - (dir.x !== 0 ? oy : fy2), 2.6, 0, Math.PI * 2);
    ctx.fill();
  }

  // 食物脉动动画（非阻塞）
  setInterval(() => { if (state !== 'over') draw(); }, 60);

  function setDir(d) {
    const map = {
      up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
      left: { x: -1, y: 0 }, right: { x: 1, y: 0 }
    };
    const nd = map[d];
    if (!nd) return;
    const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
    // 禁止 180 度掉头；每 tick 最多排一个方向，避免快速按键丢失
    if (nd.x === -last.x && nd.y === -last.y) return;
    if (nd.x === last.x && nd.y === last.y) return;
    if (dirQueue.length < 2) dirQueue.push(nd);
  }

  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase()) || k === ' ') {
      e.preventDefault();
    }
    if (k === 'arrowup' || k === 'w') setDir('up');
    else if (k === 'arrowdown' || k === 's') setDir('down');
    else if (k === 'arrowleft' || k === 'a') setDir('left');
    else if (k === 'arrowright' || k === 'd') setDir('right');
    else if (k === ' ') {
      if (state === 'playing') {
        state = 'paused';
        clearInterval(timer);
        startScreen.querySelector('h2').textContent = '已暂停';
        startScreen.querySelector('p').innerHTML = '按空格或点击按钮继续';
        startScreen.querySelector('button').textContent = '继续';
        startScreen.classList.remove('hidden');
      } else if (state === 'paused') {
        state = 'playing';
        startScreen.classList.add('hidden');
        timer = setInterval(tick, speed);
      } else if (state === 'ready' || state === 'over') {
        start();
      }
    } else if (k === 'enter') {
      if (state !== 'playing') start();
    }
  });

  // 开始界面按钮（开始/继续复用）
  document.getElementById('startBtn').addEventListener('click', () => {
    if (state === 'paused') {
      state = 'playing';
      startScreen.classList.add('hidden');
      timer = setInterval(tick, speed);
    } else {
      start();
    }
  });
  document.getElementById('restartBtn').addEventListener('click', start);

  // 触屏方向键
  document.querySelectorAll('.pad button').forEach(btn => {
    btn.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state === 'ready' || state === 'over') start();
      setDir(btn.dataset.dir);
    }, { passive: false });
    btn.addEventListener('click', () => setDir(btn.dataset.dir));
  });

  // 点击画布：结束后重开 / 暂停时继续
  canvas.addEventListener('click', () => {
    if (state === 'over') start();
    else if (state === 'paused') {
      state = 'playing';
      startScreen.classList.add('hidden');
      timer = setInterval(tick, speed);
    }
  });

  reset();
})();
</script>
</body>
</html>
