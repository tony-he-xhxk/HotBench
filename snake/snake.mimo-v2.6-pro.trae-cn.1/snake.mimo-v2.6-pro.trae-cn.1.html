<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #14161f;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #e8eaf2;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 14px;
    color: #7ee787;
    text-shadow: 0 0 18px rgba(126, 231, 135, .35);
  }
  .bar {
    width: 480px;
    max-width: 92vw;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 15px;
    color: #9aa3b8;
  }
  .bar b { color: #ffd166; font-size: 20px; }
  .best b { color: #7ee787; }
  .wrap {
    position: relative;
    line-height: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .55), 0 0 0 1px #2b3145;
    max-width: 92vw;
  }
  canvas {
    display: block;
    width: 480px;
    height: 480px;
    max-width: 92vw;
    max-height: 92vw;
    background: #1b1f2c;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(15, 18, 28, .82);
    backdrop-filter: blur(3px);
    line-height: 1.6;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay .title { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
  .overlay .sub { font-size: 15px; color: #9aa3b8; margin-bottom: 18px; }
  .overlay .tip { font-size: 13px; color: #6c768d; margin-top: 14px; }
  .over .title { color: #ff6b6b; }
  button {
    font-family: inherit;
    font-size: 16px;
    padding: 11px 30px;
    border: none;
    border-radius: 999px;
    background: #7ee787;
    color: #14161f;
    font-weight: 700;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 22px rgba(126, 231, 135, .3);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(126, 231, 135, .42); }
  button:active { transform: translateY(0); }
  .hint {
    margin-top: 16px;
    font-size: 13px;
    color: #6c768d;
    letter-spacing: 1px;
  }
  .pad {
    margin-top: 18px;
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(2, 56px);
    gap: 8px;
  }
  .pad button {
    width: 56px;
    height: 56px;
    padding: 0;
    border-radius: 14px;
    background: #262c3d;
    color: #c9d1e3;
    font-size: 22px;
    box-shadow: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pad .up { grid-column: 2; grid-row: 1; }
  .pad .left { grid-column: 1; grid-row: 2; }
  .pad .down { grid-column: 2; grid-row: 2; }
  .pad .right { grid-column: 3; grid-row: 2; }
  @media (pointer: coarse) {
    .pad { display: grid; }
  }
</style>
</head>
<body>

<h1>贪 吃 蛇</h1>

<div class="bar">
  <span>得分 <b id="score">0</b></span>
  <span class="best">最高 <b id="best">0</b></span>
</div>

<div class="wrap">
  <canvas id="game" width="480" height="480"></canvas>

  <div class="overlay" id="startScreen">
    <div class="title">贪吃蛇</div>
    <div class="sub">吃掉食物，别撞墙也别咬到自己</div>
    <button id="startBtn">开始游戏</button>
    <div class="tip">方向键 / WASD 控制移动，空格暂停</div>
  </div>

  <div class="overlay over hidden" id="overScreen">
    <div class="title">游戏结束</div>
    <div class="sub">本局得分 <span id="finalScore">0</span></div>
    <button id="restartBtn">再来一局</button>
    <div class="tip">按 Enter 也可以重新开始</div>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="title">已暂停</div>
    <div class="sub">按空格继续</div>
    <button id="resumeBtn">继续游戏</button>
  </div>
</div>

<div class="pad">
  <button class="up" data-dir="up">▲</button>
  <button class="left" data-dir="left">◀</button>
  <button class="down" data-dir="down">▼</button>
  <button class="right" data-dir="right">▶</button>
</div>

<div class="hint">空格暂停 · Enter 重新开始</div>

<script>
(function () {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const COLS = 24;
  const ROWS = 24;
  const CELL = canvas.width / COLS;

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const startScreen = document.getElementById('startScreen');
  const overScreen = document.getElementById('overScreen');
  const pauseScreen = document.getElementById('pauseScreen');

  const BEST_KEY = 'snake_best_score';
  let best = 0;
  try {
    best = parseInt(localStorage.getItem(BEST_KEY), 10) || 0;
  } catch (e) {
    best = 0;
  }
  bestEl.textContent = best;

  const BASE_SPEED = 150;   // 每步毫秒
  const MIN_SPEED = 70;

  let snake, dir, nextDir, food, score, speed, timer, state;

  // state: 'ready' | 'playing' | 'paused' | 'over'
  function reset() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy }
    ];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speed = BASE_SPEED;
    scoreEl.textContent = '0';
    spawnFood();
  }

  function spawnFood() {
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        let hit = false;
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { hit = true; break; }
        }
        if (!hit) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function setDir(d) {
    const map = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const nd = map[d];
    if (!nd) return;
    // 不允许直接掉头
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
    if (state === 'ready') start();
    if (state === 'over') { /* 等待重开 */ }
  }

  function step() {
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      return gameOver();
    }
    // 咬到自己（尾巴会移动，所以排除尾巴格；吃到食物时尾巴不动）
    const willGrow = food && head.x === food.x && head.y === food.y;
    const bodyLen = willGrow ? snake.length : snake.length - 1;
    for (let i = 0; i < bodyLen; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        return gameOver();
      }
    }

    snake.unshift(head);

    if (willGrow) {
      score += 10;
      scoreEl.textContent = score;
      // 每 50 分提速一档
      if (score % 50 === 0 && speed > MIN_SPEED) {
        speed = Math.max(MIN_SPEED, speed - 8);
      }
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#1b1f2c';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    if (food) {
      const fx = food.x * CELL + CELL / 2;
      const fy = food.y * CELL + CELL / 2;
      const glow = ctx.createRadialGradient(fx, fy, 1, fx, fy, CELL * 0.9);
      glow.addColorStop(0, 'rgba(255, 107, 107, 0.45)');
      glow.addColorStop(1, 'rgba(255, 107, 107, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(food.x * CELL - CELL, food.y * CELL - CELL, CELL * 3, CELL * 3);

      ctx.fillStyle = '#ff6b6b';
      roundRect(food.x * CELL + CELL * 0.18, food.y * CELL + CELL * 0.18, CELL * 0.64, CELL * 0.64, CELL * 0.22);
      ctx.fill();
    }

    // 蛇
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = i / snake.length;
      if (i === 0) {
        ctx.fillStyle = '#a5f3a0';
      } else {
        const g = Math.round(231 - t * 70);
        const r = Math.round(126 - t * 40);
        const b = Math.round(135 - t * 45);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
      }
      const pad = i === 0 ? CELL * 0.1 : CELL * 0.16;
      roundRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, CELL * 0.22);
      ctx.fill();
    }

    // 蛇眼
    const h = snake[0];
    const ex = h.x * CELL + CELL / 2 + dir.x * CELL * 0.18;
    const ey = h.y * CELL + CELL / 2 + dir.y * CELL * 0.18;
    const offX = dir.y !== 0 ? CELL * 0.17 : 0;
    const offY = dir.x !== 0 ? CELL * 0.17 : 0;
    ctx.fillStyle = '#14161f';
    ctx.beginPath();
    ctx.arc(ex + offX, ey + offY, CELL * 0.11, 0, Math.PI * 2);
    ctx.arc(ex - offX, ey - offY, CELL * 0.11, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function start() {
    if (state === 'playing') return;
    if (state === 'over') reset();
    state = 'playing';
    startScreen.classList.add('hidden');
    overScreen.classList.add('hidden');
    pauseScreen.classList.add('hidden');
    schedule();
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(tick, speed);
  }

  function tick() {
    if (state !== 'playing') return;
    step();
    if (state === 'playing') schedule();
  }

  function pause() {
    if (state === 'playing') {
      state = 'paused';
      clearTimeout(timer);
      pauseScreen.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'playing';
      pauseScreen.classList.add('hidden');
      schedule();
    }
  }

  function gameOver() {
    state = 'over';
    clearTimeout(timer);
    finalScoreEl.textContent = score;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try {
        localStorage.setItem(BEST_KEY, String(best));
      } catch (e) { /* 忽略存储失败 */ }
    }
    overScreen.classList.remove('hidden');
  }

  // 键盘
  document.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    const keys = {
      arrowup: 'up', w: 'up',
      arrowdown: 'down', s: 'down',
      arrowleft: 'left', a: 'left',
      arrowright: 'right', d: 'right'
    };
    if (keys[k]) {
      e.preventDefault();
      setDir(keys[k]);
      return;
    }
    if (k === ' ' || k === 'spacebar') {
      e.preventDefault();
      if (state === 'ready') start();
      else pause();
      return;
    }
    if (k === 'enter') {
      e.preventDefault();
      if (state === 'over' || state === 'ready') start();
    }
  });

  // 按钮
  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('restartBtn').addEventListener('click', function () {
    reset();
    start();
  });
  document.getElementById('resumeBtn').addEventListener('click', pause);

  // 触屏方向键
  document.querySelectorAll('.pad button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      setDir(btn.getAttribute('data-dir'));
    });
  });

  // 触屏滑动
  let touchStart = null;
  canvas.addEventListener('touchstart', function (e) {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  canvas.addEventListener('touchend', function (e) {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 'right' : 'left');
    } else {
      setDir(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  // 初始化
  reset();
  state = 'ready';
  draw();
})();
</script>
</body>
</html>
