<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050d0b">
<title>贪吃蛇 · Neon Snake</title>
<style>
  :root {
    --bg: #050d0b;
    --panel: rgba(12, 30, 24, 0.72);
    --line: rgba(126, 255, 196, 0.11);
    --mint: #63f2ac;
    --mint-bright: #b9ffdc;
    --amber: #ffc968;
    --text: #e9f7f0;
    --muted: #7e9b90;
    --danger: #ff8278;
    --board-size: min(620px, calc(100vh - 205px));
    --board-size: min(620px, calc(100svh - 205px));
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    color: var(--text);
    background: var(--bg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(1100px 760px at 12% -12%, rgba(38, 183, 126, 0.19), transparent 62%),
      radial-gradient(900px 700px at 106% 104%, rgba(255, 179, 71, 0.09), transparent 60%),
      linear-gradient(180deg, #06110d 0%, #040b09 60%, #030806 100%);
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      linear-gradient(rgba(150, 255, 205, 0.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(150, 255, 205, 0.025) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
  }

  button { font-family: inherit; }

  .app {
    position: relative;
    z-index: 1;
    width: min(100% - 40px, 980px);
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    padding: 24px 0 20px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    margin-bottom: 20px;
  }

  @media (min-width: 861px) {
    .topbar {
      width: min(100%, calc(var(--board-size) + 318px));
      margin-left: auto;
      margin-right: auto;
    }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
  }

  .brand-mark {
    width: 44px;
    height: 44px;
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    color: var(--mint);
    border-radius: 14px;
    border: 1px solid rgba(111, 255, 187, 0.2);
    background: linear-gradient(145deg, #173d2f, #091b15);
    box-shadow:
      0 12px 30px -14px rgba(60, 240, 160, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .brand-mark svg {
    width: 25px;
    height: 25px;
    filter: drop-shadow(0 0 6px rgba(99, 242, 172, 0.75));
  }

  .brand-copy h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.1;
    font-weight: 650;
    letter-spacing: 0.08em;
  }

  .brand-copy p {
    margin: 6px 0 0;
    font: 600 9px/1 var(--mono);
    letter-spacing: 0.32em;
    color: var(--muted);
  }

  .hud {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hud-item {
    min-width: 78px;
    padding: 8px 13px 9px;
    border-radius: 13px;
    border: 1px solid rgba(140, 255, 200, 0.1);
    background: rgba(11, 27, 21, 0.62);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }

  .hud-item span {
    display: block;
    margin-bottom: 4px;
    font-size: 9px;
    line-height: 1;
    letter-spacing: 0.2em;
    color: var(--muted);
  }

  .hud-item strong {
    display: inline-block;
    font: 600 19px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: #f1fff8;
  }

  #score {
    color: var(--mint-bright);
    text-shadow: 0 0 18px rgba(99, 242, 172, 0.4);
  }

  #score.bump { animation: scoreBump 0.3s cubic-bezier(0.22, 1, 0.36, 1); }

  .icon-btn {
    width: 42px;
    height: 42px;
    padding: 0;
    display: grid;
    place-items: center;
    color: #b7d6c9;
    cursor: pointer;
    border-radius: 13px;
    border: 1px solid rgba(140, 255, 200, 0.12);
    background: rgba(11, 27, 21, 0.62);
    transition: color 0.18s ease, border-color 0.18s ease, background 0.18s ease,
      transform 0.18s ease;
  }

  .icon-btn:hover:not(:disabled) {
    color: var(--mint-bright);
    border-color: rgba(140, 255, 200, 0.28);
    background: rgba(18, 44, 34, 0.82);
    transform: translateY(-1px);
  }

  .icon-btn:disabled { opacity: 0.32; cursor: default; }
  .icon-btn svg { width: 17px; height: 17px; }
  #pauseBtn .icon-play { display: none; }
  #pauseBtn.paused .icon-pause { display: none; }
  #pauseBtn.paused .icon-play { display: block; }
  #soundBtn .icon-sound-off { display: none; }
  #soundBtn.muted .icon-sound-on { display: none; }
  #soundBtn.muted .icon-sound-off { display: block; }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, var(--board-size)) 292px;
    gap: 26px;
    align-items: start;
    justify-content: center;
  }

  .board-column {
    width: 100%;
    max-width: 620px;
    justify-self: center;
  }

  .board-frame {
    position: relative;
    padding: 9px;
    border-radius: 24px;
    border: 1px solid rgba(255, 255, 255, 0.09);
    background: linear-gradient(
      145deg,
      rgba(105, 255, 184, 0.22),
      rgba(255, 255, 255, 0.03) 28%,
      rgba(0, 0, 0, 0.42)
    );
    box-shadow:
      0 40px 90px -40px rgba(0, 0, 0, 0.95),
      0 0 70px -30px rgba(45, 230, 150, 0.28),
      inset 0 1px 0 rgba(255, 255, 255, 0.1);
  }

  .board-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 4;
    border-radius: inherit;
    pointer-events: none;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.45);
  }

  .board-frame.shake { animation: shake 0.46s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  #board {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 16px;
    background: #06120e;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 9px;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 18px;
    border-radius: 16px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    background: radial-gradient(circle at 50% 35%, rgba(6, 20, 15, 0.48), rgba(4, 12, 9, 0.87));
    -webkit-backdrop-filter: blur(7px) saturate(1.1);
    backdrop-filter: blur(7px) saturate(1.1);
    transition: opacity 0.24s ease, visibility 0.24s;
  }

  .overlay.visible {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .overlay-card {
    width: min(350px, 100%);
    max-height: 100%;
    padding: 26px 24px 22px;
    overflow-y: auto;
    scrollbar-width: none;
    text-align: center;
    border-radius: 20px;
    border: 1px solid rgba(140, 255, 200, 0.18);
    background: linear-gradient(180deg, rgba(20, 48, 38, 0.96), rgba(8, 22, 17, 0.97));
    box-shadow:
      0 30px 80px rgba(0, 0, 0, 0.62),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: cardIn 0.34s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .overlay-card::-webkit-scrollbar { display: none; }

  .kicker {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 13px;
    font: 600 9px/1 var(--mono);
    letter-spacing: 0.24em;
    color: #7ea898;
    text-transform: uppercase;
  }

  .kicker::before {
    content: "";
    width: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--mint));
  }

  .overlay-title {
    margin: 0 0 10px;
    font-size: clamp(24px, 3.2vw, 30px);
    font-weight: 650;
    line-height: 1.2;
    letter-spacing: 0.04em;
    color: #f2fff8;
  }

  .overlay-sub {
    margin: 0 0 18px;
    font-size: 12px;
    line-height: 1.75;
    color: #88a79a;
  }

  .overlay-sub b {
    color: #cfffe4;
    font-weight: 600;
  }

  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border-radius: 12px;
    border: 1px solid rgba(140, 255, 200, 0.1);
    background: rgba(4, 14, 10, 0.55);
  }

  .overlay .segmented {
    max-width: 220px;
    margin: 0 auto 16px;
  }

  .segmented button {
    padding: 8px 10px;
    font-size: 11px;
    color: #789687;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    background: transparent;
    transition: color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
  }

  .segmented button:hover:not(:disabled) { color: #c9f8e2; }

  .segmented button.active {
    color: #d8ffee;
    background: linear-gradient(180deg, #1b4a38, #123528);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.08),
      0 0 0 1px rgba(99, 242, 172, 0.16);
  }

  .segmented button:disabled { opacity: 0.45; cursor: default; }

  .btn {
    width: 100%;
    padding: 13px 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: 0.03em;
    cursor: pointer;
    border: 0;
    border-radius: 13px;
    transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
  }

  .btn svg { width: 15px; height: 15px; flex: 0 0 auto; }

  .btn.primary {
    color: #032418;
    background: linear-gradient(180deg, #8dffc8, #4add97);
    box-shadow:
      0 16px 34px -16px rgba(90, 250, 175, 0.9),
      inset 0 1px 0 rgba(255, 255, 255, 0.55);
  }

  .btn.primary:hover {
    transform: translateY(-1px);
    box-shadow:
      0 20px 40px -16px rgba(90, 250, 175, 1),
      inset 0 1px 0 rgba(255, 255, 255, 0.6);
  }

  .btn.primary:active { transform: translateY(0) scale(0.99); }

  .btn.ghost {
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 500;
    color: #a9c9bc;
    border: 1px solid rgba(140, 255, 200, 0.15);
    background: rgba(255, 255, 255, 0.04);
  }

  .btn.ghost:hover { background: rgba(255, 255, 255, 0.07); color: #d8f6e9; }

  .btn kbd {
    padding: 3px 6px;
    font-size: 9px;
    color: rgba(0, 34, 22, 0.68);
    background: rgba(0, 0, 0, 0.1);
    border-color: rgba(0, 0, 0, 0.14);
    box-shadow: none;
  }

  .overlay-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 4px;
  }

  .overlay-hint {
    margin-top: 14px;
    font-size: 10px;
    line-height: 1.5;
    letter-spacing: 0.03em;
    color: #5f7d71;
  }

  .hint-touch { display: none; }

  .result-score {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    margin: 4px 0 6px;
    font-family: var(--mono);
    color: #eafff5;
  }

  .result-score span {
    font-size: 52px;
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 30px rgba(99, 242, 172, 0.35);
  }

  .result-score small {
    font-size: 11px;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  .result-score em {
    margin-left: 6px;
    padding: 3px 7px;
    font-size: 9px;
    font-style: normal;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #09271c;
    border-radius: 99px;
    background: var(--amber);
    transform: translateY(-2px);
  }

  .result-score.small span { font-size: 36px; }

  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    padding: 0 4px;
    font-size: 11px;
    color: var(--muted);
  }

  .dot {
    width: 6px;
    height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #587469;
    box-shadow: 0 0 0 3px rgba(88, 116, 105, 0.12);
  }

  .dot.live {
    background: var(--mint);
    box-shadow: 0 0 12px rgba(99, 242, 172, 0.9), 0 0 0 3px rgba(99, 242, 172, 0.12);
    animation: dotPulse 1.8s ease-in-out infinite;
  }

  .status-right {
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  .status-right b { color: #cfe9df; font-weight: 600; }

  .side {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 2px;
  }

  .panel {
    padding: 16px;
    border-radius: 18px;
    border: 1px solid rgba(140, 255, 200, 0.1);
    background: linear-gradient(180deg, rgba(18, 43, 34, 0.72), rgba(8, 22, 17, 0.66));
    box-shadow:
      0 20px 50px -30px rgba(0, 0, 0, 0.8),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }

  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: #a7c6b9;
  }

  .tiny {
    font: 600 8px/1 var(--mono);
    letter-spacing: 0.2em;
    color: #557065;
  }

  .metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .metric {
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.04);
    background: rgba(4, 14, 10, 0.45);
  }

  .metric span {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    color: var(--muted);
  }

  .metric strong {
    font: 600 22px/1 var(--mono);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }

  .metric:first-child strong { color: var(--mint); }

  .meter {
    height: 4px;
    margin-top: 14px;
    overflow: hidden;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.06);
  }

  .meter i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #3ad58d, #a6ffd2);
    box-shadow: 0 0 12px rgba(99, 242, 172, 0.6);
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .meter-note {
    margin: 9px 0 0;
    font-size: 10px;
    line-height: 1.5;
    color: #6f8d81;
  }

  .mode-note {
    margin: 10px 0 0;
    font-size: 10px;
    line-height: 1.5;
    color: #6f8d81;
  }

  .keys ul {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .keys li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: #7f9c90;
  }

  kbd {
    display: inline-block;
    padding: 4px 7px;
    font: 600 10px/1 var(--mono);
    color: #b7d7c9;
    border-radius: 6px;
    border: 1px solid rgba(140, 255, 200, 0.13);
    background: #0a1a14;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  .touch-pad {
    display: none;
    grid-template-columns: repeat(3, 52px);
    grid-template-rows: repeat(3, 44px);
    gap: 6px;
    justify-content: center;
    margin: 14px auto 0;
  }

  .touch-pad button {
    display: grid;
    place-items: center;
    padding: 0;
    color: #a9cfbe;
    cursor: pointer;
    border-radius: 12px;
    border: 1px solid rgba(140, 255, 200, 0.13);
    background: linear-gradient(180deg, rgba(23, 52, 41, 0.8), rgba(8, 22, 17, 0.85));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 6px 16px -10px #000;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  .touch-pad button:active {
    color: var(--mint);
    border-color: rgba(140, 255, 200, 0.3);
    background: rgba(24, 65, 49, 0.9);
    transform: scale(0.96);
  }

  .touch-pad button:disabled { opacity: 0.35; }
  .touch-pad svg { width: 18px; height: 18px; }
  .touch-pad [data-dir="up"] { grid-area: 1 / 2; }
  .touch-pad [data-dir="left"] { grid-area: 2 / 1; }
  .touch-pad [data-dir="right"] { grid-area: 2 / 3; }
  .touch-pad [data-dir="down"] { grid-area: 3 / 2; }
  .touch-pad #padPause { grid-area: 2 / 2; }
  .touch-pad [data-dir="left"] svg { transform: rotate(-90deg); }
  .touch-pad [data-dir="right"] svg { transform: rotate(90deg); }
  .touch-pad [data-dir="down"] svg { transform: rotate(180deg); }

  .foot {
    margin-top: 16px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: #41574e;
  }

  button:focus-visible {
    outline: 2px solid var(--mint);
    outline-offset: 2px;
  }

  @keyframes scoreBump {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); color: #fff; }
    100% { transform: scale(1); }
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(99, 242, 172, 0.6), 0 0 0 3px rgba(99, 242, 172, 0.1); }
    50% { box-shadow: 0 0 14px rgba(99, 242, 172, 1), 0 0 0 5px rgba(99, 242, 172, 0.03); }
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px) scale(0.985); }
    to { opacity: 1; transform: none; }
  }

  @keyframes shake {
    10%, 90% { transform: translate(-1px, 0); }
    20%, 80% { transform: translate(2px, 0); }
    30%, 50%, 70% { transform: translate(-3px, 1px); }
    40%, 60% { transform: translate(3px, -1px); }
  }

  @media (max-width: 860px) {
    .app {
      width: min(100% - 32px, 700px);
      padding: 18px 0 22px;
      justify-content: flex-start;
    }

    .layout {
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .board-column {
      width: min(100%, 620px, calc(100svh - 180px));
      max-width: 620px;
      margin: 0 auto;
    }

    .side {
      width: 100%;
      max-width: 620px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .panel.keys { display: none; }
    .touch-pad { display: grid; }
    .foot { margin-top: 20px; }
  }

  @media (hover: none) {
    .hint-desktop { display: none; }
    .hint-touch { display: inline; }
    .btn kbd { display: none; }
    .touch-pad { display: grid; }
    .panel.keys { display: none; }
  }

  @media (max-width: 600px) {
    .app { width: min(100% - 24px, 620px); padding-top: 14px; }
    .topbar { margin-bottom: 14px; gap: 10px; }
    .brand { gap: 9px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-copy h1 { font-size: 17px; }
    .brand-copy p { margin-top: 5px; font-size: 8px; letter-spacing: 0.24em; }
    .hud { gap: 6px; }
    .hud-item { min-width: 56px; padding: 6px 9px 7px; border-radius: 11px; }
    .hud-item span { font-size: 8px; letter-spacing: 0.14em; }
    .hud-item strong { font-size: 16px; }
    .icon-btn { width: 36px; height: 36px; border-radius: 11px; }
    #pauseBtn { display: none; }
    .board-frame { padding: 7px; border-radius: 19px; }
    .overlay { inset: 7px; padding: 12px; border-radius: 13px; }
    .overlay-card { padding: 18px 14px 14px; border-radius: 17px; }
    .overlay-title { margin-bottom: 8px; font-size: 22px; }
    .overlay-sub { margin-bottom: 12px; font-size: 10.5px; line-height: 1.65; }
    .overlay .segmented { margin-bottom: 12px; }
    .overlay-hint { margin-top: 10px; }
    .kicker { margin-bottom: 10px; }
    .result-score span { font-size: 44px; }
    .status-line { margin-top: 10px; font-size: 10px; }
    .side { grid-template-columns: 1fr; }
    .foot { margin-top: 16px; }
    .hint-desktop { display: none; }
    .hint-touch { display: inline; }
    .btn kbd { display: none; }
  }

  @media (max-width: 380px) {
    .overlay-card { padding: 14px 12px 12px; }
    .overlay-title { font-size: 20px; }
    .overlay-sub { margin-bottom: 10px; font-size: 10px; line-height: 1.55; }
    .kicker { margin-bottom: 8px; font-size: 8px; }
    .segmented button { padding: 7px 8px; }
    .btn { padding: 11px 14px; font-size: 13px; border-radius: 11px; }
    .overlay-hint { margin-top: 8px; font-size: 9px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40" fill="none">
          <path d="M10 29c0-4.5 4-7 9-7h2.5c4.2 0 7.5-3.2 7.5-7.3S25.7 7 21.5 7H15"
            stroke="currentColor" stroke-width="3.6" stroke-linecap="round"/>
          <circle cx="14.5" cy="7" r="2.6" fill="currentColor"/>
          <circle cx="21.5" cy="29" r="3.2" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-copy">
        <h1>贪吃蛇</h1>
        <p>NEON SNAKE</p>
      </div>
    </div>

    <div class="hud">
      <div class="hud-item">
        <span>得分</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-item">
        <span>最高</span>
        <strong id="best">0</strong>
      </div>
      <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停游戏" disabled>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <svg class="icon-play" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M8 5.8v12.4L18.5 12 8 5.8Z" fill="currentColor"/>
        </svg>
      </button>
      <button class="icon-btn" id="soundBtn" type="button" aria-label="关闭音效" aria-pressed="true">
        <svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 9.5v5h3.4L13 18V6L8.4 9.5H5Z" fill="currentColor"/>
          <path d="M16 9a4.2 4.2 0 0 1 0 6M18.5 6.8a7.4 7.4 0 0 1 0 10.4"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 9.5v5h3.4L13 18V6L8.4 9.5H5Z" fill="currentColor"/>
          <path d="m16.2 9.5 4.6 5M20.8 9.5l-4.6 5"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <section class="layout">
    <div class="board-column">
      <div class="board-frame" id="boardFrame">
        <canvas id="board" width="620" height="620" aria-label="贪吃蛇游戏区域"></canvas>
        <div class="overlay" id="overlay" aria-live="polite">
          <div class="overlay-card" id="overlayCard"></div>
        </div>
      </div>

      <div class="touch-pad" aria-label="方向控制">
        <button type="button" data-dir="up" aria-label="向上">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" data-dir="left" aria-label="向左">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" id="padPause" aria-label="暂停或继续">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M9 6v12M15 6v12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" data-dir="right" aria-label="向右">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button type="button" data-dir="down" aria-label="向下">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span id="statusText" aria-live="polite">按空格或点击开始</span>
        <span class="status-right">长度 <b id="lengthInline">4</b></span>
      </div>
    </div>

    <aside class="side">
      <div class="panel">
        <div class="panel-head">
          <span>本局数据</span>
          <span class="tiny">LIVE</span>
        </div>
        <div class="metrics">
          <div class="metric">
            <span>长度</span>
            <strong id="length">4</strong>
          </div>
          <div class="metric">
            <span>速度</span>
            <strong id="level">01</strong>
          </div>
        </div>
        <div class="meter"><i id="meterFill"></i></div>
        <p class="meter-note" id="meterNote">再吃 5 个光点升速</p>
      </div>

      <div class="panel">
        <div class="panel-head">
          <span>模式</span>
          <span class="tiny">MODE</span>
        </div>
        <div class="segmented" role="group" aria-label="游戏模式">
          <button type="button" data-mode-btn="classic">经典</button>
          <button type="button" data-mode-btn="wrap">穿墙</button>
        </div>
        <p class="mode-note" id="modeNote">撞墙即结束</p>
      </div>

      <div class="panel keys">
        <div class="panel-head">
          <span>操作</span>
          <span class="tiny">KEYS</span>
        </div>
        <ul>
          <li><kbd>↑ ↓ ← →</kbd><span>移动</span></li>
          <li><kbd>W A S D</kbd><span>移动</span></li>
          <li><kbd>SPACE</kbd><span>开始 / 暂停</span></li>
          <li><kbd>R</kbd><span>重新开始</span></li>
          <li><kbd>M</kbd><span>音效开关</span></li>
        </ul>
      </div>
    </aside>
  </section>

  <footer class="foot">吃完光点，别咬到自己 · 单文件离线可玩</footer>
</main>

<script>
(() => {
  "use strict";

  const COLS = 20;
  const ROWS = 20;
  const BEST_KEY = "neon-snake-best-v1";
  const SOUND_KEY = "neon-snake-sound-v1";
  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };

  const ICON_PLAY = `<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <path d="M8 5.8v12.4L18.5 12 8 5.8Z" fill="currentColor"/></svg>`;

  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const boardFrame = document.getElementById("boardFrame");
  const overlay = document.getElementById("overlay");
  const overlayCard = document.getElementById("overlayCard");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const lengthEl = document.getElementById("length");
  const lengthInlineEl = document.getElementById("lengthInline");
  const levelEl = document.getElementById("level");
  const meterFill = document.getElementById("meterFill");
  const meterNote = document.getElementById("meterNote");
  const modeNote = document.getElementById("modeNote");
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  const pauseBtn = document.getElementById("pauseBtn");
  const padPause = document.getElementById("padPause");
  const soundBtn = document.getElementById("soundBtn");

  let size = 0;
  let dpr = 1;
  let snake = [];
  let prevSnake = [];
  let dir = DIRS.right;
  let inputQueue = [];
  let food = { x: 0, y: 0 };
  let phase = "ready";
  let mode = "classic";
  let score = 0;
  let eaten = 0;
  let best = loadNumber(BEST_KEY, 0);
  let newRecord = false;
  let wonGame = false;
  let runReason = "";
  let tickMs = 132;
  let tickAccum = 0;
  let progress = 1;
  let particles = [];
  let lastFrame = performance.now();
  let overlayTimer = 0;
  let soundOn = loadNumber(SOUND_KEY, 1) !== 0;
  let audioCtx = null;
  let swipe = null;

  function loadNumber(key, fallback) {
    try {
      const value = Number(localStorage.getItem(key));
      return Number.isFinite(value) ? value : fallback;
    } catch (error) {
      return fallback;
    }
  }

  function saveNumber(key, value) {
    try {
      localStorage.setItem(key, String(value));
    } catch (error) {
      /* 本地存储不可用时，本局仍可正常游玩 */
    }
  }

  function levelFor(count) {
    return Math.min(9, 1 + Math.floor(count / 5));
  }

  function speedForLevel(level) {
    return Math.max(76, 132 - (level - 1) * 7);
  }

  function snapshot(list) {
    return list.map((cell) => ({ x: cell.x, y: cell.y }));
  }

  function spawnFood() {
    const occupied = new Set(snake.map((cell) => cell.x + "," + cell.y));
    const free = [];
    for (let y = 0; y < ROWS; y += 1) {
      for (let x = 0; x < COLS; x += 1) {
        if (!occupied.has(x + "," + y)) free.push({ x, y });
      }
    }
    if (!free.length) return false;
    food = free[Math.floor(Math.random() * free.length)];
    return true;
  }

  function resetRun() {
    score = 0;
    eaten = 0;
    newRecord = false;
    wonGame = false;
    runReason = "";
    dir = DIRS.right;
    inputQueue = [];
    tickMs = speedForLevel(1);
    tickAccum = 0;
    progress = 1;
    particles = [];
    snake = [
      { x: 10, y: 10 },
      { x: 9, y: 10 },
      { x: 8, y: 10 },
      { x: 7, y: 10 }
    ];
    prevSnake = snapshot(snake);
    spawnFood();
    updateHud();
  }

  function resetToReady() {
    window.clearTimeout(overlayTimer);
    resetRun();
    phase = "ready";
    blurActiveButton();
    updateHud();
    showOverlay("ready");
  }

  function startGame() {
    window.clearTimeout(overlayTimer);
    ensureAudio();
    resetRun();
    phase = "playing";
    blurActiveButton();
    tickAccum = 0;
    progress = 1;
    lastFrame = performance.now();
    hideOverlay();
    updateHud();
    playStart();
  }

  function pauseGame() {
    if (phase !== "playing") return;
    phase = "paused";
    blurActiveButton();
    tickAccum = 0;
    progress = 1;
    prevSnake = snapshot(snake);
    updateHud();
    showOverlay("paused");
    playClick();
  }

  function resumeGame() {
    if (phase !== "paused") return;
    phase = "playing";
    blurActiveButton();
    tickAccum = 0;
    progress = 1;
    prevSnake = snapshot(snake);
    lastFrame = performance.now();
    hideOverlay();
    updateHud();
    playClick();
  }

  function togglePause() {
    if (phase === "playing") pauseGame();
    else if (phase === "paused") resumeGame();
  }

  function setMode(nextMode) {
    if (phase === "playing" || phase === "paused") return;
    if (nextMode !== "classic" && nextMode !== "wrap") return;
    if (mode === nextMode && phase === "ready") return;
    mode = nextMode;
    playClick();
    resetToReady();
  }

  function endGame(reason) {
    phase = "over";
    runReason = reason;
    wonGame = reason === "win";
    tickAccum = 0;
    progress = 1;
    prevSnake = snapshot(snake);
    if (wonGame) {
      burst(size / 2, size / 2, "#ffd77f", 40, 260);
      playWin();
    } else {
      const head = snake[0] || { x: 10, y: 10 };
      const cell = size / COLS;
      burst((head.x + 0.5) * cell, (head.y + 0.5) * cell, "#ff8d7e", 24, 190);
      playCrash();
      boardFrame.classList.remove("shake");
      void boardFrame.offsetWidth;
      boardFrame.classList.add("shake");
      window.setTimeout(() => boardFrame.classList.remove("shake"), 520);
    }
    updateHud();
    window.clearTimeout(overlayTimer);
    overlayTimer = window.setTimeout(() => {
      if (phase === "over") showOverlay("over");
    }, wonGame ? 700 : 520);
  }

  function step() {
    if (inputQueue.length) {
      const next = inputQueue.shift();
      if (!(next.x === -dir.x && next.y === -dir.y)) dir = next;
    }

    const head = snake[0];
    let nx = head.x + dir.x;
    let ny = head.y + dir.y;

    if (mode === "wrap") {
      nx = (nx + COLS) % COLS;
      ny = (ny + ROWS) % ROWS;
    } else if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      endGame("wall");
      return;
    }

    const willEat = nx === food.x && ny === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (body.some((cell) => cell.x === nx && cell.y === ny)) {
      endGame("self");
      return;
    }

    prevSnake = snapshot(snake);
    snake.unshift({ x: nx, y: ny });

    if (willEat) {
      score += 10;
      eaten += 1;
      const oldLevel = levelFor(eaten - 1);
      const newLevel = levelFor(eaten);
      if (score > best) {
        best = score;
        newRecord = true;
        saveNumber(BEST_KEY, best);
      }
      tickMs = speedForLevel(newLevel);
      const cell = size / COLS;
      burst((nx + 0.5) * cell, (ny + 0.5) * cell, "#ffd57e", 16, 145);
      playEat();
      if (newLevel > oldLevel) {
        playLevel();
        const speed = document.getElementById("level");
        if (typeof speed.animate === "function") {
          speed.animate(
            [
              { transform: "scale(1)", color: "#e9f7f0" },
              { transform: "scale(1.28)", color: "#ffc968" },
              { transform: "scale(1)", color: "#e9f7f0" }
            ],
            { duration: 420, easing: "cubic-bezier(.22,1,.36,1)" }
          );
        }
      }
      bumpScore();
      if (snake.length >= COLS * ROWS) {
        updateHud();
        endGame("win");
        return;
      }
      spawnFood();
    } else {
      snake.pop();
    }

    updateHud();
  }

  function bumpScore() {
    scoreEl.classList.remove("bump");
    void scoreEl.offsetWidth;
    scoreEl.classList.add("bump");
  }

  function blurActiveButton() {
    const active = document.activeElement;
    if (active instanceof Element && active.closest("button")) active.blur();
  }

  function updateHud() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    lengthEl.textContent = String(snake.length);
    lengthInlineEl.textContent = String(snake.length);

    const level = levelFor(eaten);
    levelEl.textContent = String(level).padStart(2, "0");
    meterFill.style.width = `${(eaten % 5) * 20}%`;
    if (level >= 9) meterNote.textContent = "已达最高速度";
    else meterNote.textContent = `再吃 ${5 - (eaten % 5)} 个光点升速`;

    modeNote.textContent = mode === "classic" ? "撞墙即结束" : "从另一侧出现";

    const locked = phase === "playing" || phase === "paused";
    document.querySelectorAll("[data-mode-btn]").forEach((button) => {
      button.classList.toggle("active", button.dataset.modeBtn === mode);
      button.disabled = locked;
    });

    pauseBtn.disabled = !(phase === "playing" || phase === "paused");
    pauseBtn.classList.toggle("paused", phase === "paused");
    pauseBtn.setAttribute("aria-label", phase === "paused" ? "继续游戏" : "暂停游戏");
    padPause.disabled = !(phase === "playing" || phase === "paused");
    statusDot.classList.toggle("live", phase === "playing");

    if (phase === "ready") {
      statusText.textContent = "按空格或点击开始";
    } else if (phase === "playing") {
      statusText.textContent = mode === "classic" ? "经典模式 · 小心墙壁" : "穿墙模式 · 边界可穿越";
    } else if (phase === "paused") {
      statusText.textContent = "已暂停 · 按空格继续";
    } else if (wonGame) {
      statusText.textContent = `完美通关 · ${score} 分`;
    } else {
      statusText.textContent = `本局结束 · ${score} 分`;
    }
  }

  function modeControl() {
    return `<div class="segmented" role="group" aria-label="游戏模式">
      <button type="button" data-mode-btn="classic" class="${mode === "classic" ? "active" : ""}">经典</button>
      <button type="button" data-mode-btn="wrap" class="${mode === "wrap" ? "active" : ""}">穿墙</button>
    </div>`;
  }

  function showOverlay(kind) {
    window.clearTimeout(overlayTimer);
    let html = "";

    if (kind === "ready") {
      html = `
        <div class="kicker">Neon Arcade · 01</div>
        <h2 class="overlay-title">准备好了吗？</h2>
        <p class="overlay-sub">吃掉金色光点，别撞墙，也别咬到自己。<br>每吃 <b>5</b> 个，速度提升一档。</p>
        ${modeControl()}
        <button class="btn primary" type="button" data-action="start">
          ${ICON_PLAY}<span>开始游戏</span><kbd>空格</kbd>
        </button>
        <div class="overlay-hint">
          <span class="hint-desktop">方向键 / WASD / 滑动屏幕</span>
          <span class="hint-touch">滑动屏幕或点按方向键</span>
        </div>`;
    } else if (kind === "paused") {
      html = `
        <div class="kicker">Paused</div>
        <h2 class="overlay-title">暂停一下</h2>
        <p class="overlay-sub">蛇在原地等你。</p>
        <div class="result-score small"><span>${score}</span><small>分</small></div>
        <div class="overlay-actions">
          <button class="btn primary" type="button" data-action="resume">${ICON_PLAY}<span>继续游戏</span></button>
          <button class="btn ghost" type="button" data-action="restart">重新开始</button>
        </div>
        <div class="overlay-hint">
          <span class="hint-desktop">空格继续 · R 重开</span>
          <span class="hint-touch">点按继续，随时回来</span>
        </div>`;
    } else {
      const title = wonGame
        ? "填满整个棋盘"
        : runReason === "self"
          ? "咬到自己了"
          : "撞上墙了";
      html = `
        <div class="kicker">${wonGame ? "Perfect Clear" : "Game Over"}</div>
        <h2 class="overlay-title">${title}</h2>
        <div class="result-score">
          <span>${score}</span><small>分</small>${newRecord && score > 0 ? "<em>新纪录</em>" : ""}
        </div>
        <p class="overlay-sub">最高 ${best} 分 · 长度 ${snake.length} 节</p>
        <div class="overlay-actions">
          <button class="btn primary" type="button" data-action="restart">
            ${ICON_PLAY}<span>再来一局</span>
          </button>
          <button class="btn ghost" type="button" data-action="ready">调整模式</button>
        </div>
        <div class="overlay-hint">
          <span class="hint-desktop">按 R 快速重开</span>
          <span class="hint-touch">点按再来一局</span>
        </div>`;
    }

    overlayCard.innerHTML = html;
    overlay.classList.add("visible");
    overlay.setAttribute("aria-hidden", "false");
    updateHud();
  }

  function hideOverlay() {
    overlay.classList.remove("visible");
    overlay.setAttribute("aria-hidden", "true");
  }

  function handleDirection(name) {
    const next = DIRS[name];
    if (!next) return;
    if (phase === "ready") startGame();
    if (phase !== "playing") return;

    const last = inputQueue.length ? inputQueue[inputQueue.length - 1] : dir;
    if (next.x === last.x && next.y === last.y) return;
    if (next.x === -last.x && next.y === -last.y) return;
    if (inputQueue.length < 2) inputQueue.push(next);
  }

  function updateParticles(dt) {
    const seconds = dt / 1000;
    for (const particle of particles) {
      particle.x += particle.vx * seconds;
      particle.y += particle.vy * seconds;
      particle.vx *= 0.965;
      particle.vy = particle.vy * 0.965 + 150 * seconds;
      particle.life -= seconds;
    }
    particles = particles.filter((particle) => particle.life > 0);
  }

  function burst(x, y, color, count, strength) {
    for (let i = 0; i < count; i += 1) {
      const angle = Math.random() * Math.PI * 2;
      const speed = strength * (0.25 + Math.random() * 0.9);
      const life = 0.45 + Math.random() * 0.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - strength * 0.15,
        life,
        maxLife: life,
        size: 1.4 + Math.random() * 3.2,
        color: Math.random() < 0.3 ? "#fff1c8" : color
      });
    }
  }

  function draw(now) {
    if (!size) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);

    const cell = size / COLS;
    const t = phase === "playing" ? progress : 1;

    const bg = ctx.createLinearGradient(0, 0, size, size);
    bg.addColorStop(0, "#081d16");
    bg.addColorStop(0.55, "#071712");
    bg.addColorStop(1, "#050f0b");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, size, size);

    const glow = ctx.createRadialGradient(
      size * 0.18, size * 0.12, 0,
      size * 0.18, size * 0.12, size * 0.9
    );
    glow.addColorStop(0, "rgba(63, 220, 152, 0.10)");
    glow.addColorStop(0.5, "rgba(63, 220, 152, 0.025)");
    glow.addColorStop(1, "rgba(63, 220, 152, 0)");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, size, size);

    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(120, 255, 195, 0.045)";
    ctx.beginPath();
    for (let i = 1; i < COLS; i += 1) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0);
      ctx.lineTo(p, size);
      ctx.moveTo(0, p);
      ctx.lineTo(size, p);
    }
    ctx.stroke();

    ctx.strokeStyle = "rgba(120, 255, 195, 0.075)";
    ctx.beginPath();
    for (let i = 5; i < COLS; i += 5) {
      const p = Math.round(i * cell) + 0.5;
      ctx.moveTo(p, 0);
      ctx.lineTo(p, size);
      ctx.moveTo(0, p);
      ctx.lineTo(size, p);
    }
    ctx.stroke();

    ctx.save();
    if (mode === "wrap") {
      ctx.setLineDash([5, 9]);
      ctx.strokeStyle = "rgba(255, 201, 104, 0.24)";
    } else {
      ctx.strokeStyle = "rgba(120, 255, 195, 0.18)";
    }
    ctx.lineWidth = 2;
    ctx.strokeRect(1, 1, size - 2, size - 2);
    ctx.restore();

    const vignette = ctx.createRadialGradient(
      size / 2, size / 2, size * 0.3,
      size / 2, size / 2, size * 0.78
    );
    vignette.addColorStop(0, "rgba(0, 0, 0, 0)");
    vignette.addColorStop(1, "rgba(0, 0, 0, 0.42)");
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, size, size);

    if (!wonGame) drawFood(cell, now);
    drawSnake(cell, t, now);
    drawParticles();
  }

  function visualCell(index, t) {
    const to = snake[index];
    if (!to) return null;
    const from = prevSnake[index] || to;
    let fx = from.x;
    let fy = from.y;
    if (Math.abs(to.x - fx) > 1 || Math.abs(to.y - fy) > 1) {
      fx = to.x;
      fy = to.y;
    }
    return {
      x: fx + (to.x - fx) * t,
      y: fy + (to.y - fy) * t
    };
  }

  function roundedRect(x, y, w, h, r) {
    const radius = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + radius, y);
    ctx.arcTo(x + w, y, x + w, y + h, radius);
    ctx.arcTo(x + w, y + h, x, y + h, radius);
    ctx.arcTo(x, y + h, x, y, radius);
    ctx.arcTo(x, y, x + w, y, radius);
    ctx.closePath();
  }

  function drawSnake(cell, t, now) {
    const count = snake.length;
    if (!count) return;

    const points = [];
    for (let i = count - 1; i >= 0; i -= 1) {
      const pos = visualCell(i, t);
      if (pos) points.push({ x: (pos.x + 0.5) * cell, y: (pos.y + 0.5) * cell });
    }

    if (points.length > 1) {
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = cell * 0.44;
      ctx.strokeStyle = "rgba(68, 232, 160, 0.34)";
      ctx.shadowColor = "rgba(68, 232, 160, 0.26)";
      ctx.shadowBlur = cell * 0.45;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i += 1) {
        const previous = points[i - 1];
        const point = points[i];
        if (Math.abs(point.x - previous.x) > cell * 1.6 ||
            Math.abs(point.y - previous.y) > cell * 1.6) {
          ctx.moveTo(point.x, point.y);
        } else {
          ctx.lineTo(point.x, point.y);
        }
      }
      ctx.stroke();
      ctx.restore();
    }

    for (let i = count - 1; i >= 0; i -= 1) {
      const pos = visualCell(i, t);
      if (!pos) continue;
      const ratio = count === 1 ? 0 : i / (count - 1);
      const x = (pos.x + 0.5) * cell;
      const y = (pos.y + 0.5) * cell;
      const pad = cell * (0.055 + ratio * 0.035);
      const side = cell - pad * 2;
      const radius = side * (i === 0 ? 0.34 : 0.32);
      const hue = 158 + ratio * 14;
      const light = i === 0 ? 74 : 64 - ratio * 30;

      ctx.save();
      ctx.shadowColor = i === 0 ? "rgba(110, 255, 190, 0.66)" : "rgba(70, 235, 160, 0.3)";
      ctx.shadowBlur = i === 0 ? cell * 0.8 : i < 12 ? cell * 0.4 : 0;
      ctx.fillStyle = i === 0
        ? "hsl(158 88% 74%)"
        : `hsl(${hue} 78% ${light}%)`;
      roundedRect(x - side / 2, y - side / 2, side, side, radius);
      ctx.fill();
      ctx.restore();

      if (i > 0 && i < 14 && ratio < 0.9) {
        ctx.save();
        ctx.globalAlpha = 0.2;
        ctx.fillStyle = "#d9ffe9";
        roundedRect(
          x - side / 2 + side * 0.22,
          y - side / 2 + side * 0.16,
          side * 0.56,
          side * 0.18,
          side * 0.09
        );
        ctx.fill();
        ctx.restore();
      }
    }

    const head = visualCell(0, t);
    if (!head) return;
    const hx = (head.x + 0.5) * cell;
    const hy = (head.y + 0.5) * cell;
    const fx = dir.x;
    const fy = dir.y;
    const sx = -fy;
    const sy = fx;
    const eyeForward = cell * 0.10;
    const eyeSide = cell * 0.155;
    const eyeRadius = cell * 0.105;
    const pupilRadius = cell * 0.052;
    const ex = hx + fx * eyeForward;
    const ey = hy + fy * eyeForward;

    for (const sign of [-1, 1]) {
      const cx = ex + sx * eyeSide * sign;
      const cy = ey + sy * eyeSide * sign;
      ctx.save();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#f2fff9";
      ctx.beginPath();
      ctx.arc(cx, cy, eyeRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#05281c";
      ctx.beginPath();
      ctx.arc(
        cx + fx * eyeRadius * 0.32,
        cy + fy * eyeRadius * 0.32,
        pupilRadius,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.restore();
    }

    if (phase === "playing" && Math.sin(now / 170) > 0.88) {
      ctx.save();
      ctx.strokeStyle = "#ff7b81";
      ctx.lineWidth = Math.max(1.2, cell * 0.055);
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(hx + fx * cell * 0.3, hy + fy * cell * 0.3);
      ctx.lineTo(hx + fx * cell * 0.48, hy + fy * cell * 0.48);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawFood(cell, now) {
    const cx = (food.x + 0.5) * cell;
    const cy = (food.y + 0.5) * cell;
    const pulse = 1 + Math.sin(now / 210) * 0.055;

    const halo = ctx.createRadialGradient(cx, cy, 0, cx, cy, cell * 0.9);
    halo.addColorStop(0, "rgba(255, 209, 116, 0.32)");
    halo.addColorStop(0.45, "rgba(255, 190, 82, 0.10)");
    halo.addColorStop(1, "rgba(255, 190, 82, 0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy, cell * 0.9, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(cx, cy - cell * 0.22);
    ctx.rotate(-0.55);
    ctx.fillStyle = "#67e7a2";
    ctx.beginPath();
    ctx.ellipse(cell * 0.1, 0, cell * 0.12, cell * 0.052, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.strokeStyle = "#8cf0b8";
    ctx.lineWidth = Math.max(1, cell * 0.045);
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx, cy - cell * 0.2);
    ctx.quadraticCurveTo(cx - cell * 0.02, cy - cell * 0.29, cx + cell * 0.05, cy - cell * 0.32);
    ctx.stroke();
    ctx.restore();

    const radius = cell * 0.275 * pulse;
    ctx.save();
    ctx.shadowColor = "rgba(255, 197, 92, 0.9)";
    ctx.shadowBlur = cell * 0.65;
    const orb = ctx.createRadialGradient(
      cx - radius * 0.36, cy - radius * 0.4, radius * 0.06,
      cx, cy, radius * 1.1
    );
    orb.addColorStop(0, "#fff5cf");
    orb.addColorStop(0.35, "#ffd882");
    orb.addColorStop(1, "#eea23b");
    ctx.fillStyle = orb;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.fillStyle = "rgba(255, 255, 255, 0.75)";
    ctx.beginPath();
    ctx.arc(cx - radius * 0.32, cy - radius * 0.38, radius * 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    for (let i = 0; i < 3; i += 1) {
      const angle = now / 1100 + (i * Math.PI * 2) / 3;
      const orbit = cell * 0.52;
      const px = cx + Math.cos(angle) * orbit;
      const py = cy + Math.sin(angle) * orbit * 0.7;
      ctx.save();
      ctx.globalAlpha = 0.38 + Math.sin(angle * 2) * 0.18;
      ctx.fillStyle = "#ffe6a8";
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.9, cell * 0.035), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawParticles() {
    if (!particles.length) return;
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const particle of particles) {
      const alpha = Math.max(0, particle.life / particle.maxLife);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = particle.color;
      ctx.beginPath();
      ctx.arc(particle.x, particle.y, particle.size * alpha, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const cssSize = Math.round(rect.width);
    if (!cssSize) return;
    const nextDpr = Math.min(window.devicePixelRatio || 1, 2);
    const backing = Math.round(cssSize * nextDpr);
    if (canvas.width !== backing || canvas.height !== backing) {
      canvas.width = backing;
      canvas.height = backing;
    }
    size = cssSize;
    dpr = nextDpr;
  }

  function loop(now) {
    const raw = now - lastFrame;
    lastFrame = now;
    const dt = Math.max(0, Math.min(raw, 60));

    if (phase === "playing") {
      tickAccum += dt;
      let guard = 0;
      while (tickAccum >= tickMs && phase === "playing" && guard < 4) {
        tickAccum -= tickMs;
        guard += 1;
        step();
      }
      progress = phase === "playing" ? Math.min(1, tickAccum / tickMs) : 1;
    } else {
      progress = 1;
    }

    updateParticles(dt);
    draw(now);
    window.requestAnimationFrame(loop);
  }

  function ensureAudio() {
    if (!soundOn) return;
    try {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (error) {
      audioCtx = null;
    }
  }

  function tone(freq, delay, duration, type, volume, slideTo) {
    if (!soundOn || !audioCtx) return;
    try {
      const start = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, start);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, start + duration);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    } catch (error) {
      /* 忽略音频异常 */
    }
  }

  function playEat() {
    tone(640, 0, 0.075, "sine", 0.04);
    tone(980, 0.055, 0.1, "sine", 0.028);
  }

  function playStart() {
    tone(392, 0, 0.12, "triangle", 0.03);
    tone(587, 0.09, 0.16, "triangle", 0.028);
  }

  function playCrash() {
    tone(210, 0, 0.34, "sawtooth", 0.04, 76);
    tone(105, 0.04, 0.4, "sine", 0.03, 58);
  }

  function playLevel() {
    tone(784, 0, 0.08, "sine", 0.03);
    tone(1046, 0.075, 0.12, "sine", 0.026);
  }

  function playWin() {
    tone(523, 0, 0.14, "triangle", 0.03);
    tone(659, 0.12, 0.14, "triangle", 0.03);
    tone(784, 0.24, 0.2, "triangle", 0.03);
    tone(1046, 0.38, 0.34, "sine", 0.026);
  }

  function playClick() {
    tone(520, 0, 0.05, "sine", 0.018);
  }

  function applySoundUi() {
    soundBtn.classList.toggle("muted", !soundOn);
    soundBtn.setAttribute("aria-pressed", String(soundOn));
    soundBtn.setAttribute("aria-label", soundOn ? "关闭音效" : "开启音效");
  }

  function toggleSound() {
    soundOn = !soundOn;
    saveNumber(SOUND_KEY, soundOn ? 1 : 0);
    applySoundUi();
    if (soundOn) {
      ensureAudio();
      playClick();
    }
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("[data-mode-btn]");
    if (button && !button.disabled) setMode(button.dataset.modeBtn);
  });

  overlay.addEventListener("click", (event) => {
    const actionButton = event.target.closest("[data-action]");
    if (!actionButton) return;
    const action = actionButton.dataset.action;
    if (action === "start" || action === "restart") startGame();
    else if (action === "resume") resumeGame();
    else if (action === "ready") resetToReady();
  });

  soundBtn.addEventListener("click", toggleSound);
  pauseBtn.addEventListener("click", togglePause);
  padPause.addEventListener("click", togglePause);

  document.querySelectorAll("[data-dir]").forEach((button) => {
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      handleDirection(button.dataset.dir);
      ensureAudio();
    });
  });

  canvas.addEventListener("pointerdown", (event) => {
    swipe = { x: event.clientX, y: event.clientY, id: event.pointerId };
    try {
      canvas.setPointerCapture(event.pointerId);
    } catch (error) {
      /* 某些浏览器不支持指针捕获 */
    }
  });

  canvas.addEventListener("pointerup", (event) => {
    if (!swipe || swipe.id !== event.pointerId) return;
    const dx = event.clientX - swipe.x;
    const dy = event.clientY - swipe.y;
    swipe = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 18) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      handleDirection(dx > 0 ? "right" : "left");
    } else {
      handleDirection(dy > 0 ? "down" : "up");
    }
  });

  canvas.addEventListener("pointercancel", () => {
    swipe = null;
  });

  window.addEventListener("keydown", (event) => {
    const key = event.key;
    if (key === " " && event.target instanceof Element &&
        event.target.closest("button")) {
      return;
    }
    const arrows = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "];
    if (arrows.includes(key)) event.preventDefault();

    if (key === "ArrowUp" || key === "w" || key === "W") handleDirection("up");
    else if (key === "ArrowDown" || key === "s" || key === "S") handleDirection("down");
    else if (key === "ArrowLeft" || key === "a" || key === "A") handleDirection("left");
    else if (key === "ArrowRight" || key === "d" || key === "D") handleDirection("right");
    else if (key === " ") {
      if (phase === "ready" || phase === "over") startGame();
      else togglePause();
    } else if (key === "Escape" || key === "p" || key === "P") {
      togglePause();
    } else if (key === "r" || key === "R") {
      startGame();
    } else if (key === "m" || key === "M") {
      toggleSound();
    }
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && phase === "playing") pauseGame();
  });

  if ("ResizeObserver" in window) {
    new ResizeObserver(resizeCanvas).observe(canvas);
  } else {
    window.addEventListener("resize", resizeCanvas);
  }

  window.addEventListener("resize", resizeCanvas);

  bestEl.textContent = String(best);
  applySoundUi();
  resizeCanvas();
  resetToReady();
  window.requestAnimationFrame(loop);
})();
</script>
</body>
</html>
