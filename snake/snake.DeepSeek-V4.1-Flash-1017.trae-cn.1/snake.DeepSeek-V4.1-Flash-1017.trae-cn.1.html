<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>贪吃蛇 · Snake</title>
<style>
  :root{
    --bg:#070b14;
    --line:rgba(148,163,184,.14);
    --green:#34d399;
    --text:#e6edf7;
    --muted:#8b9bb4;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(900px 520px at 50% -12%, #123049 0%, transparent 62%),
      radial-gradient(760px 460px at 50% 112%, #0f2a22 0%, transparent 62%),
      var(--bg);
    color:var(--text);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px 18px 28px;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    width:100%;
    max-width:452px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    padding:0 4px;
  }
  .brand{
    font-size:19px;
    font-weight:800;
    letter-spacing:.2em;
    line-height:1;
  }
  .brand b{ color:var(--green); }
  .brand small{
    display:block;
    margin-top:7px;
    font-size:10px;
    font-weight:600;
    letter-spacing:.34em;
    color:var(--muted);
  }
  .chips{ display:flex; gap:8px; }
  .chip{
    min-width:72px;
    padding:7px 12px 8px;
    text-align:center;
    border-radius:13px;
    background:rgba(255,255,255,.035);
    border:1px solid var(--line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  }
  .chip span{
    display:block;
    font-size:9px;
    letter-spacing:.16em;
    color:var(--muted);
    margin-bottom:3px;
  }
  .chip b{
    display:block;
    font-size:19px;
    line-height:1.1;
    font-variant-numeric:tabular-nums;
    color:#d7f7ea;
  }
  .stage{
    position:relative;
    width:100%;
    aspect-ratio:1 / 1;
    border-radius:20px;
    overflow:hidden;
    background:#0a1220;
    border:1px solid var(--line);
    box-shadow:
      0 26px 60px -26px rgba(0,0,0,.95),
      0 0 0 1px rgba(52,211,153,.05),
      inset 0 0 70px rgba(52,211,153,.045);
    touch-action:none;
  }
  canvas{ display:block; width:100%; height:100%; }
  .overlay{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:9px;
    padding:26px;
    text-align:center;
    background:rgba(6,10,18,.74);
    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
    transition:opacity .2s ease, visibility .2s ease;
  }
  .overlay.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .overlay h1{
    margin:0;
    font-size:26px;
    font-weight:800;
    letter-spacing:.06em;
    text-shadow:0 0 26px rgba(52,211,153,.35);
  }
  .overlay p{
    margin:0;
    font-size:13px;
    line-height:1.7;
    color:var(--muted);
  }
  .overlay p em{
    font-style:normal;
    color:#9df1d2;
    font-weight:600;
  }
  .overlay button{
    margin-top:10px;
    appearance:none;
    border:0;
    cursor:pointer;
    padding:13px 34px;
    border-radius:999px;
    font-family:inherit;
    font-size:15px;
    font-weight:800;
    letter-spacing:.1em;
    color:#052e24;
    background:linear-gradient(180deg,#86efc4,#34d399);
    box-shadow:0 12px 26px -10px rgba(52,211,153,.85);
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .overlay button:hover{ transform:translateY(-1px); box-shadow:0 16px 30px -10px rgba(52,211,153,.95); filter:brightness(1.04); }
  .overlay button:active{ transform:translateY(1px) scale(.99); }
  .hint{
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:6px 10px;
    font-size:12px;
    color:var(--muted);
    padding:0 4px;
  }
  .hint kbd{
    display:inline-block;
    padding:2px 7px;
    margin:0 2px;
    border-radius:6px;
    font-family:inherit;
    font-size:11px;
    color:#cfe9f5;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-bottom-color:rgba(0,0,0,.4);
  }
  @media (max-width:380px){
    body{ padding:14px 12px 18px; }
    .brand{ font-size:17px; }
    .chip{ min-width:62px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">SNAKE<b>·</b><small>贪 吃 蛇</small></div>
      <div class="chips">
        <div class="chip"><span>得分</span><b id="score">0</b></div>
        <div class="chip"><span>最高</span><b id="best">0</b></div>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <h1 id="ovTitle">贪吃蛇</h1>
        <p id="ovText">吃到红色果实即可变长<br />撞墙或撞到自己就结束</p>
        <button id="ovBtn" type="button">开始游戏</button>
      </div>
    </div>

    <div class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
      <span><kbd>空格</kbd> 暂停</span>
      <span>手机可滑动屏幕</span>
    </div>
  </div>

<script>
(function () {
  'use strict';

  var COLS = 20, ROWS = 20, CELL = 24;
  var W = COLS * CELL, H = ROWS * CELL;

  var canvas   = document.getElementById('game');
  var ctx      = canvas.getContext('2d');
  var scoreEl  = document.getElementById('score');
  var bestEl   = document.getElementById('best');
  var overlay  = document.getElementById('overlay');
  var ovTitle  = document.getElementById('ovTitle');
  var ovText   = document.getElementById('ovText');
  var ovBtn    = document.getElementById('ovBtn');
  var stage    = document.getElementById('stage');

  var STATE = { READY: 'ready', PLAYING: 'playing', PAUSED: 'paused', OVER: 'over' };
  var state = STATE.READY;

  var snake, dir, queue, food, score = 0, best = 0;
  var particles = [];
  var acc = 0;
  var last = performance.now();

  /* ---------- canvas ---------- */
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  /* ---------- persistence ---------- */
  function loadBest() {
    try { best = parseInt(localStorage.getItem('snake.best') || '0', 10) || 0; }
    catch (e) { best = 0; }
    bestEl.textContent = best;
  }
  function saveBest() {
    try { localStorage.setItem('snake.best', String(best)); } catch (e) {}
  }

  /* ---------- game setup ---------- */
  function spawnFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var occupied = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { occupied = true; break; }
        }
        if (!occupied) free.push({ x: x, y: y });
      }
    }
    if (!free.length) return null;
    return free[Math.floor(Math.random() * free.length)];
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    particles = [];
    score = 0;
    acc = 0;
    scoreEl.textContent = '0';
    food = spawnFood();
    last = performance.now();
  }

  function stepInterval() {
    return Math.max(68, 150 - score * 5);
  }

  /* ---------- state / overlay ---------- */
  function showOverlay(title, text, btnLabel) {
    ovTitle.textContent = title;
    ovText.innerHTML = text;
    ovBtn.textContent = btnLabel;
    overlay.classList.remove('hidden');
  }
  function hideOverlay() {
    overlay.classList.add('hidden');
  }

  function startGame() {
    reset();
    state = STATE.PLAYING;
    hideOverlay();
  }

  function pauseGame() {
    state = STATE.PAUSED;
    showOverlay('已暂停', '按 <em>空格</em> 或点击下方按钮继续', '继续游戏');
  }

  function resumeGame() {
    state = STATE.PLAYING;
    last = performance.now();
    acc = 0;
    hideOverlay();
  }

  function gameOver() {
    state = STATE.OVER;
    var len = snake.length;
    if (score > best) {
      best = score;
      saveBest();
      bestEl.textContent = best;
      showOverlay('新纪录！', '本局得分 <em>' + score + '</em> · 长度 ' + len, '再来一局');
    } else {
      showOverlay('游戏结束', '本局得分 <em>' + score + '</em> · 长度 ' + len + '<br />最高纪录 ' + best, '再来一局');
    }
  }

  function togglePause() {
    if (state === STATE.PLAYING) pauseGame();
    else if (state === STATE.PAUSED) resumeGame();
    else startGame();
  }

  /* ---------- movement ---------- */
  function queueDir(nd) {
    var ref = queue.length ? queue[queue.length - 1] : dir;
    if (nd.x === -ref.x && nd.y === -ref.y) return;   // 禁止反向
    if (nd.x === ref.x && nd.y === ref.y) return;     // 忽略同向
    if (queue.length < 2) queue.push(nd);
  }

  function step() {
    if (queue.length) dir = queue.shift();

    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    var eating = !!food && head.x === food.x && head.y === food.y;
    var limit = eating ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) {
        gameOver();
        return;
      }
    }

    snake.unshift(head);

    if (eating) {
      score++;
      scoreEl.textContent = score;
      spawnBurst(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2);
      food = spawnFood();
    } else {
      snake.pop();
    }
  }

  /* ---------- particles ---------- */
  function spawnBurst(cx, cy) {
    for (var i = 0; i < 14; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = 45 + Math.random() * 115;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 1,
        r: 1.4 + Math.random() * 2.6,
        color: Math.random() < 0.5 ? '248,113,113' : '251,191,36'
      });
    }
  }

  function updateParticles(dt) {
    var s = dt / 1000;
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * s;
      p.y += p.vy * s;
      p.vx *= 0.9;
      p.vy *= 0.9;
      p.life -= s * 1.8;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      var a = p.life > 0 ? p.life : 0;
      ctx.fillStyle = 'rgba(' + p.color + ',' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * a + 0.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  /* ---------- render ---------- */
  function drawBoard() {
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, '#0a1220');
    g.addColorStop(1, '#0a1727');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.014)';
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if ((x + y) % 2 === 0) ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }

    ctx.strokeStyle = 'rgba(148,163,184,0.045)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var i = 1; i < COLS; i++) {
      ctx.moveTo(i * CELL + 0.5, 0);
      ctx.lineTo(i * CELL + 0.5, H);
    }
    for (var j = 1; j < ROWS; j++) {
      ctx.moveTo(0, j * CELL + 0.5);
      ctx.lineTo(W, j * CELL + 0.5);
    }
    ctx.stroke();
  }

  function drawFood(now) {
    if (!food) return;
    var cx = food.x * CELL + CELL / 2;
    var cy = food.y * CELL + CELL / 2;
    var pulse = 0.5 + 0.5 * Math.sin(now / 280);
    var r = CELL * 0.27 + pulse * CELL * 0.035;

    ctx.save();
    ctx.shadowColor = 'rgba(248,113,113,0.9)';
    ctx.shadowBlur = 16 + pulse * 10;
    var g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.38, r * 0.12, cx, cy, r * 1.35);
    g.addColorStop(0, '#fecaca');
    g.addColorStop(0.42, '#f87171');
    g.addColorStop(1, '#b91c1c');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath();
    ctx.arc(cx - r * 0.34, cy - r * 0.34, r * 0.17, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(248,113,113,' + (0.08 + pulse * 0.16).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, CELL * 0.46, 0, Math.PI * 2);
    ctx.stroke();
  }

  function tracePath(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  }

  function drawSnake() {
    if (!snake || !snake.length) return;

    var pts = [];
    for (var i = 0; i < snake.length; i++) {
      pts.push({ x: snake[i].x * CELL + CELL / 2, y: snake[i].y * CELL + CELL / 2 });
    }

    var head = pts[0], tail = pts[pts.length - 1];

    ctx.save();
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    if (pts.length === 1) {
      ctx.fillStyle = '#34d399';
      ctx.beginPath();
      ctx.arc(head.x, head.y, CELL * 0.4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      drawHead(head);
      return;
    }

    // 外发光
    ctx.strokeStyle = 'rgba(52,211,153,0.22)';
    ctx.lineWidth = CELL * 1.12;
    tracePath(pts);
    ctx.stroke();

    // 蛇身
    var grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0, '#a7f3d0');
    grad.addColorStop(0.22, '#4ade80');
    grad.addColorStop(0.62, '#34d399');
    grad.addColorStop(1, '#0f766e');
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL * 0.78;
    tracePath(pts);
    ctx.stroke();

    // 高光
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.lineWidth = CELL * 0.26;
    tracePath(pts);
    ctx.stroke();

    ctx.restore();
    drawHead(head);
  }

  function drawHead(p) {
    var r = CELL * 0.41;
    var px = -dir.y, py = dir.x;

    ctx.save();
    ctx.shadowColor = 'rgba(52,211,153,0.85)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#6ee7b7';
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    var eyeR = CELL * 0.095;
    var fwd = CELL * 0.15;
    var side = CELL * 0.155;
    var e1 = { x: p.x + dir.x * fwd + px * side, y: p.y + dir.y * fwd + py * side };
    var e2 = { x: p.x + dir.x * fwd - px * side, y: p.y + dir.y * fwd - py * side };

    ctx.fillStyle = '#08111e';
    ctx.beginPath();
    ctx.arc(e1.x, e1.y, eyeR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(e2.x, e2.y, eyeR, 0, Math.PI * 2);
    ctx.fill();
  }

  function render(now) {
    drawBoard();
    drawFood(now);
    drawSnake();
    drawParticles();
  }

  /* ---------- loop ---------- */
  function loop(now) {
    var dt = now - last;
    last = now;
    if (dt > 100) dt = 100;

    if (state === STATE.PLAYING) {
      acc += dt;
      var interval = stepInterval();
      while (acc >= interval) {
        acc -= interval;
        step();
        if (state !== STATE.PLAYING) break;
        interval = stepInterval();
      }
    }

    updateParticles(dt);
    render(now);
    requestAnimationFrame(loop);
  }

  /* ---------- input ---------- */
  var DIRS = {
    arrowup: { x: 0, y: -1 }, arrowdown: { x: 0, y: 1 },
    arrowleft: { x: -1, y: 0 }, arrowright: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 }
  };

  window.addEventListener('keydown', function (e) {
    var k = e.key;

    if (k === ' ' || k === 'Spacebar') {
      e.preventDefault();
      togglePause();
      return;
    }
    if (k === 'Enter') {
      e.preventDefault();
      if (state !== STATE.PLAYING) ovBtn.click();
      return;
    }

    var nd = DIRS[String(k).toLowerCase()];
    if (!nd) return;
    e.preventDefault();

    if (state === STATE.READY) startGame();
    if (state !== STATE.PLAYING) return;
    queueDir(nd);
  });

  var touchX = 0, touchY = 0, tracking = false;

  stage.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    touchX = t.clientX;
    touchY = t.clientY;
    tracking = true;
  }, { passive: true });

  stage.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;

    var t = e.changedTouches[0];
    var dx = t.clientX - touchX;
    var dy = t.clientY - touchY;

    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) {
      if (state === STATE.READY || state === STATE.OVER) ovBtn.click();
      return;
    }

    if (state === STATE.READY) startGame();
    if (state !== STATE.PLAYING) return;

    queueDir(Math.abs(dx) > Math.abs(dy)
      ? { x: dx > 0 ? 1 : -1, y: 0 }
      : { x: 0, y: dy > 0 ? 1 : -1 });
  }, { passive: true });

  ovBtn.addEventListener('click', function () {
    if (state === STATE.PAUSED) resumeGame();
    else startGame();
  });

  window.addEventListener('blur', function () {
    if (state === STATE.PLAYING) pauseGame();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === STATE.PLAYING) pauseGame();
  });

  /* ---------- boot ---------- */
  loadBest();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
