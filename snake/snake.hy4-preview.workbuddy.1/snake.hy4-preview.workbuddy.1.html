<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>贪吃蛇</title>
<style>
  :root {
    --mint: #2bb3a6;
    --mint-dark: #1f8b81;
    --bg: #eef7f6;
    --card: #ffffff;
    --ink: #22302f;
    --ink-soft: #6b7f7d;
    --line: #d8ebe8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap {
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 14px 28px;
  }
  h1 {
    font-size: 20px; margin: 0 0 14px; letter-spacing: 2px;
    color: var(--mint-dark);
    text-align: center;
  }
  .stats {
    display: flex; gap: 10px; margin-bottom: 12px;
  }
  .stat {
    flex: 1; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; text-align: center;
  }
  .stat .k { font-size: 12px; color: var(--ink-soft); }
  .stat .v { font-size: 20px; font-weight: 700; color: var(--mint-dark); }
  .board {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
  }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: rgba(238, 247, 246, .93);
    text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay .title { font-size: 22px; font-weight: 700; color: var(--mint-dark); }
  .overlay .desc { font-size: 13px; color: var(--ink-soft); line-height: 1.8; }
  .btn {
    background: var(--mint); color: #fff; border: none; border-radius: 8px;
    padding: 9px 20px; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--mint-dark); }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; gap: 10px; flex-wrap: wrap;
  }
  .seg { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .seg button {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 5px 12px; font-size: 13px; border-radius: 6px; cursor: pointer; font-family: inherit;
  }
  .seg button.on { background: var(--mint); color: #fff; }
  .tip { font-size: 12px; color: var(--ink-soft); line-height: 1.7; margin-top: 10px; }
  .pad { display: none; margin: 14px auto 0; width: 168px; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px); gap: 4px; }
  .pad button {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    font-size: 18px; color: var(--mint-dark); cursor: pointer; font-family: inherit;
  }
  .pad button:active { background: var(--mint); color: #fff; }
  .pad .sp { visibility: hidden; }
  @media (max-width: 640px) { .pad { display: grid; } .tip .kb { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>贪 吃 蛇</h1>

  <div class="stats">
    <div class="stat"><div class="k">当前得分</div><div class="v" id="score">0</div></div>
    <div class="stat"><div class="k">最高分</div><div class="v" id="best">0</div></div>
    <div class="stat"><div class="k">长度</div><div class="v" id="len">3</div></div>
  </div>

  <div class="board">
    <canvas id="cv" width="400" height="400"></canvas>
    <div class="overlay" id="ov">
      <div class="title" id="ovTitle">准备好了吗？</div>
      <div class="desc" id="ovDesc">方向键 / WASD 控制方向<br>手机可直接滑动屏幕</div>
      <button class="btn" id="ovBtn">开始游戏</button>
    </div>
  </div>

  <div class="bar">
    <div class="seg" id="speed">
      <button data-ms="150">慢</button>
      <button data-ms="100" class="on">中</button>
      <button data-ms="60">快</button>
    </div>
    <button class="btn" id="pauseBtn" style="background:var(--card);color:var(--mint-dark);border:1px solid var(--line)">暂停</button>
  </div>

  <div class="pad" id="pad">
    <div class="sp"></div><button data-d="up">▲</button><div class="sp"></div>
    <button data-d="left">◀</button><div class="sp"></div><button data-d="right">▶</button>
    <div class="sp"></div><button data-d="down">▼</button><div class="sp"></div>
  </div>

  <div class="tip">
    <span class="kb">空格 = 暂停 / 继续　·　R = 重新开始　·　</span>每颗食物 +10 分，吃得越快分越高？不，稳住别撞墙。
  </div>
</div>

<script>
(function () {
  var CELL = 20, COLS = 20, ROWS = 20;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var elScore = document.getElementById('score');
  var elBest = document.getElementById('best');
  var elLen = document.getElementById('len');
  var ov = document.getElementById('ov');
  var ovTitle = document.getElementById('ovTitle');
  var ovDesc = document.getElementById('ovDesc');
  var ovBtn = document.getElementById('ovBtn');
  var pauseBtn = document.getElementById('pauseBtn');

  var STATE = { READY: 0, RUN: 1, PAUSE: 2, OVER: 3 };
  var state = STATE.READY;
  var snake, dir, queue, food, score, best, interval, acc, last;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0;
  elBest.textContent = best;
  interval = 100;

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    acc = 0;
    placeFood();
    syncHud();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        if (!occupied(x, y)) free.push({ x: x, y: y });
      }
    }
    if (!free.length) { food = null; return; }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function occupied(x, y) {
    for (var i = 0; i < snake.length; i++) {
      if (snake[i].x === x && snake[i].y === y) return true;
    }
    return false;
  }

  function syncHud() {
    elScore.textContent = score;
    elLen.textContent = snake.length;
    if (score > best) {
      best = score;
      elBest.textContent = best;
      localStorage.setItem('snake_best', String(best));
    }
  }

  function turn(nx, ny) {
    var lastDir = queue.length ? queue[queue.length - 1] : dir;
    if (lastDir.x === -nx && lastDir.y === -ny) return; // 禁止 180° 掉头
    if (lastDir.x === nx && lastDir.y === ny) return;
    if (queue.length < 2) queue.push({ x: nx, y: ny });
  }

  function step() {
    if (queue.length) dir = queue.shift();
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver(false);

    var eat = !!food && head.x === food.x && head.y === food.y;
    // 不吃食物时尾巴会让位，所以最后一节不算障碍
    var limit = eat ? snake.length : snake.length - 1;
    for (var i = 0; i < limit; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return gameOver(false);
    }

    snake.unshift(head);
    if (eat) {
      score += 10;
      placeFood();
      syncHud();
      if (!food) return gameOver(true);
    } else {
      snake.pop();
    }
  }

  function gameOver(win) {
    state = STATE.OVER;
    syncHud();
    show(win ? '通关了！' : '游戏结束',
      (win ? '整块地都被你吃满了。' : '撞到了，') + '本局得分 ' + score + '，长度 ' + snake.length + '<br>最高分 ' + best,
      '再来一局');
  }

  function show(title, desc, btn) {
    ovTitle.innerHTML = title;
    ovDesc.innerHTML = desc;
    ovBtn.textContent = btn;
    ov.classList.remove('hidden');
  }

  function start() {
    reset();
    state = STATE.RUN;
    ov.classList.add('hidden');
    last = performance.now();
  }

  function pause() {
    if (state !== STATE.RUN) return;
    state = STATE.PAUSE;
    show('已暂停', '按空格或点下面的按钮继续', '继续');
  }

  function resume() {
    if (state !== STATE.PAUSE) return;
    state = STATE.RUN;
    ov.classList.add('hidden');
    last = performance.now();
  }

  // ---- 绘制 ----
  function draw() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    // 棋盘
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#f4fbfa' : '#e9f4f2';
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // 食物
    if (food) {
      var cx = food.x * CELL + CELL / 2, cy = food.y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(cx, cy + 1, CELL * 0.34, 0, Math.PI * 2);
      ctx.fillStyle = '#e8544a';
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx - 1, cy - 6);
      ctx.quadraticCurveTo(cx + 6, cy - 11, cx + 7, cy - 6);
      ctx.quadraticCurveTo(cx + 2, cy - 3, cx - 1, cy - 6);
      ctx.fillStyle = '#3aa06f';
      ctx.fill();
    }
    // 蛇身
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var t = i / Math.max(snake.length - 1, 1);
      ctx.fillStyle = i === 0 ? '#1f8b81' : 'rgba(43,179,166,' + (0.85 - t * 0.45).toFixed(2) + ')';
      roundRect(s.x * CELL + 1.5, s.y * CELL + 1.5, CELL - 3, CELL - 3, i === 0 ? 7 : 5);
      ctx.fill();
    }
    // 眼睛
    var h = snake[0];
    ctx.fillStyle = '#fff';
    var ex = h.x * CELL + CELL / 2, ey = h.y * CELL + CELL / 2;
    var ox = dir.y !== 0 ? 4 : 0, oy = dir.x !== 0 ? 4 : 0;
    var px = dir.x ? dir.x * 3 : 0, py = dir.y ? dir.y * 3 : 0;
    ctx.beginPath(); ctx.arc(ex + px - oy, ey + py - ox, 2.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(ex + px + oy, ey + py + ox, 2.1, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) { ctx.roundRect(x, y, w, h, r); return; }
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  // ---- 主循环 ----
  function loop(now) {
    if (state === STATE.RUN) {
      acc += now - last;
      if (acc > interval * 4) acc = interval; // 切后台回来不要连跳
      while (acc >= interval) {
        acc -= interval;
        step();
        if (state !== STATE.RUN) break;
      }
    }
    last = now;
    draw();
    requestAnimationFrame(loop);
  }

  // ---- 输入 ----
  var KEYS = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
    W: [0, -1], S: [0, 1], A: [-1, 0], D: [1, 0]
  };
  document.addEventListener('keydown', function (e) {
    var k = KEYS[e.key];
    if (k) {
      e.preventDefault();
      if (state === STATE.READY || state === STATE.OVER) start();
      else if (state === STATE.PAUSE) resume();
      turn(k[0], k[1]);
      return;
    }
    if (e.key === ' ') {
      e.preventDefault();
      if (state === STATE.RUN) pause();
      else if (state === STATE.PAUSE) resume();
      else start();
    } else if (e.key === 'r' || e.key === 'R') {
      start();
    }
  });

  ovBtn.addEventListener('click', function () {
    if (state === STATE.PAUSE) resume(); else start();
  });
  pauseBtn.addEventListener('click', function () {
    if (state === STATE.RUN) pause();
    else if (state === STATE.PAUSE) resume();
    else start();
  });

  document.getElementById('speed').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    interval = parseInt(b.dataset.ms, 10);
    [].forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    cv.focus();
  });

  document.getElementById('pad').addEventListener('pointerdown', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    var d = b.dataset.d;
    if (d === 'up') turn(0, -1);
    else if (d === 'down') turn(0, 1);
    else if (d === 'left') turn(-1, 0);
    else turn(1, 0);
    if (state === STATE.READY || state === STATE.OVER) start();
    else if (state === STATE.PAUSE) resume();
  });

  // 滑动控制
  var sx = 0, sy = 0, touching = false;
  cv.addEventListener('touchstart', function (e) {
    var t = e.touches[0]; sx = t.clientX; sy = t.clientY; touching = true;
  }, { passive: true });
  cv.addEventListener('touchmove', function (e) {
    if (!touching) return;
    var t = e.touches[0];
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0);
    else turn(0, dy > 0 ? 1 : -1);
    sx = t.clientX; sy = t.clientY;
    if (state === STATE.READY || state === STATE.OVER) start();
    else if (state === STATE.PAUSE) resume();
    e.preventDefault();
  }, { passive: false });
  cv.addEventListener('touchend', function () { touching = false; }, { passive: true });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden && state === STATE.RUN) pause();
  });

  reset();
  state = STATE.READY;
  last = performance.now();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
