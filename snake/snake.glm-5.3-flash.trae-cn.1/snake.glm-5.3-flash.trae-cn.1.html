<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    color: #eee;
    gap: 16px;
  }
  h1 { font-size: 28px; letter-spacing: 8px; color: #7bed9f; text-shadow: 0 0 12px rgba(123,237,159,.5); }
  .hud { display: flex; gap: 24px; font-size: 18px; }
  .hud span { color: #ffd32a; font-weight: bold; }
  .board-wrap { position: relative; }
  canvas {
    border: 2px solid #2f3640;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(0,0,0,.6);
    background: #0f0f1a;
    max-width: 92vw;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: rgba(10, 10, 25, .82);
    border-radius: 8px;
    text-align: center;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 26px; }
  .overlay p { color: #aaa; font-size: 14px; line-height: 1.8; }
  button {
    padding: 10px 36px;
    font-size: 16px;
    border: none;
    border-radius: 24px;
    background: #7bed9f;
    color: #16213e;
    font-weight: bold;
    cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(123,237,159,.6); }
  .tips { font-size: 13px; color: #777; }
</style>
</head>
<body>
  <h1>贪吃蛇</h1>
  <div class="hud">得分：<span id="score">0</span>　最高分：<span id="best">0</span></div>
  <div class="board-wrap">
    <canvas id="game" width="440" height="440"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="msg">准备开始</h2>
      <p>方向键 / WASD 控制方向<br>空格键 暂停 · 继续</p>
      <button id="btn">开始游戏</button>
    </div>
  </div>
  <div class="tips">速度会随得分逐渐加快</div>

<script>
(() => {
  const GRID = 22;                 // 每格像素
  const COLS = 20, ROWS = 20;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const msgEl = document.getElementById('msg');
  const btn = document.getElementById('btn');

  let snake, dir, nextDir, food, score, best, speed, timer, state; // state: idle | running | paused | over
  best = +(localStorage.getItem('snake_best') || 0);
  bestEl.textContent = best;

  function reset() {
    snake = [{x: 9, y: 10}, {x: 8, y: 10}, {x: 7, y: 10}];
    dir = {x: 1, y: 0};
    nextDir = dir;
    score = 0;
    speed = 130;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    do {
      food = {x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS)};
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function start() {
    reset();
    state = 'running';
    overlay.classList.add('hidden');
    clearInterval(timer);
    timer = setInterval(tick, speed);
  }

  function tick() {
    dir = nextDir;
    const head = {x: snake[0].x + dir.x, y: snake[0].y + dir.y};

    // 撞墙或撞自己
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      placeFood();
      // 加速
      if (speed > 60) {
        speed -= 4;
        clearInterval(timer);
        timer = setInterval(tick, speed);
      }
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    state = 'over';
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', best);
      bestEl.textContent = best;
      msgEl.textContent = '新纪录！得分 ' + score;
    } else {
      msgEl.textContent = '游戏结束　得分 ' + score;
    }
    btn.textContent = '再来一局';
    overlay.classList.remove('hidden');
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格底纹
    ctx.fillStyle = 'rgba(255,255,255,0.03)';
    for (let x = 0; x < COLS; x++)
      for (let y = 0; y < ROWS; y++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * GRID, y * GRID, GRID, GRID);

    // 食物
    ctx.fillStyle = '#ff6b6b';
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // 蛇身
    snake.forEach((s, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0 ? '#7bed9f' : `rgba(123,237,159,${0.85 - t * 0.55})`;
      ctx.shadowColor = '#7bed9f';
      ctx.shadowBlur = i === 0 ? 12 : 0;
      roundRect(s.x * GRID + 1.5, s.y * GRID + 1.5, GRID - 3, GRID - 3, 5);
      ctx.shadowBlur = 0;
    });

    // 蛇眼睛
    const h = snake[0];
    ctx.fillStyle = '#16213e';
    const ex = h.x * GRID + GRID / 2, ey = h.y * GRID + GRID / 2;
    const ox = dir.x * 3, oy = dir.y * 3;
    ctx.beginPath();
    ctx.arc(ex + ox + (dir.y !== 0 ? 4 : 0), ey + oy + (dir.x !== 0 ? 4 : 0), 2, 0, Math.PI * 2);
    ctx.arc(ex + ox - (dir.y !== 0 ? 4 : 0), ey + oy - (dir.x !== 0 ? 4 : 0), 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.fill();
  }

  function togglePause() {
    if (state === 'running') {
      state = 'paused';
      clearInterval(timer);
      msgEl.textContent = '已暂停';
      btn.textContent = '继续';
      overlay.classList.remove('hidden');
    } else if (state === 'paused') {
      state = 'running';
      overlay.classList.add('hidden');
      timer = setInterval(tick, speed);
    }
  }

  const keyMap = {
    ArrowUp: {x: 0, y: -1}, KeyW: {x: 0, y: -1},
    ArrowDown: {x: 0, y: 1}, KeyS: {x: 0, y: 1},
    ArrowLeft: {x: -1, y: 0}, KeyA: {x: -1, y: 0},
    ArrowRight: {x: 1, y: 0}, KeyD: {x: 1, y: 0}
  };

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'running' || state === 'paused') togglePause();
      else if (state !== 'paused') start();
      return;
    }
    const d = keyMap[e.code];
    if (d && state === 'running') {
      e.preventDefault();
      // 禁止 180° 掉头
      if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
    }
  });

  btn.addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else start();
  });

  // 初始画面
  state = 'idle';
  reset();
  draw();
})();
</script>
</body>
</html>
