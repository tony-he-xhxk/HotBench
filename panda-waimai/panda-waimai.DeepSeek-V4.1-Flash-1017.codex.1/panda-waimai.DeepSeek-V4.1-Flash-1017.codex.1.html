<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102a3d">
  <title>熊猫急送 · 外卖已送达</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17324d;
      --cream: #fff8e9;
      --orange: #ff7a3d;
      --teal: #0d7076;
      --shadow: rgba(5, 25, 42, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(255, 173, 97, 0.22), transparent 28rem),
        radial-gradient(circle at 85% 90%, rgba(23, 162, 184, 0.2), transparent 32rem),
        #102332;
      color: #f8fbfd;
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
        "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
    }

    .page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .player {
      width: min(1500px, calc(100vw - 48px));
    }

    .stage {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.32);
      border-radius: 30px;
      background: #b9e4ef;
      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.38),
        0 2px 0 rgba(255, 255, 255, 0.18) inset;
      isolation: isolate;
    }

    .scene {
      display: block;
      width: 100%;
      height: 100%;
    }

    .controls {
      position: absolute;
      z-index: 3;
      left: 22px;
      right: 22px;
      bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 999px;
      background: rgba(14, 38, 57, 0.82);
      box-shadow: 0 9px 26px rgba(8, 24, 36, 0.24);
      color: #f8fbfd;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #ffca5c;
      box-shadow: 0 0 0 4px rgba(255, 202, 92, 0.16);
    }

    .stage[data-state="complete"] .status-dot {
      background: #7be1b2;
      box-shadow: 0 0 0 4px rgba(123, 225, 178, 0.16);
    }

    .replay-button {
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 48px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #ff7a3d;
      box-shadow:
        0 12px 30px rgba(32, 34, 35, 0.28),
        0 1px 0 rgba(255, 255, 255, 0.3) inset;
      color: #fff;
      font: 800 15px/1 "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.04em;
      cursor: pointer;
      opacity: 0;
      transform: translateY(10px);
      transition:
        opacity 220ms ease,
        transform 220ms ease,
        background-color 180ms ease;
    }

    .stage[data-state="complete"] .replay-button {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0);
    }

    .replay-button:hover {
      background: #ff8f58;
    }

    .replay-button:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 4px;
    }

    .replay-button svg {
      width: 18px;
      height: 18px;
    }

    .caption {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin: 14px 5px 0;
      color: rgba(240, 247, 250, 0.76);
      font-size: 13px;
      line-height: 1.6;
    }

    .caption strong {
      color: #fff;
      font-weight: 700;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Scene typography */
    .scene text {
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC",
        "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
      user-select: none;
    }

    .shop-sign-text {
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .shop-detail {
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .window-pane {
      transition: fill 420ms ease;
    }

    .scene.is-complete .lit-window {
      fill: #ffd476;
    }

    .scene.is-complete .door-glow {
      opacity: 0.9;
    }

    #arrival {
      opacity: 0;
    }

    .scene.is-complete #arrival {
      opacity: 1;
    }

    .arrival-card {
      transform-box: fill-box;
      transform-origin: center;
    }

    .scene.is-complete .arrival-card {
      animation: arrival-pop 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .arrival-confetti {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }

    .scene.is-complete .arrival-confetti {
      animation: confetti-pop 520ms ease-out both;
    }

    .scene.is-complete .arrival-confetti:nth-of-type(2n) {
      animation-delay: 90ms;
    }

    .scene.is-complete .arrival-confetti:nth-of-type(3n) {
      animation-delay: 160ms;
    }

    @keyframes arrival-pop {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes confetti-pop {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-18deg);
      }
      70% {
        opacity: 1;
        transform: scale(1.16) rotate(8deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    @media (max-width: 720px) {
      .page {
        padding: 10px;
      }

      .player {
        width: calc(100vw - 20px);
      }

      .stage {
        border-radius: 18px;
      }

      .controls {
        left: 10px;
        right: 10px;
        bottom: 10px;
      }

      .status-pill {
        min-height: 34px;
        padding: 0 12px;
        font-size: 11px;
      }

      .replay-button {
        min-height: 40px;
        padding: 0 14px;
        font-size: 12px;
      }

      .caption {
        margin-top: 10px;
        font-size: 11px;
      }

      .caption span:last-child {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene.is-complete .arrival-card,
      .scene.is-complete .arrival-confetti {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }

      .replay-button {
        transition: none;
      }
    }
  </style>
</head>

            <g id="safetyChip">
              <rect x="40" y="129" width="430" height="40" rx="20" fill="#fff8e9" opacity="0.94" filter="url(#smallShadow)"/>

              <text x="180" y="155" fill="#294b5b" font-size="14" font-weight="800" letter-spacing="0.05em">反光背心</text>
              <circle cx="264" cy="149" r="3" fill="#b58a62"/>
              <text x="278" y="155" fill="#294b5b" font-size="14" font-weight="800" letter-spacing="0.05em">前后灯亮起</text>

            <g id="progressHud">
              <rect x="1170" y="34" width="390" height="84" rx="25" fill="#102b40" opacity="0.9" filter="url(#smallShadow)"/>

        <div class="controls" aria-live="polite">
          <div class="status-pill">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusLabel">正在配送…</span>
          </div>
          <button class="replay-button" id="replayButton" type="button" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 11a8 8 0 1 0-2.34 5.66" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M20 4.5V11h-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

        <span><strong id="pageTitle">熊猫急送：一次完整、不重复的送达旅程</strong></span>

      </div>
      <p class="sr-only" id="liveStatus" aria-live="polite">正在配送。</p>
    </section>

  <script>
    (() => {
      "use strict";

      const scene = document.getElementById("scene");
      const stage = document.getElementById("stage");
      const world = document.getElementById("world");
      const farCity = document.getElementById("farCity");
      const clouds = document.getElementById("clouds");
      const rearWheel = document.getElementById("rearWheel");
      const frontWheel = document.getElementById("frontWheel");
      const rigMove = document.getElementById("rigMove");
      const motionLines = document.getElementById("motionLines");
      const laneDashes = document.getElementById("laneDashes");
      const headlightGlow = document.getElementById("headlightGlow");
      const dustPuffs = Array.from(document.getElementById("dustPuffs").children);
      const progressFill = document.getElementById("progressFill");
      const progressText = document.getElementById("progressText");
      const statusLabel = document.getElementById("statusLabel");
      const liveStatus = document.getElementById("liveStatus");
      const replayButton = document.getElementById("replayButton");

      const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const travelDuration = prefersReducedMotion.matches ? 2200 : 14000;
      const cameraDistance = 1900;
      const wheelRadius = 46;

      let animationFrame = 0;
      let animationStart = null;
      let animationComplete = false;

      const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
      const smoothstep = (value) => value * value * (3 - 2 * value);

      function setStaticProgress(percent) {
        const safePercent = clamp(percent, 0, 100);
        progressFill.setAttribute("width", String(3.3 * safePercent));
        progressText.textContent = `${Math.round(safePercent)}%`;
      }

      function resetScene() {
        animationComplete = false;
        scene.classList.remove("is-complete");
        stage.dataset.state = "playing";
        replayButton.disabled = true;
        statusLabel.textContent = "正在配送…";
        liveStatus.textContent = "正在配送。";
        setStaticProgress(0);

        world.setAttribute("transform", "translate(0 0)");
        farCity.setAttribute("transform", "translate(0 0)");
        clouds.setAttribute("transform", "translate(0 0)");
        rearWheel.setAttribute("transform", "rotate(0 425 770)");
        frontWheel.setAttribute("transform", "rotate(0 695 770)");
        rigMove.setAttribute("transform", "translate(0 0) rotate(-0.7 560 755)");
        motionLines.setAttribute("opacity", "0");
        laneDashes.setAttribute("stroke-dashoffset", "0");
        headlightGlow.setAttribute("opacity", "0.72");
        dustPuffs.forEach((puff) => puff.setAttribute("opacity", "0"));
      }

      function finishAnimation() {
        if (animationComplete) {
          return;
        }

        animationComplete = true;
        animationFrame = 0;
        world.setAttribute("transform", `translate(${-cameraDistance} 0)`);
        farCity.setAttribute("transform", `translate(${-cameraDistance * 0.115} 0)`);
        clouds.setAttribute("transform", `translate(${-cameraDistance * 0.045} 0)`);
        rearWheel.setAttribute("transform", "rotate(248 425 770)");
        frontWheel.setAttribute("transform", "rotate(248 695 770)");
        rigMove.setAttribute("transform", "translate(0 0) rotate(-0.7 560 755)");
        motionLines.setAttribute("opacity", "0");
        laneDashes.setAttribute("stroke-dashoffset", "-760");
        headlightGlow.setAttribute("opacity", "0.72");
        dustPuffs.forEach((puff) => puff.setAttribute("opacity", "0"));
        setStaticProgress(100);
        statusLabel.textContent = "配送完成";
        liveStatus.textContent = "外卖已送达。松风雅苑三栋，请开门取餐。";
        stage.dataset.state = "complete";
        scene.classList.add("is-complete");
        replayButton.disabled = false;
      }

      function animate(timestamp) {
        if (animationStart === null) {
          animationStart = timestamp;
        }

        const elapsed = timestamp - animationStart;
        const rawProgress = clamp(elapsed / travelDuration, 0, 1);
        const easedProgress = smoothstep(rawProgress);
        const distance = cameraDistance * easedProgress;
        const speed = Math.sin(Math.PI * rawProgress);

        world.setAttribute("transform", `translate(${-distance} 0)`);
        farCity.setAttribute("transform", `translate(${-distance * 0.115} 0)`);
        clouds.setAttribute("transform", `translate(${-distance * 0.045} 0)`);
        laneDashes.setAttribute("stroke-dashoffset", String(-distance * 0.4));

        const wheelDegrees = (distance / wheelRadius) * (180 / Math.PI);
        rearWheel.setAttribute("transform", `rotate(${wheelDegrees} 425 770)`);
        frontWheel.setAttribute("transform", `rotate(${wheelDegrees} 695 770)`);

        const bob = Math.sin(elapsed / 92) * 3.4 * speed;
        const lean = -0.7 + Math.sin(elapsed / 180) * 0.55 * speed;
        rigMove.setAttribute("transform", `translate(0 ${bob}) rotate(${lean} 560 755)`);
        motionLines.setAttribute("opacity", String(0.92 * speed));
        headlightGlow.setAttribute("opacity", String(0.64 + 0.13 * Math.sin(elapsed / 130)));

        dustPuffs.forEach((puff, index) => {
          const opacity = clamp(speed * (0.38 - index * 0.09), 0, 0.38);
          puff.setAttribute("opacity", String(opacity));
        });

        setStaticProgress(rawProgress * 100);

        if (rawProgress >= 1) {
          finishAnimation();
          return;
        }

        animationFrame = window.requestAnimationFrame(animate);
      }

      function playOnce() {
        if (animationFrame) {
          window.cancelAnimationFrame(animationFrame);
        }

        resetScene();
        animationStart = null;
        animationFrame = window.requestAnimationFrame(animate);
      }

      replayButton.addEventListener("click", playOnce);

      playOnce();
    })();
  </script>
