<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>熊猫外卖员 · 安全送达</title>
<style>
  :root{
    --mint:#2bb3a6;
    --ink:#22303a;
    --line:#e3eaee;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#f2f6f8;
    color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 44px}
  h1{font-size:19px;margin:0 0 6px;font-weight:700;letter-spacing:.5px}
  .sub{font-size:13px;color:#6b7c88;margin:0 0 14px;line-height:1.7}
  .stage{
    background:#fff;border-radius:16px;overflow:hidden;
    box-shadow:0 8px 26px rgba(30,60,80,.12);
  }
  svg{display:block;width:100%;height:auto}
  svg text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif}

  .hud{
    display:flex;align-items:center;gap:14px;
    padding:11px 16px;border-top:1px solid var(--line);background:#fbfdfd;
  }
  button{
    font:inherit;font-size:14px;font-weight:600;
    padding:8px 18px;border-radius:999px;
    border:1px solid var(--mint);background:var(--mint);color:#fff;cursor:pointer;
    transition:background .15s,color .15s;
  }
  button.secondary{background:#fff;color:#1e9188}
  button:disabled{opacity:.4;cursor:not-allowed}
  .bar{flex:1;height:8px;background:#e6ecef;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fe0d6,#2bb3a6);border-radius:99px}
  .state{font-size:13px;color:#5b6c78;min-width:4.5em;text-align:right}

  /* 送达提示卡：默认隐藏，只有动画结束后才出现（由 JS 控制，绝不自动循环） */
  #done{
    opacity:0;visibility:hidden;
    transform-box:view-box;transform-origin:240px 108px;
  }
  #done.on{visibility:visible;animation:pop .55s cubic-bezier(.2,1.5,.4,1) forwards}
  @keyframes pop{
    0%{opacity:0;transform:scale(.72) translateY(12px)}
    60%{opacity:1;transform:scale(1.06) translateY(0)}
    100%{opacity:1;transform:scale(1) translateY(0)}
  }
  #bag{opacity:0;transition:opacity .5s ease}
  #bag.on{opacity:1}
  .note{font-size:12.5px;color:#7c8b96;margin:10px 2px 0;line-height:1.7}
  kbd{
    font:inherit;font-size:11.5px;background:#eef3f5;border:1px solid #dbe4e8;
    border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:#4d5c66;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>熊猫外卖员 · 安全送达</h1>

            <circle cx="48" cy="-158" r="8" fill="#22262b"/>
            <circle cx="84" cy="-158" r="8" fill="#22262b"/>
            <circle cx="66" cy="-138" r="21" fill="#fbfbfb" stroke="#e0e0e0" stroke-width="2"/>
            <ellipse cx="58" cy="-137" rx="6.5" ry="8.5" fill="#22262b" transform="rotate(-14 58 -137)"/>
            <ellipse cx="76" cy="-137" rx="6.5" ry="8.5" fill="#22262b" transform="rotate(-14 76 -137)"/>
            <circle cx="60" cy="-139" r="2.6" fill="#ffffff"/>
            <circle cx="78" cy="-139" r="2.6" fill="#ffffff"/>
            <ellipse cx="78" cy="-125" rx="4" ry="3" fill="#22262b"/>
            <path d="M78 -121q-4 4-8 0" stroke="#3a3f45" stroke-width="1.6" fill="none" stroke-linecap="round"/>
            <!-- 安全头盔 -->
            <path d="M43 -140A23 23 0 0189 -140Z" fill="#e8463c"/>
            <path d="M60 -161h8l4 21h-16z" fill="#ffffff" opacity=".9"/>
            <path d="M84 -141l14 1v6l-14 1z" fill="#c93a31"/>
            <path d="M50 -136q-3 14 11 19" stroke="#c93a31" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M43 -140h46" stroke="#b8332b" stroke-width="2.5"/>
          </g>

          <!-- 送达时手中提的外卖袋 -->
          <g id="bag">
            <path d="M100 -92q8 -12 16 0" fill="none" stroke="#c9961c" stroke-width="3" stroke-linecap="round"/>
            <rect x="94" y="-92" width="28" height="30" rx="3" fill="#f5c542"/>
            <rect x="94" y="-92" width="28" height="30" rx="3" fill="none" stroke="#d9a520" stroke-width="2"/>
            <text x="108" y="-73" text-anchor="middle" font-size="10" font-weight="700" fill="#8a6a10">外卖</text>
          </g>
        </g>
      </g>

      <!-- 交规装备说明（左下角） -->
      <g>
        <rect x="16" y="378" width="234" height="64" rx="10" fill="#ffffff" opacity=".92"/>
        <rect x="16" y="378" width="234" height="64" rx="10" fill="none" stroke="#dbe4e8" stroke-width="1.5"/>
        <text x="30" y="398" font-size="12.5" font-weight="700" fill="#5b6c78">交规安全装备（齐全）</text>
        <text x="30" y="418" font-size="13" fill="#33414c">✓ 头盔　✓ 反光背心　✓ 号牌</text>
        <text x="30" y="436" font-size="13" fill="#33414c">✓ 车灯　✓ 后视镜　✓ 保温餐箱</text>
      </g>

      <!-- 送达提示（默认隐藏，动画结束后由 JS 打开） -->
      <g id="done">
        <rect x="40" y="36" width="400" height="144" rx="20" fill="#ffffff" opacity=".95"/>
        <rect x="40" y="36" width="400" height="144" rx="20" fill="none" stroke="#2bb3a6" stroke-width="3"/>
        <text x="240" y="100" text-anchor="middle" font-size="40" font-weight="800" fill="#2bb3a6">外卖已送达！</text>
        <text x="240" y="136" text-anchor="middle" font-size="16" fill="#6b7c88">幸福里 3 号楼 · 单元 302</text>
        <text x="240" y="164" text-anchor="middle" font-size="16" fill="#f0a93a">★★★★★</text>
      </g>
    </svg>

    <div class="hud">
      <button id="btn">▶ 开始配送</button>
      <div class="bar"><i id="fill"></i></div>
      <span class="state" id="state">待出发</span>
    </div>
  </div>

  <p class="note">
    快捷键：<kbd>空格</kbd> 播放 / 暂停，<kbd>R</kbd> 重播。动画从头到尾只跑一遍，到达居民楼后自动停住，<b>不会自动重播</b>。
  </p>
</div>

<script>
(function () {
  var T = 12000;                 // 总时长 ms
  var P0 = 150, P1 = 2900;       // 骑手世界坐标：起点 / 终点
  var D = P1 - P0;
  var MAXCAM = 2400;             // 世界宽 3400 - 视口 1000
  var WR = 22;                   // 车轮半径

  var A = 0.15, B = 0.86;        // 起步加速段 / 到站减速段
  var V = 1 / ((B - A) + (A + (1 - B)) / 2);

  var world = document.getElementById('world');
  var far   = document.getElementById('far');
  var rider = document.getElementById('rider');
  var box   = document.getElementById('box');
  var bag   = document.getElementById('bag');
  var done  = document.getElementById('done');
  var fill  = document.getElementById('fill');
  var btn   = document.getElementById('btn');
  var state = document.getElementById('state');
  var wheels = [].slice.call(document.querySelectorAll('.wheel'));

  // 位置随时间的梯形速度曲线：起步缓、中途匀速、到站缓停
  function ease(t) {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    if (t < A) return V * t * t / (2 * A);
    if (t < B) return V * A / 2 + V * (t - A);
    var u = t - B;
    return V * A / 2 + V * (B - A) + V * u - V * u * u / (2 * (1 - B));
  }

  function render(p) {
    var dist = D * p;
    var wx = P0 + dist;
    var cam = Math.max(0, Math.min(MAXCAM, wx - 270));

    world.setAttribute('transform', 'translate(' + (-cam) + ' 0)');
    far.setAttribute('transform', 'translate(' + (-cam * 0.35) + ' 0)');

    var bob = Math.sin(dist * 0.055) * 1.4;
    rider.setAttribute('transform', 'translate(' + wx + ' ' + (390 + bob) + ')');

    var ang = dist / (2 * Math.PI * WR) * 360;
    for (var i = 0; i < wheels.length; i++) {
      var w = wheels[i];
      w.setAttribute('transform', 'rotate(' + ang + ' ' + w.getAttribute('data-x') + ' -22)');
    }
    box.setAttribute('transform', 'rotate(' + (Math.sin(dist * 0.05) * 1.3) + ' -27 -98)');
    fill.style.width = (p * 100) + '%';
  }

  var elapsed = 0, last = 0, raf = null, playing = false, finished = false;

  function loop(ts) {
    if (!last) last = ts;
    elapsed = Math.min(T, elapsed + (ts - last));
    last = ts;
    render(ease(elapsed / T));
    if (elapsed >= T) { finish(); return; }   // 到站即停，不再排下一帧
    raf = requestAnimationFrame(loop);
  }

  function play() {
    if (playing) return;
    playing = true; last = 0;
    state.textContent = '配送中';
    btn.textContent = '⏸ 暂停';
    raf = requestAnimationFrame(loop);
  }

  function pause() {
    if (!playing) return;
    playing = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    last = 0;
    state.textContent = '已暂停';
    btn.textContent = '▶ 继续';
  }

  function finish() {
    playing = false;
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    last = 0; finished = true; elapsed = T;
    done.classList.add('on');
    bag.classList.add('on');
    state.textContent = '已送达';
    btn.textContent = '↻ 重播';
  }

  function reset() {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    playing = false; finished = false; elapsed = 0; last = 0;
    done.classList.remove('on');
    bag.classList.remove('on');
    render(0);
    state.textContent = '待出发';
    btn.textContent = '▶ 开始配送';
  }

  function toggle() {
    if (finished) { reset(); play(); }
    else if (playing) { pause(); }
    else { play(); }
  }

  btn.addEventListener('click', toggle);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); if (!finished || playing) toggle(); }
    else if (e.key === 'r' || e.key === 'R') { reset(); play(); }
  });

  render(0);
  play();   // 首次播放一次（之后只由用户手动重播）
})();
</script>
</body>
