<!DOCTYPE html>

<title>熊猫外卖骑士 · SVG 2D 动画</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    background: radial-gradient(1200px 620px at 50% -12%, #ffffff 0%, #e9eff7 55%, #dbe4ef 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 26px 20px; color: #33414f;
  }
  .stage {
    width: min(980px, 100%);
    border-radius: 22px;
    overflow: hidden;
    background: #dcefff;
    box-shadow: 0 30px 70px -30px rgba(32, 58, 88, .55), 0 0 0 1px rgba(255, 255, 255, .8) inset;
  }
  svg { display: block; width: 100%; height: auto; }
  svg text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  .bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: .5px;
    padding: 11px 24px; border-radius: 999px; border: 0; cursor: pointer; color: #fff;
    background: linear-gradient(180deg, #34a26d, #28885b);
    box-shadow: 0 8px 18px -8px rgba(40, 136, 91, .95);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 12px 22px -9px rgba(40, 136, 91, 1); }
  button:active { transform: translateY(1px) scale(.98); }
  .hint { font-size: 13px; color: #7e8a98; }
</style>
</head>

    var AY = 240;
    var out = '';
    out += '<g transform="translate(' + c.x + ',0)">';
    /* 楼体之间的暗缝 */
    out += '<rect x="-40" y="' + top + '" width="41" height="' + c.h + '" fill="#c9d0d9"/>';
    out += '<rect x="-40" y="' + top + '" width="7" height="' + c.h + '" fill="#aeb7c2"/>';
    /* 楼体 + 檐口 */
    out += '<rect x="0" y="' + top + '" width="' + w + '" height="' + c.h + '" fill="' + c.wall + '"/>';
    out += '<rect x="-7" y="' + (top - 13) + '" width="' + (w + 14) + '" height="17" rx="4" fill="' + c.trim + '"/>';
    /* 招牌 */
    out += '<rect x="12" y="' + sy + '" width="' + (w - 24) + '" height="48" rx="7" fill="' + c.sign + '"/>';
    out += '<rect x="12" y="' + sy + '" width="' + (w - 24) + '" height="48" rx="7" fill="none" stroke="rgba(0,0,0,.16)" stroke-width="2"/>';
    out += '<text x="' + (w / 2) + '" y="' + (sy + 34) + '" text-anchor="middle" font-size="' +
           (c.name.length > 5 ? 22 : 27) + '" font-weight="800" fill="#ffffff" letter-spacing="1.5">' + c.name + '</text>';
    out += '<rect x="12" y="' + (sy + 48) + '" width="' + (w - 24) + '" height="3" fill="rgba(0,0,0,.12)"/>';
    /* 二楼窗 */
    [18, 102, 186].forEach(function (wx) {
      out += '<rect x="' + wx + '" y="' + wy + '" width="56" height="40" rx="3" fill="#ffffff"/>';
      out += '<rect x="' + (wx + 3) + '" y="' + (wy + 3) + '" width="50" height="34" rx="2" fill="' + c.glass + '"/>';
      out += '<rect x="' + (wx + 26) + '" y="' + (wy + 3) + '" width="3" height="34" fill="#ffffff" opacity=".85"/>';
      out += '<path d="M' + (wx + 6) + ',' + (wy + 6) + ' l18,0 l-18,16 z" fill="#ffffff" opacity=".5"/>';
    });
    /* 橱窗 */
    out += '<rect x="14" y="252" width="152" height="88" rx="3" fill="' + c.trim + '"/>';
    out += '<rect x="18" y="256" width="144" height="78" rx="2" fill="' + c.glass + '"/>';
    out += '<rect x="18" y="256" width="144" height="78" rx="2" fill="#ffffff" opacity=".18"/>';
    out += '<rect x="26" y="266" width="60" height="5" rx="2.5" fill="#ffffff" opacity=".55"/>';
    out += '<rect x="26" y="280" width="92" height="5" rx="2.5" fill="#ffffff" opacity=".4"/>';
    out += '<path d="M24,330 L52,262 L74,262 L40,330 Z" fill="#ffffff" opacity=".28"/>';
    /* 门 */
    out += '<rect x="174" y="250" width="72" height="90" rx="3" fill="' + c.trim + '"/>';
    out += '<rect x="179" y="255" width="62" height="85" rx="2" fill="' + c.glass + '"/>';
    out += '<rect x="179" y="255" width="62" height="85" rx="2" fill="#1a2b3a" opacity=".1"/>';
    out += '<circle cx="233" cy="300" r="3" fill="#ffffff" opacity=".9"/>';
    /* 门口绿植 */
    out += '<rect x="238" y="320" width="15" height="20" rx="3" fill="#c98b6b"/>';
    out += '<circle cx="245" cy="312" r="11" fill="#7fbf8b"/>';
    out += '<circle cx="239" cy="316" r="7" fill="#6fb37c"/>';
    /* 雨棚（压在橱窗之上） */
    out += '<rect x="-9" y="' + AY + '" width="' + (w + 18) + '" height="20" rx="4" fill="' + c.aw2 + '"/>';
    for (var sx = 0; sx < w; sx += 36) {
      out += '<rect x="' + sx + '" y="' + (AY + 2) + '" width="18" height="16" fill="' + c.aw1 + '" opacity=".8"/>';
    }
    out += '<rect x="-9" y="' + (AY + 18) + '" width="' + (w + 18) + '" height="5" rx="2.5" fill="rgba(0,0,0,.07)"/>';
    out += '<rect x="-9" y="' + AY + '" width="' + (w + 18) + '" height="1.5" fill="rgba(255,255,255,.5)"/>';
    /* 踢脚 */
    out += '<rect x="0" y="336" width="' + w + '" height="4" fill="rgba(0,0,0,.09)"/>';
    out += '</g>';
    return out;
  }

  document.getElementById('shops').innerHTML = SHOPS.map(shopSVG).join('');

  /* ---------------- 行道树 ---------------- */
  var TREES = [340, 940, 1540, 2150];
  document.getElementById('trees').innerHTML = TREES.map(function (tx) {
    return '<g transform="translate(' + tx + ',0)">' +
      '<rect x="-4.5" y="248" width="9" height="94" rx="4" fill="#9c7d60"/>' +
      '<circle cx="0" cy="236" r="31" fill="#7fc08a"/>' +
      '<circle cx="-17" cy="250" r="20" fill="#6cb178"/>' +
      '<circle cx="17" cy="250" r="18" fill="#8fd09a"/>' +
      '<circle cx="4" cy="222" r="18" fill="#8fd09a"/>' +
      '</g>';
  }).join('');

  /* ---------------- 路面与地砖纹理 ---------------- */
  var seams = '', dashes = '', i, x;
  for (x = -320; x < 3120; x += 56) {
    seams += '<line x1="' + x + '" y1="340" x2="' + x + '" y2="396" stroke="#d3dae3" stroke-width="2"/>';
  }
  for (x = -320; x < 3120; x += 64) {
    dashes += '<rect x="' + x + '" y="422" width="36" height="6" rx="3" fill="#ffffff" opacity=".62"/>';
  }
  for (x = -320; x < 3120; x += 64) {
    dashes += '<rect x="' + (x + 24) + '" y="496" width="42" height="7" rx="3.5" fill="#ffffff" opacity=".8"/>';
  }
  document.getElementById('seams').innerHTML = seams;
  document.getElementById('dashes').innerHTML = dashes;

  /* ---------------- 时间轴 ---------------- */
  var DIST  = 2120;      // 镜头总位移
  var T_ACC = 1200;      // 加速
  var T_CRU = 11000;     // 匀速
  var T_DEC = 2400;      // 减速
  var T_TRAVEL = T_ACC + T_CRU + T_DEC;      // 14600
  var V = DIST / (T_ACC / 2 + T_CRU + T_DEC / 2);   // 峰值速度 px/ms
  var T_BUBBLE = T_TRAVEL + 260;
  var T_END = T_TRAVEL + 4200;

  function offsetAt(t) {
    if (t <= 0) return 0;
    if (t < T_ACC) return 0.5 * V * t * t / T_ACC;
    if (t < T_ACC + T_CRU) return 0.5 * V * T_ACC + V * (t - T_ACC);
    var u = Math.min(t - T_ACC - T_CRU, T_DEC);
    return 0.5 * V * T_ACC + V * T_CRU + V * u - 0.5 * V * u * u / T_DEC;
  }

  function speedAt(t) {
    if (t <= 0) return 0;
    if (t < T_ACC) return V * t / T_ACC;
    if (t < T_ACC + T_CRU) return V;
    var u = Math.min(t - T_ACC - T_CRU, T_DEC);
    return V * (1 - u / T_DEC);
  }

  function easeOutBack(x) {
    var c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  /* ---------------- 元素引用 ---------------- */
  var world      = document.getElementById('world');
  var clouds     = document.getElementById('clouds');
  var rider      = document.getElementById('rider');
  var wheelF     = document.getElementById('wheelF');
  var wheelB     = document.getElementById('wheelB');
  var speedLines = document.getElementById('speedLines');
  var bubble     = document.getElementById('bubble');
  var bubbleInner= document.getElementById('bubbleInner');
  var sparkEls   = [
    { el: document.getElementById('spark0'), x: 74,  y: 152, s: 1.05 },
    { el: document.getElementById('spark1'), x: 428, y: 132, s: 0.85 },
    { el: document.getElementById('spark2'), x: 340, y: 78,  s: 0.95 },
    { el: document.getElementById('spark3'), x: 150, y: 68,  s: 0.7  }
  ];

  /* ---------------- 渲染 ---------------- */
  function render(t) {
    var off = offsetAt(t);
    var v = speedAt(t);
    var cruise = Math.min(1, Math.max(0, v / (V * 0.96)));

    world.setAttribute('transform', 'translate(' + (-off).toFixed(2) + ',0)');
    clouds.setAttribute('transform', 'translate(' + (-off * 0.22).toFixed(2) + ',0)');

    /* 车轮按行进距离转动 */
    var deg = off / 21 * 180 / Math.PI;
    wheelF.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ')');
    wheelB.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ')');

    /* 车身起伏 + 加减速俯仰 */
    var bob = Math.sin(t / 95) * 1.7 * cruise;
    var tilt = 0;
    if (t < T_ACC) tilt = -2.0 * cruise;
    else if (t > T_ACC + T_CRU) tilt = 2.2 * cruise;
    rider.setAttribute('transform',
      'translate(250,' + (464 + bob).toFixed(2) + ') rotate(' + tilt.toFixed(2) + ',0,0) scale(1.15)');

    /* 速度线：静止拖影，只随车速淡入淡出 */
    if (cruise > 0.03) {
      speedLines.setAttribute('opacity', (0.12 + 0.74 * cruise).toFixed(2));
    } else {
      speedLines.setAttribute('opacity', '0');
    }

    /* 送达气泡 */
    if (t >= T_BUBBLE) {
      var p = Math.min(1, (t - T_BUBBLE) / 620);
      var s = easeOutBack(p);
      bubble.setAttribute('opacity', '1');
      bubbleInner.setAttribute('transform',
        'translate(250,194) scale(' + s.toFixed(3) + ') translate(-250,-194)');
    } else {
      bubble.setAttribute('opacity', '0');
    }

    /* 小星星 */
    for (var i = 0; i < sparkEls.length; i++) {
      var sp = sparkEls[i];
      var dt = t - T_BUBBLE - (140 + i * 110);
      var tp = Math.max(0, Math.min(1, dt / 480));
      if (tp <= 0) { sp.el.setAttribute('opacity', '0'); continue; }
      var ss = easeOutBack(tp) * sp.s;
      var rot = (i % 2 === 0 ? 1 : -1) * (tp * 40);
      var twinkle = 0.72 + 0.28 * Math.abs(Math.sin((t + i * 400) / 620));
      sp.el.setAttribute('opacity', (tp * twinkle).toFixed(2));
      sp.el.setAttribute('transform',
        'translate(' + sp.x + ',' + sp.y + ') rotate(' + rot.toFixed(1) + ') scale(' + ss.toFixed(3) + ')');
    }
  }

  /* ---------------- 播放控制（不自动重播） ---------------- */
  var rafId = null, startTime = null;

  function tick(now) {
    if (startTime === null) startTime = now;
    var t = now - startTime;
    render(Math.min(t, T_END));
    if (t < T_END) {
      rafId = requestAnimationFrame(tick);
    } else {
      rafId = null;   /* 结束即停，绝不自动重播 */
    }
  }

  function play() {
    if (rafId !== null) cancelAnimationFrame(rafId);
    rafId = null;
    startTime = null;
    render(0);
    rafId = requestAnimationFrame(tick);
  }

  document.getElementById('replay').addEventListener('click', play);

  play();   /* 首次播放；之后只由用户手动触发 */
})();
</script>
</body>
