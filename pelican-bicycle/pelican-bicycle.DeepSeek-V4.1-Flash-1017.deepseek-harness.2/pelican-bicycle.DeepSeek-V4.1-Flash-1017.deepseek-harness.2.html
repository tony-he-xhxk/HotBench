<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑车 · Pelican on Wheels</title>
<style>
  :root{
    --ink:#173d3a;
    --ink-soft:#315854;
    --cream:#fbf3e2;
    --coral:#d9694b;
    --teal:#1e5b57;
    --stage-bg:#f5c49b;
    --page-pad:clamp(10px, 3vw, 38px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100svh;
    display:grid;
    place-items:center;
    padding:var(--page-pad);
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 15%, #245a54 0%, #143b39 42%, #0b2525 100%);
    font-family:"Trebuchet MS","PingFang SC","Microsoft YaHei",sans-serif;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.24;
    background-image:
      radial-gradient(circle at 18% 26%, rgba(255,240,205,.18) 0 1px, transparent 1.5px),
      radial-gradient(circle at 72% 66%, rgba(255,240,205,.13) 0 1px, transparent 1.5px);
    background-size:27px 31px, 41px 37px;
  }
  .stage{
    position:relative;
    width:min(100%, 1480px, calc((100svh - (var(--page-pad) * 2)) * 1.7142857));
    aspect-ratio:12 / 7;
    overflow:hidden;
    isolation:isolate;
    border-radius:clamp(16px, 2.4vw, 30px);
    background:var(--stage-bg);
    box-shadow:
      0 36px 90px rgba(0,0,0,.44),
      0 8px 24px rgba(0,0,0,.22),
      0 0 0 1px rgba(255,248,226,.14);
  }
  .artwork,.artwork svg{display:block;width:100%;height:100%}
  .artwork svg{overflow:hidden}
  .masthead{
    position:absolute;
    top:clamp(20px, 4.2vw, 52px);
    left:clamp(22px, 4.4vw, 64px);
    z-index:3;
    color:var(--ink);
    pointer-events:none;
    max-width:40%;
    text-shadow:0 1px 0 rgba(255,255,255,.08);
  }
  .wordmark{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0;
    font-size:clamp(7px, .82vw, 10px);
    font-weight:700;
    letter-spacing:.24em;
    white-space:nowrap;
    color:var(--ink-soft);
  }
  .wordmark::before{
    content:"";
    width:clamp(18px, 2.2vw, 30px);
    height:1px;
    background:currentColor;
    opacity:.7;
  }
  h1{
    margin:clamp(11px, 1.8vw, 20px) 0 0;
    font-family:Georgia, "Times New Roman", serif;
    font-size:clamp(28px, 4.35vw, 62px);
    font-weight:400;
    line-height:.9;
    letter-spacing:-.045em;
  }
  h1 em{
    display:block;
    margin-left:.72em;
    font-weight:400;
    letter-spacing:-.055em;
  }
  .subline{
    margin:clamp(10px, 1.6vw, 16px) 0 0;
    font-size:clamp(8px, .9vw, 11px);
    letter-spacing:.11em;
    line-height:1.65;
    color:var(--ink-soft);
    opacity:.82;
  }
  .controls{
    position:absolute;
    right:clamp(16px, 2.8vw, 34px);
    bottom:clamp(14px, 2.6vw, 28px);
    z-index:4;
    display:flex;
    gap:8px;
    align-items:center;
  }
  .controls button{
    appearance:none;
    border:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    height:clamp(34px, 3.2vw, 42px);
    min-width:clamp(34px, 3.2vw, 42px);
    padding:0 13px;
    border-radius:999px;
    background:rgba(251,243,226,.76);
    color:#173d3a;
    font:700 clamp(9px, .9vw, 11px)/1 "Trebuchet MS","PingFang SC",sans-serif;
    letter-spacing:.08em;
    cursor:pointer;
    box-shadow:0 7px 22px rgba(53,31,20,.16), inset 0 0 0 1px rgba(45,74,67,.15);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    transition:background .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .controls button:hover{
    background:rgba(255,249,234,.96);
    transform:translateY(-1px);
    box-shadow:0 10px 26px rgba(53,31,20,.2), inset 0 0 0 1px rgba(45,74,67,.2);
  }
  .controls button:focus-visible{
    outline:2px solid #fff6dc;
    outline-offset:3px;
  }
  .controls button:active{transform:translateY(0) scale(.97)}
  .play-icon{
    position:relative;
    display:inline-block;
    width:10px;
    height:11px;
    flex:none;
  }
  .play-icon::before,.play-icon::after{
    content:"";
    position:absolute;
    top:1px;
    width:3px;
    height:10px;
    border-radius:2px;
    background:currentColor;
    transition:all .2s ease;
  }
  .play-icon::before{left:1px}
  .play-icon::after{right:1px}
  .is-paused .play-icon::before{
    top:0;left:1px;width:0;height:0;
    border-top:5.5px solid transparent;
    border-bottom:5.5px solid transparent;
    border-left:8px solid currentColor;
    border-radius:0;
    background:transparent;
  }
  .is-paused .play-icon::after{display:none}
  #speedBtn{min-width:clamp(42px,4vw,52px);padding:0 11px}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }
  @media (max-width:680px){
    body{padding:12px;background:radial-gradient(circle at 50% 40%, #194743 0%, #0b2525 74%)}
    .stage{width:100%;height:auto;min-height:0;aspect-ratio:1 / 1;border-radius:18px;box-shadow:0 24px 56px rgba(0,0,0,.36), 0 0 0 1px rgba(255,248,226,.1)}
    .masthead{top:clamp(14px, 4vw, 22px);left:clamp(15px, 4.5vw, 22px);max-width:58%}
    .wordmark{font-size:6.5px;letter-spacing:.18em;gap:6px}
    .wordmark::before{width:15px}
    h1{margin-top:8px;font-size:clamp(24px, 7.2vw, 34px)}
    .subline{display:none}
    .controls{right:12px;bottom:12px;gap:6px;transform:none}
    .controls button{height:38px;padding:0 12px}
    #speedBtn{min-width:46px;padding:0 10px}
  }
  @media (prefers-reduced-motion: reduce){
    .controls button{transition:none}
  }
</style>
</head>
<body>
<main class="stage" id="stage">
  <div class="artwork">
    <svg id="scene" viewBox="0 0 1200 700" role="img" aria-labelledby="sceneTitle sceneDesc" preserveAspectRatio="xMidYMid slice">
      <title id="sceneTitle">一只鹈鹕沿着海岸骑自行车</title>

        <!-- fenders -->
        <path d="M291 483A112 112 0 0 1 489 483" fill="none" stroke="#283a38" stroke-width="15" stroke-linecap="round"/>

<script>
(() => {
  "use strict";

  const svg = document.getElementById("scene");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const toggleBtn = document.getElementById("toggleBtn");
  const toggleLabel = document.getElementById("toggleLabel");

  const state = {

    last: performance.now(),

    speed: 1

  const byId = (id) => document.getElementById(id);
  const rearSpin = byId("rearSpin");
  const frontSpin = byId("frontSpin");
  const crank = byId("crank");
  const nearPedal = byId("nearPedal");
  const farPedal = byId("farPedal");
  const nearFoot = byId("nearFoot");

  const waveOne = byId("waveOne");
  const waveTwo = byId("waveTwo");
  const waveThree = byId("waveThree");
  const sunPath = byId("sunPath");
  const boat = byId("boat");
  const groundShadow = byId("groundShadow");
  const basketFish = byId("basketFish");

  const clouds = Array.from(document.querySelectorAll(".cloud")).map((el) => ({
    el,
    x: parseFloat(el.dataset.x),
    y: parseFloat(el.dataset.y),
    speed: parseFloat(el.dataset.speed),
    scale: parseFloat(el.dataset.scale)

  const winds = Array.from(document.querySelectorAll(".wind")).map((el) => ({
    el,
    x: parseFloat(el.dataset.x),
    y: parseFloat(el.dataset.y),
    speed: parseFloat(el.dataset.speed),
    scale: parseFloat(el.dataset.scale)
  }));

  const tufts = Array.from(document.querySelectorAll(".tuft")).map((el) => ({
    el,
    x: parseFloat(el.dataset.x),
    y: parseFloat(el.dataset.y),
    speed: parseFloat(el.dataset.speed),
    scale: parseFloat(el.dataset.scale)
  }));

  const legLines = {
    near: {
      thigh: Array.from(document.querySelectorAll('[data-leg="near"][data-seg="thigh"]')),
      shin: Array.from(document.querySelectorAll('[data-leg="near"][data-seg="shin"]'))
    },
    far: {
      thigh: Array.from(document.querySelectorAll('[data-leg="far"][data-seg="thigh"]')),
      shin: Array.from(document.querySelectorAll('[data-leg="far"][data-seg="shin"]'))
    }
  };
  const joints = {
    near: document.querySelector('[data-joint="near-knee"]'),
    far: document.querySelector('[data-joint="far-knee"]')
  };

  const CRANK = { x: 592, y: 529 };
  const PEDAL_RADIUS = 43;
  const THIGH = 105;
  const SHIN = 104;
  const HIP_NEAR = { x: 552, y: 386 };
  const HIP_FAR = { x: 528, y: 391 };

  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
  const deg = (rad) => rad * 180 / Math.PI;

  function solveKnee(hip, foot, l1, l2, forward) {
    let dx = foot.x - hip.x;
    let dy = foot.y - hip.y;
    let dist = Math.hypot(dx, dy);
    const minDist = Math.abs(l1 - l2) + 0.5;
    const maxDist = l1 + l2 - 0.5;
    if (dist < 1e-5) dist = 1e-5;
    const clamped = clamp(dist, minDist, maxDist);
    dx = dx / dist * clamped;
    dy = dy / dist * clamped;
    dist = clamped;
    const base = Math.atan2(dy, dx);
    const cosA = clamp((l1 * l1 + dist * dist - l2 * l2) / (2 * l1 * dist), -1, 1);
    const inner = Math.acos(cosA);
    const kneeAngle = base - forward * inner;
    return { x: hip.x + Math.cos(kneeAngle) * l1, y: hip.y + Math.sin(kneeAngle) * l1 };
  }

  function setLine(group, segment, x1, y1, x2, y2) {
    for (const line of legLines[group][segment]) {
      line.setAttribute("x1", x1.toFixed(2));
      line.setAttribute("y1", y1.toFixed(2));
      line.setAttribute("x2", x2.toFixed(2));
      line.setAttribute("y2", y2.toFixed(2));
    }
  }

  function drawLeg(group, hip, pedal, footEl) {
    const target = { x: pedal.x - 2, y: pedal.y - 5 };
    const knee = solveKnee(hip, target, THIGH, SHIN, 1);
    setLine(group, "thigh", hip.x, hip.y, knee.x, knee.y);
    setLine(group, "shin", knee.x, knee.y, target.x, target.y);
    const joint = joints[group];
    joint.setAttribute("cx", knee.x.toFixed(2));
    joint.setAttribute("cy", knee.y.toFixed(2));
    footEl.setAttribute("transform", `translate(${pedal.x.toFixed(2)} ${pedal.y.toFixed(2)})`);
    return knee;
  }

  function makeRibbon(t, anchorX, anchorY, length, widthStart, widthEnd, phase, amplitude, rise, count) {
    const top = [];
    const bottom = [];
    const points = [];
    for (let i = 0; i <= count; i++) {
      const s = i / count;
      const x = anchorX - s * length;
      const y = anchorY
        - s * rise
        + Math.sin(t * 4.35 - s * 5.7 + phase) * amplitude * s
        + Math.sin(t * 1.7 + phase) * 1.7 * s;
      points.push({ x, y, s });
    }
    for (let i = 0; i <= count; i++) {
      const p = points[i];
      const prev = points[Math.max(0, i - 1)];
      const next = points[Math.min(count, i + 1)];
      let dx = next.x - prev.x;
      let dy = next.y - prev.y;
      const len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len;
      const ny = dx / len;
      const w = widthStart + (widthEnd - widthStart) * Math.pow(p.s, .8);
      top.push({ x: p.x + nx * w * .5, y: p.y + ny * w * .5 });
      bottom.push({ x: p.x - nx * w * .5, y: p.y - ny * w * .5 });
    }
    let d = `M${top[0].x.toFixed(2)} ${top[0].y.toFixed(2)}`;
    for (let i = 1; i <= count; i++) d += `L${top[i].x.toFixed(2)} ${top[i].y.toFixed(2)}`;
    for (let i = count; i >= 0; i--) d += `L${bottom[i].x.toFixed(2)} ${bottom[i].y.toFixed(2)}`;
    return d + "Z";
  }

  function update(t) {
    const crankAngle = t * 2.65 + 0.35;
    const wheelDeg = t * 285;
    const crankDeg = deg(crankAngle);
    const bob = Math.sin(crankAngle * 2) * 2.15;

    // rotating wheels and drivetrain
    rearSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    frontSpin.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)})`);
    crank.setAttribute("transform", `rotate(${crankDeg.toFixed(2)})`);
    chain.setAttribute("stroke-dashoffset", (-t * 50 % 11).toFixed(2));
    roadDash.setAttribute("stroke-dashoffset", (t * 340 % 134).toFixed(2));
    roadDashSmall.setAttribute("stroke-dashoffset", (t * 290 % 70).toFixed(2));

    // pedal positions
    const near = {
      x: CRANK.x + Math.cos(crankAngle) * PEDAL_RADIUS,
      y: CRANK.y + Math.sin(crankAngle) * PEDAL_RADIUS
    };
    const far = {
      x: CRANK.x - Math.cos(crankAngle) * PEDAL_RADIUS,
      y: CRANK.y - Math.sin(crankAngle) * PEDAL_RADIUS
    };
    nearPedal.setAttribute("transform", `translate(${near.x.toFixed(2)} ${near.y.toFixed(2)})`);
    farPedal.setAttribute("transform", `translate(${far.x.toFixed(2)} ${far.y.toFixed(2)})`);

    // pelican body and head bob
    const hipNear = { x: HIP_NEAR.x, y: HIP_NEAR.y + bob };
    const hipFar = { x: HIP_FAR.x, y: HIP_FAR.y + bob };
    drawLeg("near", hipNear, near, nearFoot);
    drawLeg("far", hipFar, far, farFoot);

    pelicanBody.setAttribute("transform", `translate(0 ${bob.toFixed(2)})`);
    const headTurn = Math.sin(crankAngle * 1.08 - .45) * 1.35;
    pelicanHead.setAttribute("transform", `rotate(${headTurn.toFixed(2)} 620 295)`);
    const pouchTurn = Math.sin(crankAngle * 2 - .85) * 1.4;
    pouch.setAttribute("transform", `rotate(${pouchTurn.toFixed(2)} 736 241)`);

    // scarf
    scarfOne.setAttribute("d", makeRibbon(t, 659, 284, 216, 21, 3.5, 0.1, 12, 12, 34));
    scarfTwo.setAttribute("d", makeRibbon(t + .22, 664, 293, 164, 12, 2.2, 2.15, 9, 6, 26));

    // gentle ground shadow pulse
    groundShadow.setAttribute("opacity", (0.9 + Math.sin(crankAngle * 2) * .07).toFixed(3));

    // sea
    waveOne.setAttribute("stroke-dashoffset", (t * 18).toFixed(2));
    waveTwo.setAttribute("stroke-dashoffset", (t * 12).toFixed(2));
    waveThree.setAttribute("stroke-dashoffset", (t * 24).toFixed(2));
    sunPath.setAttribute("opacity", (0.78 + Math.sin(t * 1.8) * .16).toFixed(3));
    boat.setAttribute("transform", `translate(${(1038 - (t * 2.8 % 160)).toFixed(1)} ${(500 + Math.sin(t * 1.25) * 2.4).toFixed(2)})`);

    // clouds
    for (const cloud of clouds) {
      let x = ((cloud.x - t * cloud.speed + 200) % 1500 + 1500) % 1500 - 200;
      cloud.el.setAttribute("transform", `translate(${x.toFixed(1)} ${cloud.y}) scale(${cloud.scale})`);
    }

    // quick foreground parallax
    for (const wind of winds) {
      let x = ((wind.x - t * wind.speed + 180) % 1400 + 1400) % 1400 - 180;
      wind.el.setAttribute("transform", `translate(${x.toFixed(1)} ${wind.y}) scale(${wind.scale})`);
    }
    for (const tuft of tufts) {
      let x = ((tuft.x - t * tuft.speed + 140) % 1440 + 1440) % 1440 - 140;
      tuft.el.setAttribute("transform", `translate(${x.toFixed(1)} ${tuft.y}) scale(${tuft.scale})`);
    }

    // fish in the basket has its own little wobble
    basketFish.setAttribute("transform", `rotate(${(Math.sin(t * 3.4) * 2.5).toFixed(2)} 793 398)`);
  }

  function refreshButton() {
    document.body.classList.toggle("is-paused", !state.playing);
    toggleBtn.classList.toggle("is-paused", !state.playing);
    toggleBtn.setAttribute("aria-pressed", String(!state.playing));
    toggleBtn.setAttribute("aria-label", state.playing ? "暂停动画" : "播放动画");
    toggleLabel.textContent = state.playing ? "暂停" : "播放";
    speedBtn.textContent = Number.isInteger(state.speed) ? state.speed + "×" : state.speed.toFixed(1) + "×";
  }

  function frame(now) {
    const elapsed = Math.min(64, Math.max(0, now - state.last));
    state.last = now;
    if (state.playing) {
      state.t += elapsed * 0.001 * state.speed;
      update(state.t);
    }
    requestAnimationFrame(frame);
  }

  toggleBtn.addEventListener("click", () => {
    state.playing = !state.playing;
    state.last = performance.now();
    refreshButton();
  });

  const speeds = [1, 1.5, 2, 0.6];
  speedBtn.addEventListener("click", () => {
    const index = speeds.indexOf(state.speed);
    state.speed = speeds[(index + 1) % speeds.length];
    refreshButton();
  });

  document.addEventListener("keydown", (event) => {
    if (event.code === "Space" && event.target === document.body) {
      event.preventDefault();
      toggleBtn.click();
    }
  });

  update(0);
  refreshButton();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
