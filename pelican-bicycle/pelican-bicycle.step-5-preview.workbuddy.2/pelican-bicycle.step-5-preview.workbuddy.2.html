    justify-content: center;
    background: #f2f7f7;

  .card {

    font-size: 13px;
    letter-spacing: 1px;
    padding: 4px 0 10px;
  }
  /* 鹈鹕喉囊抖动 */
  .pouch {
    transform-box: fill-box;
    transform-origin: 50% 0%;
    animation: jiggle 0.5s ease-in-out infinite alternate;

  @keyframes jiggle {
    from { transform: scale(1, 1); }
