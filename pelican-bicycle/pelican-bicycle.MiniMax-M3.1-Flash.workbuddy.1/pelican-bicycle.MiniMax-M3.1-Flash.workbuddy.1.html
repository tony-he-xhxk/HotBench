<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --sky-1:#dff1ff; --sky-2:#f4fbff;
    --hill:#bfe6c8; --hill-2:#a8dcb6;
    --road:#eceef2; --road-line:#c9ced8;
    --frame:#2f6f6b; --frame-2:#275c58;
    --tire:#3a3f47; --rim:#9aa3ad;
    --body:#fbfcfd; --body-sh:#e4ebf0;
    --beak:#f0a63c; --beak-d:#d8862a; --pouch:#f6cd7d;
    --ink:#22303c;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(180deg,var(--sky-1),var(--sky-2));
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
  }
  .stage{
    width:min(94vw,860px); background:#fff; border-radius:18px;
    box-shadow:0 18px 40px rgba(34,48,60,.14), 0 2px 0 rgba(34,48,60,.06);
    padding:10px;
  }
  svg{width:100%; height:auto; display:block; border-radius:12px;}
  .hint{font-size:13px; opacity:.62; letter-spacing:.5px}
  text{user-select:none}

  /* ---------- 动画 ---------- */
  .spin{transform-box:view-box; animation:spin 1.1s linear infinite}
  .crank{transform-box:view-box; transform-origin:340px 300px; animation:spin 1.1s linear infinite}
  .bob{transform-box:view-box; transform-origin:340px 320px; animation:bob 1.1s ease-in-out infinite}
  .head{transform-box:view-box; transform-origin:392px 150px; animation:headbob 1.1s ease-in-out infinite}
  .wing{transform-box:view-box; transform-origin:352px 160px; animation:wing 1.1s ease-in-out infinite}
  .cloud-a{animation:drift 26s linear infinite}
  .cloud-b{animation:drift 38s linear infinite reverse}
  .stripes{animation:scroll 1.1s linear infinite}
  .pouch{transform-box:view-box; transform-origin:416px 120px; animation:pouch 1.1s ease-in-out infinite}

  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-3px) rotate(-0.8deg)}
    50%{transform:translateY(0) rotate(0deg)}
    75%{transform:translateY(-3px) rotate(0.8deg)}
  }
  @keyframes headbob{
    0%,100%{transform:rotate(-1.6deg) translateY(0)}
    50%{transform:rotate(1.8deg) translateY(-2px)}
  }
  @keyframes wing{
    0%,100%{transform:rotate(-2.2deg)}
    50%{transform:rotate(2.2deg)}
  }
  @keyframes pouch{
    0%,100%{transform:rotate(0deg) scaleY(1)}
    50%{transform:rotate(2deg) scaleY(1.06)}
  }
  @keyframes drift{from{transform:translateX(-260px)}to{transform:translateX(900px)}}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-120px)}}
</style>
</head>
<body>

<div class="stage">
<svg viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="鹈鹕骑自行车的二维动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcefff"/>
      <stop offset="70%" stop-color="#f2faff"/>
      <stop offset="100%" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9eff4"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7b651"/>
      <stop offset="100%" stop-color="#e08f2a"/>
    </linearGradient>
    <clipPath id="roadClip"><rect x="0" y="330" width="680" height="90"/></clipPath>
  </defs>

  <!-- 天空 -->
  <rect x="0" y="0" width="680" height="420" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="586" cy="66" r="30" fill="#ffe08a" opacity="0.85"/>
  <circle cx="586" cy="66" r="44" fill="#ffe08a" opacity="0.22"/>

  <!-- 云 -->
  <g class="cloud-a" opacity="0.9">
    <g fill="#ffffff">
      <ellipse cx="120" cy="70" rx="34" ry="20"/>
      <ellipse cx="152" cy="62" rx="26" ry="18"/>
      <ellipse cx="88" cy="76" rx="22" ry="14"/>
    </g>
  </g>
  <g class="cloud-b" opacity="0.75">
    <g fill="#ffffff">
      <ellipse cx="300" cy="42" rx="30" ry="16"/>
      <ellipse cx="326" cy="36" rx="20" ry="13"/>
    </g>
  </g>

  <!-- 远山 -->
  <path d="M0 300 L120 232 L215 300 Z" fill="var(--hill)"/>
  <path d="M150 300 L300 220 L450 300 Z" fill="var(--hill-2)"/>
  <path d="M360 300 L500 240 L640 300 Z" fill="var(--hill)"/>
  <rect x="0" y="298" width="680" height="36" fill="#cdeada"/>

  <!-- 路面 -->
  <rect x="0" y="330" width="680" height="90" fill="var(--road)"/>
  <rect x="0" y="330" width="680" height="5" fill="#d7dbe2"/>
  <g class="stripes" clip-path="url(#roadClip)">
    <g fill="var(--road-line)">
      <rect x="0" y="372" width="70" height="8" rx="4"/>
      <rect x="120" y="372" width="70" height="8" rx="4"/>
      <rect x="240" y="372" width="70" height="8" rx="4"/>
      <rect x="360" y="372" width="70" height="8" rx="4"/>
      <rect x="480" y="372" width="70" height="8" rx="4"/>
      <rect x="600" y="372" width="70" height="8" rx="4"/>
    </g>
  </g>

  <!-- 主体：随车身晃动 -->
  <g class="bob">

    <!-- 阴影 -->
    <ellipse cx="340" cy="352" rx="150" ry="12" fill="#8fa0b0" opacity="0.18"/>

    <!-- 自行车 -->
    <g id="bike">
      <!-- 车架 -->
      <g stroke="var(--frame)" stroke-width="8" stroke-linecap="round" fill="none">
        <path d="M250 300 L300 212"/>      <!-- 座管/后上 -->
        <path d="M300 212 L340 300"/>      <!-- 座管 -->
        <path d="M340 300 L250 300"/>      <!-- 链叉 -->
        <path d="M300 212 L415 205"/>      <!-- 上管 -->
        <path d="M340 300 L415 205"/>      <!-- 下管 -->
        <path d="M415 205 L430 300"/>      <!-- 前叉 -->
      </g>
      <g stroke="var(--frame-2)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.85">
        <path d="M250 300 L300 212"/>
        <path d="M300 212 L415 205"/>
      </g>
      <!-- 链条 -->
      <path d="M250 300 L340 300" stroke="#6b7280" stroke-width="3" stroke-dasharray="4 3" fill="none"/>

      <!-- 车把 -->
      <g stroke="var(--frame)" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M415 205 L420 180"/>
        <path d="M398 176 L444 176"/>
      </g>
      <circle cx="398" cy="176" r="6" fill="#333b45"/>
      <circle cx="444" cy="176" r="6" fill="#333b45"/>

      <!-- 车座 -->
      <path d="M286 206 q16 -12 34 -2 q-6 10 -18 10 q-12 0 -16 -8 z" fill="#3a3f47"/>

      <!-- 牙盘 + 曲柄 -->
      <g class="crank">
        <line x1="340" y1="300" x2="370" y2="300" stroke="#5a626d" stroke-width="7" stroke-linecap="round"/>
        <rect x="360" y="294" width="22" height="12" rx="3" fill="#333b45"/>
        <circle cx="340" cy="300" r="9" fill="#4b525c"/>
      </g>

      <!-- 后轮 -->
      <g>
        <circle cx="250" cy="300" r="55" fill="none" stroke="var(--tire)" stroke-width="8"/>
        <circle cx="250" cy="300" r="46" fill="none" stroke="var(--rim)" stroke-width="2.5"/>
        <g class="spin" style="transform-origin:250px 300px" stroke="var(--rim)" stroke-width="2">
          <line x1="250" y1="255" x2="250" y2="345"/>
          <line x1="205" y1="300" x2="295" y2="300"/>
          <line x1="217" y1="267" x2="283" y2="333"/>
          <line x1="283" y1="267" x2="217" y2="333"/>
        </g>
        <circle cx="250" cy="300" r="6" fill="#4b525c"/>
      </g>

      <!-- 前轮 -->
      <g>
        <circle cx="430" cy="300" r="55" fill="none" stroke="var(--tire)" stroke-width="8"/>
        <circle cx="430" cy="300" r="46" fill="none" stroke="var(--rim)" stroke-width="2.5"/>
        <g class="spin" style="transform-origin:430px 300px" stroke="var(--rim)" stroke-width="2">
          <line x1="430" y1="255" x2="430" y2="345"/>
          <line x1="385" y1="300" x2="475" y2="300"/>
          <line x1="397" y1="267" x2="463" y2="333"/>
          <line x1="463" y1="267" x2="397" y2="333"/>
        </g>
        <circle cx="430" cy="300" r="6" fill="#4b525c"/>
      </g>
    </g>

    <!-- 鹈鹕 -->
    <g id="pelican">
      <!-- 腿：髋部固定，脚随脚踏圆周运动 -->
      <g stroke="#e3a03c" stroke-width="11" stroke-linecap="round" fill="none">
        <!-- 右腿（在前） -->
        <line x1="336" y1="214" x2="370" y2="300">
          <animate attributeName="x2" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="370;361.2;340;318.8;310;318.8;340;361.2;370"/>
          <animate attributeName="y2" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="300;321.2;330;321.2;300;278.8;270;278.8;300"/>
        </line>
        <!-- 左腿（在后） -->
        <line x1="318" y1="212" x2="310" y2="300">
          <animate attributeName="x2" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="310;318.8;340;361.2;370;361.2;340;318.8;310"/>
          <animate attributeName="y2" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="300;278.8;270;278.8;300;321.2;330;321.2;300"/>
        </line>
      </g>
      <!-- 脚 -->
      <g fill="#e3a03c">
        <circle cx="370" cy="300" r="7">
          <animate attributeName="cx" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="370;361.2;340;318.8;310;318.8;340;361.2;370"/>
          <animate attributeName="cy" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="300;321.2;330;321.2;300;278.8;270;278.8;300"/>
        </circle>
        <circle cx="310" cy="300" r="7">
          <animate attributeName="cx" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="310;318.8;340;361.2;370;361.2;340;318.8;310"/>
          <animate attributeName="cy" dur="1.1s" repeatCount="indefinite"
            keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1"
            calcMode="linear"
            values="300;278.8;270;278.8;300;321.2;330;321.2;300"/>
        </circle>
      </g>

      <!-- 身体 -->
      <ellipse cx="322" cy="172" rx="78" ry="52" fill="url(#bodyGrad)" stroke="#dbe4ec" stroke-width="2"/>
      <!-- 尾羽 -->
      <path d="M252 186 q-40 -6 -52 16 q26 12 54 6 z" fill="var(--body-sh)"/>
      <!-- 翅膀（握车把） -->
      <g class="wing">
        <path d="M344 150 q46 6 62 34 q6 10 -4 14 q-10 4 -16 -6 q-14 -22 -44 -26 z" fill="#eef3f7" stroke="#dbe4ec" stroke-width="2"/>
      </g>
      <!-- 翅膀尖搭在车把上 -->
      <path d="M404 190 q10 -6 18 -8" stroke="#dbe4ec" stroke-width="2" fill="none"/>

      <!-- 头 + 颈 -->
      <g class="head">
        <path d="M356 152 q22 -46 40 -50 q14 4 8 22 q-8 24 -30 44 z" fill="url(#bodyGrad)" stroke="#dbe4ec" stroke-width="2"/>
        <circle cx="400" cy="104" r="27" fill="url(#bodyGrad)" stroke="#dbe4ec" stroke-width="2"/>
        <!-- 头羽 -->
        <path d="M382 88 q-6 -14 6 -18 q4 8 2 14 z" fill="#e9eff4"/>
        <!-- 眼 -->
        <circle cx="406" cy="98" r="5.4" fill="#22303c"/>
        <circle cx="407.8" cy="96.4" r="1.8" fill="#ffffff"/>
        <!-- 喙 -->
        <path d="M424 92 L520 110 q6 2 3 8 q-2 4 -9 3 L424 108 z" fill="url(#beakGrad)" stroke="#cf8423" stroke-width="1.5"/>
        <path d="M424 104 L516 118" stroke="#cf8423" stroke-width="1.2" opacity="0.7" fill="none"/>
        <!-- 喉囊 -->
        <g class="pouch">
          <path d="M424 110 q34 46 76 8 q-34 -6 -76 -8 z" fill="var(--pouch)" stroke="#dfa94f" stroke-width="1.5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- 文字 -->
  <text x="24" y="40" font-size="15" fill="#3b4a58" opacity="0.7" font-weight="600">Pelican on a Bicycle</text>
</svg>
</div>
<div class="hint">纯 SVG + CSS/SMIL 动画 · 车轮旋转、踩踏、拍翅、身体起伏</div>

</body>
</html>
