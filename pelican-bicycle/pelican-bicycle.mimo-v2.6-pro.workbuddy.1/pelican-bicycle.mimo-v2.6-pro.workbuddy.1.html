<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 · 2D 动画</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #eaf6ff;
    overflow: hidden;
  }
  .stage {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
  }
  svg { width: 100%; height: 100%; display: block; }

  /* ---------- keyframes ---------- */
  @keyframes spin        { to { transform: rotate(360deg); } }
  @keyframes spinBack    { to { transform: rotate(-360deg); } }

  @keyframes bob {
    0%, 100% { transform: translateY(0px); }
    50%      { transform: translateY(-5px); }
  }

  /* 腿部蹬踏：绕髋关节往复摆动，两腿相位相差 180° */
  @keyframes pedalA {
    0%   { transform: rotate(-26deg); }
    50%  { transform: rotate(30deg); }
    100% { transform: rotate(-26deg); }
  }
  @keyframes pedalB {
    0%   { transform: rotate(30deg); }
    50%  { transform: rotate(-26deg); }
    100% { transform: rotate(30deg); }
  }

  /* 翅膀轻微起伏 */
  @keyframes wing {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(5deg); }
  }

  /* 喙下喉囊随节奏轻晃 */
  @keyframes pouch {
    0%, 100% { transform: rotate(0deg); }
    50%      { transform: rotate(-3deg); }
  }

  /* 云层平移（两端都在画面外，回跳不可见） */
  @keyframes cloudDrift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1350px); }
  }

  /* 路面虚线后掠，制造前进感 */
  @keyframes roadRun {
    from { transform: translateX(0); }
    to   { transform: translateX(-180px); }
  }

  /* 近处草丛后掠 */
  @keyframes grassRun {
    from { transform: translateX(0); }
    to   { transform: translateX(-240px); }
  }

  .spin      { transform-box: view-box; animation: spin 1.15s linear infinite; }
  .spinBack  { transform-box: view-box; animation: spinBack 1.15s linear infinite; }
  .bob       { transform-box: view-box; animation: bob 1.15s ease-in-out infinite; }
  .legA      { transform-box: view-box; animation: pedalA 1.15s ease-in-out infinite; }
  .legB      { transform-box: view-box; animation: pedalB 1.15s ease-in-out infinite; }
  .wing      { transform-box: view-box; animation: wing 1.15s ease-in-out infinite; }
  .pouch     { transform-box: view-box; animation: pouch 2.3s ease-in-out infinite; }

  .cloud1 { transform-box: view-box; animation: cloudDrift 34s linear infinite; }
  .cloud2 { transform-box: view-box; animation: cloudDrift 46s linear infinite; }
  .cloud3 { transform-box: view-box; animation: cloudDrift 27s linear infinite; }

  .road   { transform-box: view-box; animation: roadRun 0.55s linear infinite; }
  .grass  { transform-box: view-box; animation: grassRun 1.6s linear infinite; }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="一只鹈鹕骑着自行车的二维动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9fd0ee"/>
      <stop offset="55%"  stop-color="#c6e7f7"/>
      <stop offset="100%" stop-color="#e8f6fd"/>
    </linearGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#79c98f"/>
      <stop offset="100%" stop-color="#57b478"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a8dcb8"/>
      <stop offset="100%" stop-color="#8ccfa4"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dce5ee"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffc46b"/>
      <stop offset="100%" stop-color="#f0972f"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffb257"/>
      <stop offset="100%" stop-color="#e8842a"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#31c2b2"/>
      <stop offset="100%" stop-color="#1f9c90"/>
    </linearGradient>
  </defs>

  <!-- ============ 天空 ============ -->
  <rect x="0" y="0" width="900" height="520" fill="url(#sky)"/>

  <!-- 太阳 -->
  <g>
    <circle cx="762" cy="86" r="52" fill="#ffe08a" opacity="0.55"/>
    <circle cx="762" cy="86" r="38" fill="#ffd15c"/>
  </g>

  <!-- ============ 云层（循环漂移） ============ -->
  <g class="cloud1" opacity="0.95">
    <g transform="translate(950, 92)">
      <ellipse cx="0"  cy="0"  rx="46" ry="26" fill="#ffffff"/>
      <ellipse cx="38" cy="8"  rx="36" ry="20" fill="#ffffff"/>
      <ellipse cx="-36" cy="10" rx="30" ry="18" fill="#ffffff"/>
    </g>
    <g transform="translate(1180, 168)">
      <ellipse cx="0"  cy="0"  rx="38" ry="21" fill="#ffffff"/>
      <ellipse cx="30" cy="7"  rx="28" ry="16" fill="#ffffff"/>
      <ellipse cx="-28" cy="8" rx="24" ry="14" fill="#ffffff"/>
    </g>
  </g>

  <g class="cloud2" opacity="0.85">
    <g transform="translate(1020, 60)">
      <ellipse cx="0"  cy="0"  rx="54" ry="28" fill="#ffffff"/>
      <ellipse cx="46" cy="10" rx="38" ry="20" fill="#ffffff"/>
      <ellipse cx="-44" cy="12" rx="32" ry="18" fill="#ffffff"/>
    </g>
    <g transform="translate(1320, 140)">
      <ellipse cx="0"  cy="0"  rx="42" ry="22" fill="#ffffff"/>
      <ellipse cx="34" cy="8"  rx="30" ry="17" fill="#ffffff"/>
      <ellipse cx="-32" cy="9" rx="26" ry="15" fill="#ffffff"/>
    </g>
  </g>

  <g class="cloud3" opacity="0.9">
    <g transform="translate(1100, 128)">
      <ellipse cx="0"  cy="0"  rx="40" ry="22" fill="#ffffff"/>
      <ellipse cx="32" cy="8"  rx="28" ry="16" fill="#ffffff"/>
      <ellipse cx="-30" cy="9" rx="24" ry="14" fill="#ffffff"/>
    </g>
  </g>

  <!-- ============ 远山 ============ -->
  <path d="M0 372 Q 110 300 220 358 Q 320 300 430 360 Q 540 306 650 358 Q 760 312 900 366 L 900 420 L 0 420 Z"
        fill="url(#hillFar)" opacity="0.9"/>

  <!-- ============ 草地 ============ -->
  <rect x="0" y="380" width="900" height="140" fill="url(#grassG)"/>

  <!-- 近处草丛（后掠） -->
  <g class="grass" opacity="0.75">
    <g fill="#4aa86c">
      <path d="M40 392 q 8 -18 16 0 z"/>
      <path d="M130 388 q 10 -22 20 0 z"/>
      <path d="M250 392 q 8 -16 16 0 z"/>
      <path d="M360 389 q 11 -20 21 0 z"/>
      <path d="M480 393 q 8 -17 16 0 z"/>
      <path d="M600 388 q 10 -21 20 0 z"/>
      <path d="M720 392 q 8 -16 16 0 z"/>
      <path d="M830 390 q 11 -19 21 0 z"/>
    </g>
  </g>

  <!-- ============ 公路 ============ -->
  <rect x="0" y="404" width="900" height="72" fill="#8d9aa8"/>
  <rect x="0" y="404" width="900" height="6"  fill="#78848f"/>
  <rect x="0" y="470" width="900" height="6"  fill="#78848f"/>

  <!-- 路面中线虚线（后掠） -->
  <g class="road">
    <g fill="#f2f5f8">
      <rect x="-20"  y="437" width="90" height="9" rx="4"/>
      <rect x="160"  y="437" width="90" height="9" rx="4"/>
      <rect x="340"  y="437" width="90" height="9" rx="4"/>
      <rect x="520"  y="437" width="90" height="9" rx="4"/>
      <rect x="700"  y="437" width="90" height="9" rx="4"/>
      <rect x="880"  y="437" width="90" height="9" rx="4"/>
    </g>
  </g>

  <!-- 路边白线 -->
  <rect x="0" y="412" width="900" height="3" fill="#e7edf2" opacity="0.7"/>
  <rect x="0" y="466" width="900" height="3" fill="#e7edf2" opacity="0.7"/>

  <!-- ============ 自行车 ============ -->
  <g id="bicycle">

    <!-- 后轮 -->
    <g class="spin" style="transform-origin: 310px 400px;">
      <circle cx="310" cy="400" r="50" fill="none" stroke="#2c3742" stroke-width="11"/>
      <circle cx="310" cy="400" r="40" fill="none" stroke="#c3cfda" stroke-width="4"/>
      <g stroke="#b0bec9" stroke-width="3" stroke-linecap="round">
        <line x1="310" y1="362" x2="310" y2="438"/>
        <line x1="277" y1="381" x2="343" y2="419"/>
        <line x1="277" y1="419" x2="343" y2="381"/>
      </g>
      <circle cx="310" cy="400" r="8" fill="#2c3742"/>
    </g>

    <!-- 前轮 -->
    <g class="spin" style="transform-origin: 560px 400px;">
      <circle cx="560" cy="400" r="50" fill="none" stroke="#2c3742" stroke-width="11"/>
      <circle cx="560" cy="400" r="40" fill="none" stroke="#c3cfda" stroke-width="4"/>
      <g stroke="#b0bec9" stroke-width="3" stroke-linecap="round">
        <line x1="560" y1="362" x2="560" y2="438"/>
        <line x1="527" y1="381" x2="593" y2="419"/>
        <line x1="527" y1="419" x2="593" y2="381"/>
      </g>
      <circle cx="560" cy="400" r="8" fill="#2c3742"/>
    </g>

    <!-- 车架 -->
    <g stroke="url(#frameG)" stroke-width="11" stroke-linecap="round" fill="none">
      <line x1="435" y1="400" x2="385" y2="292"/>   <!-- 座管 -->
      <line x1="435" y1="400" x2="548" y2="300"/>   <!-- 下管 -->
      <line x1="385" y1="292" x2="548" y2="300"/>   <!-- 上管 -->
      <line x1="435" y1="400" x2="310" y2="400"/>   <!-- 后下叉 -->
      <line x1="385" y1="292" x2="310" y2="400"/>   <!-- 后上叉 -->
      <line x1="552" y1="300" x2="560" y2="400"/>   <!-- 前叉 -->
    </g>

    <!-- 链条 -->
    <g stroke="#3d4a56" stroke-width="3.5" stroke-linecap="round" opacity="0.9">
      <line x1="435" y1="391" x2="310" y2="391"/>
      <line x1="435" y1="409" x2="310" y2="409"/>
    </g>
    <!-- 链盘 -->
    <circle cx="435" cy="400" r="19" fill="none" stroke="#3d4a56" stroke-width="5"/>
    <circle cx="310" cy="400" r="10" fill="none" stroke="#3d4a56" stroke-width="4"/>

    <!-- 车座 -->
    <ellipse cx="383" cy="286" rx="30" ry="10" fill="#3a4652"/>
    <ellipse cx="383" cy="283" rx="26" ry="7" fill="#4c5a68"/>

    <!-- 车把 -->
    <g stroke="#3a4652" stroke-width="8" stroke-linecap="round" fill="none">
      <line x1="552" y1="298" x2="572" y2="272"/>
      <line x1="572" y1="272" x2="606" y2="272"/>
    </g>
    <rect x="596" y="265" width="22" height="14" rx="6" fill="#2c3742"/>

    <!-- 脚踏 + 曲柄 -->
    <g class="spin" style="transform-origin: 435px 400px;">
      <line x1="435" y1="400" x2="435" y2="438" stroke="#2c3742" stroke-width="8" stroke-linecap="round"/>
      <line x1="435" y1="400" x2="435" y2="362" stroke="#2c3742" stroke-width="8" stroke-linecap="round"/>
      <!-- 脚踏保持水平：反向旋转抵消曲柄旋转 -->
      <g class="spinBack" style="transform-origin: 435px 438px;">
        <rect x="420" y="432" width="30" height="11" rx="3" fill="#2c3742"/>
      </g>
      <g class="spinBack" style="transform-origin: 435px 362px;">
        <rect x="420" y="356" width="30" height="11" rx="3" fill="#2c3742"/>
      </g>
    </g>
  </g>

  <!-- ============ 鹈鹕 ============ -->
  <g class="bob" style="transform-origin: 400px 300px;">

    <!-- 后侧腿（相位靠后） -->
    <g class="legB" style="transform-origin: 398px 316px;">
      <path d="M398 316 Q 416 360 420 396" fill="none" stroke="#e07f22" stroke-width="12" stroke-linecap="round"/>
      <ellipse cx="424" cy="402" rx="17" ry="8" fill="#e07f22" transform="rotate(12 424 402)"/>
    </g>

    <!-- 身体 -->
    <g>
      <!-- 尾羽 -->
      <path d="M352 252 L 300 232 L 318 262 L 298 272 L 348 282 Z" fill="#c9d5e0"/>
      <!-- 躯干 -->
      <ellipse cx="398" cy="262" rx="56" ry="44" fill="url(#bodyG)" transform="rotate(-12 398 262)"/>
      <!-- 腹部阴影 -->
      <ellipse cx="404" cy="282" rx="40" ry="24" fill="#c6d2de" opacity="0.55" transform="rotate(-12 404 282)"/>
    </g>

    <!-- 脖子 -->
    <path d="M428 236
             C 448 214, 456 190, 466 172
             L 492 182
             C 482 206, 470 232, 452 252 Z"
          fill="url(#bodyG)"/>

    <!-- 头部 -->
    <circle cx="488" cy="158" r="33" fill="url(#bodyG)"/>

    <!-- 眼睛 -->
    <circle cx="502" cy="148" r="8.5" fill="#2c3742"/>
    <circle cx="505" cy="145" r="3" fill="#ffffff"/>
    <!-- 眉毛（呆萌感） -->
    <path d="M492 133 Q 502 128 512 132" fill="none" stroke="#b7c3cf" stroke-width="3.5" stroke-linecap="round"/>

    <!-- 喙：上喙 -->
    <path d="M510 148
             L 652 170
             L 510 182 Z"
          fill="url(#beakG)"/>
    <!-- 喙尖高光 -->
    <path d="M636 166 L 652 170 L 636 174 Z" fill="#ffd9a0"/>

    <!-- 喉囊（下垂的标志性大皮囊） -->
    <g class="pouch" style="transform-origin: 512px 180px;">
      <path d="M510 176
               C 516 236, 572 258, 628 214
               C 610 192, 560 184, 510 188 Z"
            fill="url(#pouchG)"/>
      <path d="M522 196 C 544 228, 580 238, 614 212"
            fill="none" stroke="#d97a22" stroke-width="3" stroke-linecap="round" opacity="0.65"/>
      <path d="M534 192 C 552 214, 578 222, 602 208"
            fill="none" stroke="#d97a22" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
    </g>

    <!-- 前侧腿 -->
    <g class="legA" style="transform-origin: 404px 318px;">
      <path d="M404 318 Q 428 358 432 398" fill="none" stroke="#f0972f" stroke-width="13" stroke-linecap="round"/>
      <ellipse cx="436" cy="404" rx="18" ry="8.5" fill="#f0972f" transform="rotate(10 436 404)"/>
    </g>

    <!-- 翅膀（搭在车把上） -->
    <g class="wing" style="transform-origin: 408px 252px;">
      <path d="M388 244
               C 432 228, 506 236, 560 250
               C 586 256, 606 258, 614 261
               C 610 270, 584 276, 542 281
               C 492 289, 420 292, 394 283
               C 376 274, 372 255, 388 244 Z"
            fill="#eef3f8"/>
      <!-- 翅膀羽毛纹路 -->
      <g fill="none" stroke="#c2cedb" stroke-width="3" stroke-linecap="round">
        <path d="M418 250 C 458 252, 512 264, 556 272"/>
        <path d="M412 266 C 452 270, 500 280, 536 286"/>
      </g>
      <!-- 翼尖（颜色略深，压在握把上沿） -->
      <path d="M572 253 C 594 252, 612 256, 618 262 C 612 270, 590 274, 568 271 Z"
            fill="#dde6ee"/>
    </g>
  </g>

  <!-- ============ 速度线（点缀） ============ -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <line x1="150" y1="250" x2="215" y2="250"/>
    <line x1="120" y1="300" x2="196" y2="300"/>
    <line x1="168" y1="345" x2="228" y2="345"/>
  </g>

</svg>
</div>
</body>
</html>
