<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>
<style>
  :root{
    --sky1:#cdeafd; --sky2:#eaf7ff; --sun:#ffd15c; --sea:#57b7e8;
    --ground:#8fd06b; --road:#7b8494; --road2:#6c7484;
    --bird:#fdfaf3; --birdShade:#e6dfd0; --beak:#f2a63c; --beak2:#e08a1e;
    --eye:#2b2b33; --helmet:#e0483f; --helmet2:#b8342c; --frame:#2e7d9a; --frame2:#1f5e76;
    --tire:#2f3237; --rim:#cfd6dd; --shirt:#4aa3c7; --shirt2:#2f7ea1;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,#fff 100%);
    display:flex;align-items:center;justify-content:center;
    font-family:"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden;
  }
  .stage{position:relative;width:min(96vw,960px);}
  .stage svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 22px rgba(30,60,90,.18));}
  .hint{
    position:absolute;left:50%;transform:translateX(-50%);bottom:-38px;
    font-size:14px;color:#4a6b80;letter-spacing:.5px;white-space:nowrap;
  }
  .cloud{animation:drift 40s linear infinite;}
  .cloud.c2{animation-delay:-13.3s}
  .cloud.c3{animation-delay:-26.6s}
  @keyframes drift{from{transform:translateX(1400px)}to{transform:translateX(-400px)}}
  .cloud{transform-box:fill-box}
  .sun-rays{transform-box:fill-box;transform-origin:center;animation:spin 26s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wheel{transform-box:fill-box;transform-origin:center;animation:spin .545s linear infinite}
  .crank{transform-box:fill-box;transform-origin:center;animation:spin 1s linear infinite}
  .speed{stroke-dasharray:34 26;animation:dash 1.1s linear infinite}
  @keyframes dash{to{stroke-dashoffset:60}}
  .scrollBg{animation:scrollBg 14s linear infinite}
  @keyframes scrollBg{to{transform:translateX(-960px)}}
  .scrollRoad{animation:scrollRoad 1.6s linear infinite}
  @keyframes scrollRoad{to{transform:translateX(-960px)}}
  .scrollGrass{animation:scrollGrass 3.2s linear infinite}
  @keyframes scrollGrass{to{transform:translateX(-960px)}}
  .head{transform-box:fill-box;transform-origin:14% 84%;animation:headBob .65s ease-in-out infinite alternate}
  @keyframes headBob{from{transform:rotate(3deg)}to{transform:rotate(-4deg)}}
  .beak{transform-box:fill-box;transform-origin:3% 42%;animation:beakOpen 2.4s ease-in-out infinite}
  @keyframes beakOpen{0%,70%,100%{transform:rotate(0)}79%{transform:rotate(11deg)}}
  .pouch{transform-box:fill-box;transform-origin:6% 8%;animation:pouch 2.4s ease-in-out infinite}
  @keyframes pouch{0%,70%,100%{transform:scaleY(1)}79%{transform:scaleY(1.42)}}
  .wingFar{transform-box:fill-box;transform-origin:78% 14%;animation:wingFar .9s ease-in-out infinite alternate}
  @keyframes wingFar{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
  .wingNear{transform-box:fill-box;transform-origin:3% 18%;animation:wingNear .65s ease-in-out infinite alternate}
  @keyframes wingNear{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
  .scarf-tail{transform-box:fill-box;transform-origin:97% 45%;animation:scarf .65s ease-in-out infinite alternate}
  @keyframes scarf{from{transform:rotate(-9deg) skewX(0deg)}to{transform:rotate(9deg) skewX(10deg)}}
  .speech{
    position:absolute;right:2%;top:6%;background:#fff;border:2px solid #3d6b85;
    color:#2f4f63;font-size:15px;padding:9px 14px;border-radius:14px;max-width:44%;
    box-shadow:0 6px 16px rgba(40,80,110,.18);opacity:0;animation:say 9s ease infinite;
  }
  .speech:after{content:"";position:absolute;left:18px;bottom:-11px;width:16px;height:16px;background:#fff;border-right:2px solid #3d6b85;border-bottom:2px solid #3d6b85;transform:rotate(45deg)}
  @keyframes say{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}14%{opacity:1}18%,100%{opacity:0;transform:translateY(8px)}}

</style>
</head>
