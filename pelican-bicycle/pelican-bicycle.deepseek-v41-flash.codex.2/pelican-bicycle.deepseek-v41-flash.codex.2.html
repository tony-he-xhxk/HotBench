<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑自行车的鹈鹕 · SVG 2D 动画</title>
<style>
  :root{
    --frame-w:min(1180px,94vw);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b2b3d 0%, #0e1621 60%, #080d14 100%);
    color:#cbd6e4;
    font-family:"Segoe UI","Helvetica Neue",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:22px;
  }
  .stage{
    width:var(--frame-w);
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .scene-wrap{
    position:relative;
    border-radius:18px;
    overflow:hidden;
    box-shadow:
      0 40px 80px -30px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,255,255,.07) inset;
    background:#bfe6ff;
  }
  svg#scene{
    display:block;
    width:100%;
    height:auto;
  }
  .vignette{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:radial-gradient(120% 90% at 50% 40%, rgba(0,0,0,0) 55%, rgba(4,12,22,.34) 100%);
    mix-blend-mode:multiply;
  }
  .caption{
    display:flex;
    align-items:baseline;
    gap:12px;
    flex-wrap:wrap;
    padding:0 4px;
    font-size:13.5px;
    letter-spacing:.02em;
  }
  .caption b{font-weight:600;color:#eaf2fb;font-size:15px}
  .caption span{opacity:.62}
  .streak{
    animation:zip .85s linear infinite;
    transform-origin:center;
  }
  .streak:nth-child(2){animation-duration:1.05s;animation-delay:-.35s}
  .streak:nth-child(3){animation-duration:.7s;animation-delay:-.5s}
  @keyframes zip{
    0%   {opacity:0;   transform:translateX(26px) scaleX(.45)}
    35%  {opacity:.75; transform:translateX(0) scaleX(1)}
    100% {opacity:0;   transform:translateX(-58px) scaleX(1.5)}
  }
  @media (prefers-reduced-motion:reduce){
    .streak{animation:none;opacity:.35}
  }
</style>
</head>

<script>
(function(){
  "use strict";

  var TAU = Math.PI * 2;
  var SVGNS = "http://www.w3.org/2000/svg";
  var byId = function(id){ return document.getElementById(id); };

  /* 关键几何：中轴、髋关节、腿长 */
  var BB = { x: 368, y: 448 };
  var CRANK_R = 32;
  var HIP = { x: 330, y: 292 };
  var FEMUR = 96;
  var TIBIA = 108;
  var WHEEL_R = 66;

  /* 节奏与速度 */
  var CRANK_PERIOD = 1.15;
  var GEAR = 2.15;
  var PARALLAX = 0.045;
  var SCROLL_PERIOD = 150;
  var groundSpeed = WHEEL_R * (TAU / CRANK_PERIOD) * GEAR;

  var reduceQuery = window.matchMedia
    ? window.matchMedia("(prefers-reduced-motion: reduce)")
    : { matches: false };

  /* 车轮辐条（14 根 + 一个气门嘴标记） */
  function buildSpokes(groupId, hub, count, inner, outer){
    var g = byId(groupId);
    for (var i = 0; i < count; i++){
      var a = (i / count) * TAU;
      var l = document.createElementNS(SVGNS, "line");
      l.setAttribute("x1", (hub.x + Math.cos(a) * inner).toFixed(2));
      l.setAttribute("y1", (hub.y + Math.sin(a) * inner).toFixed(2));
      l.setAttribute("x2", (hub.x + Math.cos(a) * outer).toFixed(2));
      l.setAttribute("y2", (hub.y + Math.sin(a) * outer).toFixed(2));
      g.appendChild(l);
    }
    var v = document.createElementNS(SVGNS, "rect");
    v.setAttribute("x", hub.x - 3.2);
    v.setAttribute("y", hub.y - outer - 1);
    v.setAttribute("width", 6.4);
    v.setAttribute("height", 14);
    v.setAttribute("rx", 3);
    v.setAttribute("fill", "#ffd166");
    g.appendChild(v);
  }
  buildSpokes("spokesRear", { x: 252, y: 442 }, 14, 12, 55);
  buildSpokes("spokesFront", { x: 628, y: 442 }, 14, 12, 55);

  /* 云朵：视差 + 循环回卷 */
  var CLOUD_SPAN = 1500;
  var CLOUD_X0 = -280;
  var clouds = [
    { x: 140, y: 78,  s: 1.00, f: 1.00, o: 0.95 },
    { x: 560, y: 132, s: 0.72, f: 1.35, o: 0.80 },
    { x: 880, y: 62,  s: 0.86, f: 0.78, o: 0.88 },
    { x: 340, y: 176, s: 0.55, f: 1.55, o: 0.62 }
  ];
  var puffShapes = [
    [-58, 8, 34, 24], [-16, -12, 46, 34], [34, 2, 38, 27], [-2, 12, 40, 24]
  ];
  var cloudLayer = byId("cloudLayer");
  var cloudNodes = clouds.map(function(c){
    var g = document.createElementNS(SVGNS, "g");
    puffShapes.forEach(function(p){
      var e = document.createElementNS(SVGNS, "ellipse");
      e.setAttribute("cx", p[0]);
      e.setAttribute("cy", p[1]);
      e.setAttribute("rx", p[2]);
      e.setAttribute("ry", p[3]);
      g.appendChild(e);
    });
    g.setAttribute("opacity", c.o);
    cloudLayer.appendChild(g);
    return g;
  });

  /* 反向运动学：已知髋与脚的位置求膝盖（取膝盖朝前的那组解） */
  function solveKnee(hip, foot, l1, l2){
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 0.000001;
    var dMax = (l1 + l2) * 0.999;
    var dMin = Math.abs(l1 - l2) * 1.02 + 0.000001;
    var d = Math.min(dMax, Math.max(dMin, len));
    var ux = dx / len;
    var uy = dy / len;
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var mx = hip.x + ux * a;
    var my = hip.y + uy * a;
    var k1 = { x: mx - uy * h, y: my + ux * h };
    var k2 = { x: mx + uy * h, y: my - ux * h };
    return (k2.x >= k1.x) ? k2 : k1;
  }

  function fmt(p){
    return p.x.toFixed(2) + " " + p.y.toFixed(2);
  }

  var el = {
    spokesRear: byId("spokesRear"),
    spokesFront: byId("spokesFront"),
    crankNear: byId("crankNear"),
    crankFar: byId("crankFar"),
    ring: byId("chainringSpin"),
    pedalNear: byId("pedalNear"),
    pedalFar: byId("pedalFar"),
    footNear: byId("footNear"),
    footFar: byId("footFar"),
    legNearOutline: byId("legNearOutline"),
    thighNear: byId("thighNear"),
    shinNear: byId("shinNear"),
    legFarOutline: byId("legFarOutline"),
    thighFar: byId("thighFar"),
    shinFar: byId("shinFar"),
    chainTop: byId("chainTop"),
    chainBot: byId("chainBot"),
    ground: byId("groundScroll"),
    rider: byId("rider"),
    head: byId("headGroup"),
    wingFar: byId("wingFar")
  };

  var legs = [
    { phase: 0, thigh: el.thighNear, shin: el.shinNear, outline: el.legNearOutline,
      foot: el.footNear, pedal: el.pedalNear },
    { phase: Math.PI, thigh: el.thighFar, shin: el.shinFar, outline: el.legFarOutline,
      foot: el.footFar, pedal: el.pedalFar }
  ];

  function render(t){
    var crank = TAU * (t / CRANK_PERIOD);

    var wheelDeg = crank * GEAR * 180 / Math.PI;
    el.spokesRear.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 252 442)");
    el.spokesFront.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 628 442)");

    var crankDeg = crank * 180 / Math.PI;
    el.crankNear.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + " 368 448)");
    el.crankFar.setAttribute("transform", "rotate(" + (crankDeg + 180).toFixed(2) + " 368 448)");
    el.ring.setAttribute("transform", "rotate(" + crankDeg.toFixed(2) + " 368 448)");

    var travel = crank * 20;
    el.chainTop.setAttribute("stroke-dasharray", "6 5");
    el.chainBot.setAttribute("stroke-dasharray", "6 5");
    el.chainTop.setAttribute("stroke-dashoffset", (-travel).toFixed(2));
    el.chainBot.setAttribute("stroke-dashoffset", travel.toFixed(2));

    var offset = (groundSpeed * t) % SCROLL_PERIOD;
    el.ground.setAttribute("transform", "translate(" + (-offset).toFixed(2) + " 0)");

    for (var i = 0; i < clouds.length; i++){
      var c = clouds[i];
      var wrapped = (c.x - groundSpeed * PARALLAX * c.f * t - CLOUD_X0) % CLOUD_SPAN;
      wrapped = ((wrapped % CLOUD_SPAN) + CLOUD_SPAN) % CLOUD_SPAN;
      var cx = wrapped + CLOUD_X0;
      cloudNodes[i].setAttribute("transform",
        "translate(" + cx.toFixed(2) + " " + c.y + ") scale(" + c.s + ")");
    }

    var bob = 3.4 * Math.sin(2 * crank);
    el.rider.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    el.head.setAttribute("transform",
      "rotate(" + (2.2 * Math.sin(2 * crank - 0.7)).toFixed(3) + " 392 206)");
    el.wingFar.setAttribute("transform",
      "rotate(" + (7 * Math.sin(crank + 1.1)).toFixed(3) + " 300 206)");

    var hip = { x: HIP.x, y: HIP.y + bob };
    for (var j = 0; j < legs.length; j++){
      var leg = legs[j];
      var ang = crank + leg.phase;
      var pedal = { x: BB.x + Math.cos(ang) * CRANK_R, y: BB.y + Math.sin(ang) * CRANK_R };
      var foot = { x: pedal.x, y: pedal.y - 7 };
      var knee = solveKnee(hip, foot, FEMUR, TIBIA);
      var dThigh = "M " + fmt(hip) + " L " + fmt(knee);
      leg.outline.setAttribute("d", dThigh + " L " + fmt(foot));
      leg.thigh.setAttribute("d", dThigh);
      leg.shin.setAttribute("d", "M " + fmt(knee) + " L " + fmt(foot));
      leg.pedal.setAttribute("transform",
        "translate(" + pedal.x.toFixed(2) + " " + pedal.y.toFixed(2) + ")");
      leg.foot.setAttribute("transform",
        "translate(" + pedal.x.toFixed(2) + " " + (pedal.y - 4).toFixed(2) + ")");
    }
  }

  var params = new URLSearchParams(location.search);
  var frozen = params.has("t") ? parseFloat(params.get("t")) : null;

  if (frozen !== null && isFinite(frozen)){
    render(frozen);
  } else if (reduceQuery.matches){
    render(0.42);
  } else {
    var t0 = performance.now();
    var loop = function(now){
      render((now - t0) / 1000);
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
})();
</script>
</body>
</html>
