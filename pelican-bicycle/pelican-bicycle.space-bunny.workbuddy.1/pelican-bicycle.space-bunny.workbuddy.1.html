<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{
    --ink:#22303c; --muted:#7c8b99; --line:#e6ecf1; --card:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#f4f7fa; color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 44px;
  }
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.4px}
  .sub{font-size:13px;color:var(--muted);margin:0 0 18px}
  .stage{
    width:min(940px,100%); background:var(--card); border:1px solid var(--line);
    border-radius:16px; overflow:hidden; box-shadow:0 10px 34px rgba(34,48,60,.08);
  }
  svg{display:block;width:100%;height:auto}
  .legend{
    width:min(940px,100%); margin-top:14px; display:flex; flex-wrap:wrap; gap:8px 18px;
    font-size:12.5px; color:var(--muted); justify-content:center;
  }
  .legend b{font-weight:600;color:#4b5c6b}

  /* ---------- SVG animations (transform-box: view-box for all) ---------- */
  svg *{transform-box:view-box}
  .spin-rear {animation:spin 1.2s linear infinite; transform-origin:255px 350px}
  .spin-front{animation:spin 1.2s linear infinite; transform-origin:545px 350px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .bob{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}75%{transform:translateY(3px)}}

  .wing{animation:wing 1.2s ease-in-out infinite; transform-origin:352px 200px}
  @keyframes wing{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-9deg)}}

  .neck{animation:neck 1.2s ease-in-out infinite}
  @keyframes neck{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .blink{animation:blink 5.2s infinite; transform-box:fill-box; transform-origin:center}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

  .cloud-a{animation:drift 46s linear infinite}
  .cloud-b{animation:drift 68s linear infinite}
  @keyframes drift{from{transform:translateX(-320px)}to{transform:translateX(1240px)}}

  .far    {animation:scroll 44s linear infinite}
  .mid    {animation:scroll 22s linear infinite}
  .road   {animation:scroll 1.15s linear infinite}
  .grass  {animation:scroll 1.15s linear infinite}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-900px)}}

  .speed{animation:speed 1.15s linear infinite}
  @keyframes speed{from{transform:translateX(0) scaleX(.4);opacity:0}
                   30%{opacity:.75}to{transform:translateX(-300px) scaleX(1);opacity:0}}

  @media (prefers-reduced-motion: reduce){
    svg *{animation:none !important}
  }
</style>
</head>
<body>

<h1>鹈鹕骑自行车</h1>
<p class="sub">纯 SVG 动画 · 双段 IK 腿部实时解算，踏板与脚永不脱节</p>

<div class="stage">
<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="一只鹈鹕在晴朗的乡间道路上骑自行车的动画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#cfeafb"/>
      <stop offset="0.6" stop-color="#e8f6ff"/>
      <stop offset="1"   stop-color="#fdfdff"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe4e9"/>
      <stop offset="1" stop-color="#c3cad2"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dde7f0"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffa94d"/>
      <stop offset="1" stop-color="#ff8a2b"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="1" stop-color="#ffb570"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fc9ba"/>
      <stop offset="1" stop-color="#1d9a8e"/>
    </linearGradient>
  </defs>

  <!-- ===== sky ===== -->
  <rect x="0" y="0" width="900" height="405" fill="url(#sky)"/>
  <circle cx="770" cy="86" r="76" fill="url(#sunGlow)"/>
  <circle cx="770" cy="86" r="31" fill="#ffd166"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity=".92">
    <g class="cloud-a">
      <g transform="translate(120,96) scale(1.15)">
        <ellipse cx="0" cy="0" rx="34" ry="20"/><ellipse cx="30" cy="6" rx="26" ry="16"/>
        <ellipse cx="-28" cy="7" rx="22" ry="14"/>
      </g>
    </g>
    <g class="cloud-b">
      <g transform="translate(560,52) scale(.8)" opacity=".8">
        <ellipse cx="0" cy="0" rx="30" ry="17"/><ellipse cx="26" cy="5" rx="22" ry="13"/>
      </g>
    </g>
  </g>

  <!-- ===== distant hills (parallax, seamless at 900px) ===== -->
  <g class="far">
    <g id="hillfar">
      <path d="M-60 362 q120-78 250-40 q90 26 150-6 q120-64 250-14 q140 52 360 44 v60 h-1010 z" fill="#c3e3ca"/>
      <path d="M840 362 q120-78 250-40 q90 26 150-6 q120-64 250-14 q140 52 360 44 v60 h-1010 z" fill="#c3e3ca"/>
    </g>
  </g>
  <g class="mid">
    <g id="hillmid">
      <path d="M-60 372 q160-56 320-18 q140 34 240-4 q150-56 300-6 q120 40 400 22 v48 h-1260 z" fill="#95cfa6"/>
    </g>
    <g id="trees">
      <g fill="#4f9e73">
        <path d="M120 372 l26-46 26 46 z"/><rect x="142" y="366" width="8" height="18" fill="#6b5a43"/>
        <path d="M300 372 l30-56 30 56 z"/><rect x="326" y="364" width="9" height="20" fill="#6b5a43"/>
        <path d="M470 372 l22-40 22 40 z"/><rect x="489" y="366" width="7" height="16" fill="#6b5a43"/>
        <path d="M700 372 l28-50 28 50 z"/><rect x="724" y="365" width="8" height="18" fill="#6b5a43"/>
        <path d="M840 372 l26-46 26 46 z"/><rect x="862" y="366" width="8" height="18" fill="#6b5a43"/>
      </g>
    </g>
  </g>

  <!-- ===== grass strip ===== -->
  <rect x="0" y="368" width="900" height="46" fill="#7cc96b"/>
  <rect x="0" y="368" width="900" height="8" fill="#8fd97c"/>

  <!-- ===== road ===== -->
  <rect x="0" y="405" width="900" height="115" fill="url(#road)"/>
  <g class="road" fill="#ffffff" opacity=".85">
    <rect x="0" y="448" width="86" height="11" rx="5"/>
    <rect x="150" y="448" width="86" height="11" rx="5"/>
    <rect x="300" y="448" width="86" height="11" rx="5"/>
    <rect x="450" y="448" width="86" height="11" rx="5"/>
    <rect x="600" y="448" width="86" height="11" rx="5"/>
    <rect x="750" y="448" width="86" height="11" rx="5"/>
    <rect x="900" y="448" width="86" height="11" rx="5"/>
  </g>

  <!-- speed lines -->
  <g class="speed" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <line x1="120" y1="300" x2="230" y2="300"/>
    <line x1="80"  y1="336" x2="200" y2="336"/>
    <line x1="150" y1="372" x2="250" y2="372"/>
  </g>

  <!-- ================= PELICAN RIG ================= -->

  <!-- far leg (behind frame) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" begin="-0.6s"
        dur="1.2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="-65.02,332,262;-48.69,332,262;-33.79,332,262;-29.32,332,262;-32.96,332,262;-39.25,332,262;-47.95,332,262;-59.81,332,262;-74.15,332,262;-85.29,332,262;-86.7,332,262;-78.74,332,262;-65.02,332,262"/>
      <line x1="332" y1="262" x2="332" y2="324" stroke="#e3a25c" stroke-width="13"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" begin="-0.6s"
          dur="1.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="60.57,332,324;38.78,332,324;22.15,332,324;26.89,332,324;46.7,332,324;68.7,332,324;89.4,332,324;106.13,332,324;115.11,332,324;112.96,332,324;100.6,332,324;82.03,332,324;60.57,332,324"/>
        <line x1="332" y1="324" x2="332" y2="386" stroke="#e3a25c" stroke-width="11"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" begin="-0.6s"
            dur="1.2s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="4.44,332,386;9.91,332,386;11.65,332,386;2.44,332,386;-13.74,332,386;-29.45,332,386;-41.45,332,386;-46.32,332,386;-40.96,332,386;-27.67,332,386;-13.9,332,386;-3.29,332,386;4.44,332,386"/>
          <path d="M-13 0 h24 a7 7 0 0 1 0 9 h-24 a7 7 0 0 1 0-9 z" fill="#c9884a"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== bicycle ===== -->
  <g id="bike">
    <!-- rear wheel -->
    <g class="spin-rear">
      <circle cx="255" cy="350" r="55" fill="none" stroke="#37474f" stroke-width="9"/>
      <circle cx="255" cy="350" r="46" fill="none" stroke="#e9eef2" stroke-width="3"/>
      <g stroke="#b7c4cd" stroke-width="2">
        <line x1="255" y1="304" x2="255" y2="396"/><line x1="209" y1="350" x2="301" y2="350"/>
        <line x1="222" y1="317" x2="288" y2="383"/><line x1="288" y1="317" x2="222" y2="383"/>
        <line x1="230" y1="331" x2="280" y2="369"/><line x1="280" y1="331" x2="230" y2="369"/>
      </g>
      <circle cx="255" cy="350" r="6" fill="#607d8b"/>
      <rect x="253" y="293" width="6" height="14" rx="3" fill="#ff8a2b"/>
    </g>
    <!-- front wheel -->
    <g class="spin-front">
      <circle cx="545" cy="350" r="55" fill="none" stroke="#37474f" stroke-width="9"/>
      <circle cx="545" cy="350" r="46" fill="none" stroke="#e9eef2" stroke-width="3"/>
      <g stroke="#b7c4cd" stroke-width="2">
        <line x1="545" y1="304" x2="545" y2="396"/><line x1="499" y1="350" x2="591" y2="350"/>
        <line x1="512" y1="317" x2="578" y2="383"/><line x1="578" y1="317" x2="512" y2="383"/>
        <line x1="520" y1="331" x2="570" y2="369"/><line x1="570" y1="331" x2="520" y2="369"/>
      </g>
      <circle cx="545" cy="350" r="6" fill="#607d8b"/>
      <rect x="543" y="293" width="6" height="14" rx="3" fill="#ff8a2b"/>
    </g>

    <!-- frame -->
    <g stroke="url(#frameG)" stroke-width="11" fill="none" stroke-linecap="round">
      <path d="M255 350 L365 350 L328 268 L255 350"/>
      <path d="M365 350 L524 292 L518 262 L328 268"/>
    </g>
    <path d="M518 262 L556 250" stroke="#1d9a8e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M556 250 q16 -12 4 -22" stroke="#37474f" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M524 292 L545 350" stroke="#1d9a8e" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- seat -->
    <path d="M306 266 q22 -13 44 0 q-4 9 -22 9 q-18 0 -22 -9 z" fill="#37474f"/>
    <!-- chainring -->
    <circle cx="365" cy="350" r="17" fill="none" stroke="#90a4ae" stroke-width="4"/>
    <!-- chain -->
    <path d="M365 333 L255 344 M365 367 L255 356" stroke="#78909c" stroke-width="3.5"
          fill="none" stroke-linecap="round"/>

    <!-- crankset -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        dur="1.2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="0,365,350;30,365,350;60,365,350;90,365,350;120,365,350;150,365,350;180,365,350;210,365,350;240,365,350;270,365,350;300,365,350;330,365,350;360,365,350"/>
      <line x1="365" y1="350" x2="393" y2="350" stroke="#455a64" stroke-width="9" stroke-linecap="round"/>
      <line x1="365" y1="350" x2="337" y2="350" stroke="#455a64" stroke-width="9" stroke-linecap="round"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          dur="1.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="0,393,350;-30,393,350;-60,393,350;-90,393,350;-120,393,350;-150,393,350;-180,393,350;-210,393,350;-240,393,350;-270,393,350;-300,393,350;-330,393,350;-360,393,350"/>
        <rect x="380" y="342" width="26" height="16" rx="4" fill="#ff8a2b"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          dur="1.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="360,337,350;330,337,350;300,337,350;270,337,350;240,337,350;210,337,350;180,337,350;150,337,350;120,337,350;90,337,350;60,337,350;30,337,350;0,337,350"/>
        <rect x="324" y="342" width="26" height="16" rx="4" fill="#ff8a2b"/>
      </g>
    </g>
  </g>

  <!-- near leg (in front of frame) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <g>
      <animateTransform attributeName="transform" type="rotate"
        dur="1.2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="-65.02,332,262;-48.69,332,262;-33.79,332,262;-29.32,332,262;-32.96,332,262;-39.25,332,262;-47.95,332,262;-59.81,332,262;-74.15,332,262;-85.29,332,262;-86.7,332,262;-78.74,332,262;-65.02,332,262"/>
      <line x1="332" y1="262" x2="332" y2="324" stroke="#f5b56a" stroke-width="15"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          dur="1.2s" repeatCount="indefinite" calcMode="linear"
          keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="60.57,332,324;38.78,332,324;22.15,332,324;26.89,332,324;46.7,332,324;68.7,332,324;89.4,332,324;106.13,332,324;115.11,332,324;112.96,332,324;100.6,332,324;82.03,332,324;60.57,332,324"/>
        <line x1="332" y1="324" x2="332" y2="386" stroke="#f5b56a" stroke-width="12"/>
        <g>
          <animateTransform attributeName="transform" type="rotate"
            dur="1.2s" repeatCount="indefinite" calcMode="linear"
            keyTimes="0;0.0833333;0.166667;0.25;0.333333;0.416667;0.5;0.583333;0.666667;0.75;0.833333;0.916667;1" values="4.44,332,386;9.91,332,386;11.65,332,386;2.44,332,386;-13.74,332,386;-29.45,332,386;-41.45,332,386;-46.32,332,386;-40.96,332,386;-27.67,332,386;-13.9,332,386;-3.29,332,386;4.44,332,386"/>
          <path d="M-14 0 h26 a8 8 0 0 1 0 10 h-26 a8 8 0 0 1 0-10 z" fill="#ff8a2b"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== pelican body ===== -->
  <g class="bob">
    <!-- tail -->
    <path d="M292 206 q-40 -10 -58 14 q28 4 46 18 z" fill="#f2f7fb"/>
    <!-- body -->
    <ellipse cx="338" cy="218" rx="60" ry="46" fill="url(#bodyG)" stroke="#cfdce7" stroke-width="2"/>
    <!-- chest shading -->
    <path d="M370 178 q34 40 12 82 q-24 -14 -26 -44 z" fill="#eaf2f8" opacity=".85"/>
    <!-- wing -->
    <g class="wing">
      <path d="M352 200 q46 6 44 44 q-20 20 -46 6 q-14 -26 2 -50 z"
            fill="#ffffff" stroke="#cfdce7" stroke-width="2"/>
      <path d="M352 214 q26 6 30 26 M350 228 q24 6 28 24"
            fill="none" stroke="#dde7f0" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- neck -->
    <g class="neck">
      <path d="M372 200 q22 -46 48 -56 q22 -8 30 8 q-14 12 -26 14 q-22 12 -28 44 z"
            fill="url(#bodyG)" stroke="#cfdce7" stroke-width="2"/>
    </g>
    <!-- head -->
    <circle cx="424" cy="150" r="25" fill="url(#bodyG)" stroke="#cfdce7" stroke-width="2"/>
    <!-- beak -->
    <path d="M440 136 L560 164 q6 2 0 10 L440 154 z" fill="url(#beakG)"/>
    <path d="M440 154 L554 172 q-30 40 -92 30 q-26 -6 -22 -28 z" fill="url(#pouchG)"/>
    <path d="M446 158 q50 12 104 14" fill="none" stroke="#e58f4a" stroke-width="2.5" opacity=".6"/>
    <!-- eye -->
    <g class="blink">
      <circle cx="432" cy="143" r="5" fill="#22303c"/>
      <circle cx="433.6" cy="141.2" r="1.8" fill="#ffffff"/>
    </g>
  </g>

  <!-- ===== foreground grass ===== -->
  <g class="grass" fill="#5fb055">
    <path d="M0 520 q14 -46 26 -20 q8 18 10 20 z"/>
    <path d="M120 520 q16 -52 30 -22 q9 20 11 22 z"/>
    <path d="M250 520 q13 -42 25 -18 q8 16 10 18 z"/>
    <path d="M380 520 q17 -56 31 -24 q9 22 11 24 z"/>
    <path d="M520 520 q14 -46 27 -20 q8 18 10 20 z"/>
    <path d="M650 520 q16 -50 30 -21 q9 19 11 21 z"/>
    <path d="M790 520 q13 -44 25 -19 q8 17 10 19 z"/>
    <path d="M900 520 q14 -46 26 -20 q8 18 10 20 z"/>
  </g>
</svg>
</div>

<div class="legend">
  <span><b>曲柄+车轮</b> 1.2s / 圈</span>
  <span><b>腿部</b> 髋→膝→脚 两段 IK 逐帧解算</span>
  <span><b>近/远侧腿</b> 相位差 180°</span>
  <span><b>视差</b> 远山 44s · 树 22s · 路面 1.15s</span>
</div>

</body>
</html>
