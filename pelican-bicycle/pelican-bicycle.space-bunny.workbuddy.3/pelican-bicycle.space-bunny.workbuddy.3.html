<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#f4f7fa; color:#22303c;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:28px 16px 44px;
  }
  h1{font-size:19px;margin:0 0 4px;letter-spacing:.4px}
  .sub{font-size:13px;color:#7c8b99;margin:0 0 18px}
  .stage{
    width:min(940px,100%); background:#fff; border:1px solid #e6ecf1;
    border-radius:16px; overflow:hidden; box-shadow:0 10px 34px rgba(34,48,60,.08);
  }
  svg{display:block;width:100%;height:auto}
  .legend{
    width:min(940px,100%); margin-top:14px; display:flex; flex-wrap:wrap; gap:8px 18px;
    font-size:12.5px; color:#7c8b99; justify-content:center;
  }
  .legend b{font-weight:600;color:#4b5c6b}

  svg *{transform-box:view-box}

  /* --- one crank revolution drives everything --- */
  .spin-rear {animation:spin 1.2s linear infinite; transform-origin:255px 350px}
  .spin-front{animation:spin 1.2s linear infinite; transform-origin:545px 350px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* --- ground: period matches the distance the wheels actually roll --- */
  .road  {animation:ground 1.04s linear infinite}
  .tuft  {animation:ground 1.04s linear infinite}
  @keyframes ground{from{transform:translateX(0)}to{transform:translateX(-300px)}}

  /* --- distant layers: exactly one viewport per cycle --- */
  .far {animation:pan 44s linear infinite}
  .mid {animation:pan 22s linear infinite}
  .tree{animation:pan 9s linear infinite}
  @keyframes pan{from{transform:translateX(0)}to{transform:translateX(-900px)}}

  .cloud-a{animation:drift 46s linear infinite}
  .cloud-b{animation:drift 68s linear infinite}
  @keyframes drift{from{transform:translateX(-340px)}to{transform:translateX(1240px)}}

  .bob{animation:bob 1.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}25%{transform:translateY(-4px)}75%{transform:translateY(3px)}}

  .wing{animation:wing 1.2s ease-in-out infinite; transform-origin:352px 200px}
  @keyframes wing{0%,100%{transform:rotate(6deg)}50%{transform:rotate(-9deg)}}

  .neck{animation:neck 1.2s ease-in-out infinite}
  @keyframes neck{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

  .blink{animation:blink 5.2s infinite; transform-box:fill-box; transform-origin:center}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}

  .speed{animation:speed 1.04s linear infinite}
  @keyframes speed{
    from{transform:translateX(0);opacity:0}
    25%{opacity:.7}
    to{transform:translateX(-320px);opacity:0}}

  @media (prefers-reduced-motion: reduce){ svg *{animation:none !important} }
</style>
</head>
